# MODULE 1 · OWNERSHIP — Move / Copy / Clone & the borrow checker

[[exercises]]
name = "ownership1"
dir = "24_ownership_model"
hint = """
The helper takes `String` by value, which MOVES it and drops it at the end of
the call — but the caller still needs `text` afterwards. Counting only READS the
string, so borrow instead: change the signature from `fn count_chars(text: String)`
to `fn count_chars(text: &str)`, and call it as `count_chars(&text)`. `&String`
coerces to `&str`. Borrowing doesn't transfer ownership, so `text` stays usable."""

[[exercises]]
name = "ownership2"
dir = "24_ownership_model"
hint = """
`let q = p;` is a MOVE for non-`Copy` types; after the move `p` is invalid, so the
later `assert_eq!(p, ..)` is a use-after-move. Give the all-integer `Point` the
`Copy` trait (Rust requires deriving `Clone` alongside it):
`#[derive(Debug, PartialEq, Clone, Copy)]`. Now `let q = p;` is a bitwise copy and
both `p` and `q` stay usable. Contrast `String`, which is not `Copy` and needs
`.clone()` to get a second independent owner."""

[[exercises]]
name = "ownership3"
dir = "24_ownership_model"
hint = """
`let first = &data[0];` is a shared borrow, while `data.push(..)` needs an
exclusive (mutable) borrow; since `first` is used after the push, the shared borrow
is still alive and the two overlap — violating aliasing XOR mutability. Because
index 0 is an `i32` (a `Copy` type), copy the value out to end the borrow:
`let first = data[0];` (drop the `&`), then `data.push(first + 10);`. Now no borrow
of `data` is live during the push."""

[[exercises]]
name = "ownership4"
dir = "24_ownership_model"
hint = """
Part A, `flush`: E0507 "cannot move out of `self.buf` which is behind a mutable
reference". `&mut self` gives you exclusive access, not ownership. The owner of the
`Batch` will use `buf` again (and drop it), so `buf` can never be left empty.
Move the `Vec` out and put an empty one back in the same step:
```
fn flush(&mut self) -> Vec<Event> {
    self.flushed += self.buf.len();
    std::mem::take(&mut self.buf)
}
```
`mem::take` leaves `Vec::default()` (that is `Vec::new()`, which does not allocate)
and returns the old `Vec` itself. So the caller gets the same heap buffer (the
pointer test checks this) and nothing is copied. If the batch should start again
with a preallocated buffer, `mem::replace(&mut self.buf, Vec::with_capacity(n))`
does the same job with a placeholder you choose. These shortcuts fail: deriving
`Clone` for `Event` and cloning (copies every event),
`self.buf.drain(..).collect()` or `self.buf.split_off(0)` (move the events into a
NEW allocation), `mem::take(self)` with a derived `Default` on `Batch` (it also
resets `flushed`), and `fn flush(self)` (consumes the batch, but the tests flush
it again).

Part B, `present`: two E0507s. `let old_front = self.front;` moves a field out
and puts nothing back, and so does `self.front = self.back;`. Swap the two values
in one operation:
```
fn present(&mut self) {
    std::mem::swap(&mut self.front, &mut self.back);
    self.back.clear();
}
```
Only the three-word `Vec` headers move, so the heap buffers trade places and a
running double buffer never allocates. `self.front = mem::take(&mut self.back);`
compiles but throws the old front's allocation away, so the next frame has to
allocate again. `append` and `extend` move the events into the other buffer's
allocation instead of letting the two allocations trade places. The pointer tests
reject all of these. `mem::swap` needs two `&mut` to different places, which is
fine here: `self.front` and `self.back` are disjoint fields (a split borrow, see
`37_borrowck_errors/borrowck1`). `Option::take()`, used in
`27_data_structures/linkedlist1`, is the same idea for an `Option`."""

[[exercises]]
name = "ownership5"
dir = "24_ownership_model"
hint = """
`on_connected`: E0507 "cannot move out of `self.addr` as enum variant `Connecting`
which is behind a mutable reference". The pattern moves `addr` out of `*self`,
which you only borrow. Then `*self = ...` would drop the old value, which still
contains that `String`: a double free. Take the whole old state out by value,
leave a placeholder behind, and write a real state back in every arm:
```
match std::mem::replace(self, Conn::Closed) {
    Conn::Connecting { addr } => {
        *self = Conn::Connected { addr, session };
        Ok(())
    }
    other => {
        // Not our event: put the old state back.
        *self = other;
        Err(session)
    }
}
```
If you forget the write-back in the `other` arm, an `Idle` or a live `Connected`
connection turns into `Closed`, and the tests check for that. Two alternatives
also work. You can add `#[derive(Default)]` to `Conn`, with `#[default]` on `Idle`,
and use `mem::take(self)`. Or, because only a `String` moves, write
`if let Conn::Connecting { addr } = self` (so `addr` is a `&mut String`), then
`let addr = std::mem::take(addr);` before the assignment. `addr.clone()` compiles
too, but the pointer test rejects it.

`close`: E0507 "cannot move out of `self.session` as enum variant `Connected`
which is behind a mutable reference". Here the placeholder IS the next state, so
the whole transition is one `mem::replace`:
```
match std::mem::replace(self, Conn::Closed) {
    Conn::Connected { session, .. } => Some(session),
    Conn::Idle | Conn::Connecting { .. } | Conn::Closed => None,
}
```
`Session` has no `Default`, so you can't `mem::take` just that field. Swapping a
made-up session into it (`mem::replace(session, Session::new(0, ""))`) compiles,
but the stand-in is dropped along with the old state, and the drop-counting test
catches that. If a panic happened between `mem::replace` and the write-back, the
`Conn` would be left `Closed`. That is valid, just not what you wanted, which is
why the placeholder should be a state that means something. Crates like
`take_mut` and `replace_with` let a closure consume `*self`, but they abort on
panic or ask you for a fallback value."""

[[exercises]]
name = "ownership6"
dir = "24_ownership_model"
hint = """
E0509 "cannot move out of type `Connection<'_>`, which implements the `Drop`
trait". You own `self`, so a partial move would normally be fine (see `Frame`).
But `Drop::drop(&mut self)` still runs when `into_pending` returns, and it needs
the whole value. Leave a valid value in the field instead of a hole. That needs
a mutable binding for `self`:
```
fn into_pending(mut self) -> Vec<u8> {
    std::mem::take(&mut self.pending)
}
```
`mut self` does not change the API. The `mut` belongs to the local binding inside
the function: callers still write `conn.into_pending()` and lose `conn`, and a
trait method declared as `fn f(self)` can be implemented as `fn f(mut self)`.
`drop` then runs once, at the end of the method, on the leftover connection, and
logs "closed with 0 pending bytes". That is correct, because the caller owns the
bytes now. These fail: `self.pending.clone()` (rustc's suggestion; it copies the
bytes, and the close log still reports them as pending), removing the `Drop` impl
(no close log), `mem::forget` or `ManuallyDrop` (they skip `drop`, so no log, and
the other fields leak; clippy also denies `mem::forget` in this course),
`drain(..).collect()` (a new allocation), and `&mut self` (the connection is not
consumed, so the tests no longer compile). If a field has no cheap `Default`,
store it as `Option<T>`, `take()` it, and make `drop` handle `None`. std's
`io::BufWriter::into_parts` uses `ManuallyDrop` plus `unsafe { ptr::read(..) }`
instead, and this course forbids `unsafe`."""

# MODULE 1 · LIFETIMES — lifetime parameters, elision, explicit annotations

[[exercises]]
name = "lifetimes4"
dir = "25_lifetimes_deep"
hint = """
A struct that holds a reference must declare a lifetime — the error is "missing
lifetime specifier". Add a lifetime parameter and tie the field to it:
```
struct Excerpt<'a> {
    part: &'a str,
}
```
This says "an `Excerpt<'a>` may not outlive the `&'a str` it borrows"."""

[[exercises]]
name = "lifetimes5"
dir = "25_lifetimes_deep"
hint = """
Two reference parameters and a reference return: elision can't tell which input
the result borrows from, so you must annotate. The return borrows from `prefix`,
not `separator`, so give only `prefix` and the return type the same `'a`:
```
fn first_token<'a>(prefix: &'a str, separator: &str) -> &'a str
```
`separator` keeps its own (elided) lifetime. The test deliberately drops
`separator` early to prove the result is tied only to `prefix`."""

[[exercises]]
name = "lifetimes6"
dir = "25_lifetimes_deep"
hint = """
In a method, elision ties the returned reference to `&self` by default, so the
result can't outlive the `Parser`; the test drops `parser` in an inner block and
then uses `rest`, giving "does not live long enough". The value actually returned
is the underlying `text` (lifetime `'a`), so annotate the method's return type
explicitly to override the too-short default: `fn remainder(&self) -> &'a str { self.text }`."""

[[exercises]]
name = "lifetimes7"
dir = "25_lifetimes_deep"
hint = """
E0308 "mismatched types ... expected `&str`, found `String`" (then `Arc<str>`,
`Counted` and `Traced`): a `&'static str` parameter only accepts text that is
never freed (literals, `static`s, leaked strings). What `thread::spawn` really
needs is a value the new thread can OWN and keep for as long as it likes. That
is the `T: 'static` BOUND, not a `&'static` reference. Make the function
generic, then add the bounds rustc asks for one at a time (E0277 "`T` cannot be
sent between threads safely", then E0310 "the parameter type `T` may not live
long enough"):
```
use std::fmt::Display;

fn spawn_logger<T: Display + Send + 'static>(msg: T) -> JoinHandle<String> {
    thread::spawn(move || format!("[log] {msg}"))
}
```
`msg: impl Display + Send + 'static` is the same bound, and
`T: ToString + Send + 'static` with `msg.to_string()` inside the closure works
too. Don't add `Sync`: the message is moved to the logger thread, never shared,
and the `Counted` test (its `Cell` makes it `Send` but not `Sync`) would fail
with E0277 "`Cell<u32>` cannot be shared between threads safely". `String`,
`Arc<str>`, `Counted` and `Traced` own their data (or borrow only `'static`
data), so they are `'static`, and every one of them is dropped when the logger
thread finishes: `'static` constrains the TYPE, it does not make the value live
forever. Formatting on the caller's side (`let line = format!(..);` and then
spawning a closure that just returns `line`) needs no `'static` bound at all,
but a test checks that the message was formatted and dropped on the logger
thread. Passing `&local` is still rejected (E0597 "`local` does not live long
enough ... argument requires that `local` is borrowed for `'static`"). If the
threads only need to BORROW and you join them before returning, use
`std::thread::scope` instead. See also `20_threads` and, later, the
`Send + 'static` bound in `29_async_runtime/runtime3`."""

[[exercises]]
name = "lifetimes8"
dir = "25_lifetimes_deep"
hint = """
E0310 "the parameter type `impl Fn(&str)` may not live long enough": `Handler`
is `Box<dyn Fn(&str)>`, and a boxed trait object written in a signature, field
or type alias defaults to `+ 'static`. The `impl Fn(&str)` parameter has no such
bound (it may borrow locals), so rustc refuses to box it as a `'static` handler.
Don't take rustc's `+ 'static` suggestion: the tests' closures borrow `log`,
`count` and `seen`, so it turns into E0373 "closure may outlive the current
function, but it borrows `log`" (and E0505 where a test moves `log`). Give the
bus a lifetime parameter and put it on the trait object, so handlers may borrow
anything that outlives the bus:
```
type Handler<'a> = Box<dyn Fn(&str) + 'a>;

struct EventBus<'a> {
    handlers: Vec<Handler<'a>>,
}

impl<'a> EventBus<'a> {
    // `new` and `emit` do not change.
    fn on(&mut self, f: impl Fn(&str) + 'a) {
        self.handlers.push(Box::new(f));
    }
}
```
Both halves are needed. A lifetime on the method alone (`fn on<'a>(..)`) leaves
the field's `Box` at `'static`, so E0310 stays, and `EventBus<'a>` without
`+ 'a` on `f` gives E0309 "the parameter type `impl Fn(&str)` may not live long
enough". `fn on<F: Fn(&str) + 'a>(&mut self, f: F)` is the same bound with a
named generic, and the alias is optional (`Vec<Box<dyn Fn(&str) + 'a>>`). A
`move` closure that owns its state is still accepted, because a `'static` type
outlives any `'a`. The defaults to remember: `Box<dyn Trait>`, `Rc<dyn Trait>`
and `Arc<dyn Trait>` mean `+ 'static`, and `&'a dyn Trait` means
`&'a (dyn Trait + 'a)`. Declare borrowed data BEFORE the bus: the bus is dropped
first, and rustc assumes a `dyn Fn` may use its borrows in its destructor
(E0597 otherwise). See also `33_closures/closure1` for E0373 and
`35_error_design/err2` for `dyn Error + 'static`."""

[[exercises]]
name = "lifetimes9"
dir = "25_lifetimes_deep"
hint = """
E0515 "cannot return reference to function parameter `s`": `s` is dropped when
the function returns, so `&s` would dangle, and no annotation changes that. A
`&'static str` needs text that is never freed, so give up ownership of the heap
buffer on purpose:
```
fn leak_config(s: String) -> &'static str {
    Box::leak(s.into_boxed_str())
}
```
`s.leak()` (`String::leak`, Rust 1.72) works too, and also leaks any spare
capacity. `Box::leak(Box::new(s))` works as well, but leaks the `String` header
on top of the text. Copying first (`s.clone()`, `to_owned()`, `format!`) fails
the heap-address test, and a `static OnceLock<String>` can be set only once, so
the second config would come back as the first. Leaking is safe (no `unsafe`,
nothing dangles), and clippy's `mem_forget` lint, which only looks for calls to
`std::mem::forget`, does not fire. It is the right call only for a bounded amount
of data that has to live until exit anyway (config, command-line arguments),
never once per call: in `37_borrowck_errors/borrowck2`, leaking to escape E0515
is the wrong answer. The module README contrasts this with `OnceLock` and
`LazyLock` for a single global value."""

# MODULE 1 · BORROW-CHECKER ERRORS — read the error, then fix the design
# (E0499 / E0502 / E0515 / E0716 / E0382; interview drills, std + safe)

[[exercises]]
name = "borrowck1"
dir = "37_borrowck_errors"
hint = """
Part A — `swap_titles`: E0499 "cannot borrow `tickets[_]` as mutable more than
once at a time". The borrow checker tracks PLACES, not index values: it never
evaluates `i` or `j`, so `&mut tickets[i]` and `&mut tickets[j]` are both the
place `tickets[_]`, and `a` is still used on the `swap` line when `b` is made.
It is right to refuse, because `i == j` really can happen. Ask the slice for two
references it has CHECKED are disjoint, and map its errors onto yours:
```
use std::slice::GetDisjointMutError;

let [a, b] = tickets.get_disjoint_mut([i, j]).map_err(|e| match e {
    GetDisjointMutError::OverlappingIndices => SwapError::SameIndex,
    GetDisjointMutError::IndexOutOfBounds => SwapError::OutOfBounds,
})?;
mem::swap(&mut a.title, &mut b.title);
Ok(())
```
Alternative (the tool rustc's own help line suggests): do the `i == j` and bounds
checks yourself, then `split_at_mut` at the larger index so the two tickets land
in different halves:
```
if i == j {
    return Err(SwapError::SameIndex);
}
let (lo, hi) = (i.min(j), i.max(j));
if hi >= tickets.len() {
    return Err(SwapError::OutOfBounds);
}
let (left, right) = tickets.split_at_mut(hi);
mem::swap(&mut left[lo].title, &mut right[0].title);
Ok(())
```
The tests catch the usual shortcuts. `tickets.swap(i, j)` moves the ids too.
`.unwrap()` panics on bad input. `.clone()` / `to_string()` copy the titles
instead of moving them (the tests compare heap pointers).

Part B — `commit`: E0499 "cannot borrow `*ed` as mutable more than once at a
time". The borrow checker only reads signatures, and `fn buffer_mut(&mut self)`
says "the result borrows ALL of `*self`". So while `buffer` is alive, calling
`history_mut()` borrows the whole editor a second time. Borrow the two FIELDS
instead. They are disjoint places, so both `&mut` can be live at once (a "split
borrow"):
```
let Editor { buffer, history } = ed;
history.push(mem::take(buffer));
```
(`let buffer = &mut ed.buffer; let history = &mut ed.history;` does the same
thing.) If the fields were private to another module, write ONE method that
borrows `self` once and hands out the pieces, then call it with
`let (buffer, history) = ed.parts_mut();`:
```
fn parts_mut(&mut self) -> (&mut String, &mut Vec<String>) {
    (&mut self.buffer, &mut self.history)
}
```
Doing the accessor calls one after the other also compiles:
`let text = mem::take(ed.buffer_mut()); ed.history_mut().push(text);`. Each
borrow ends before the next one starts, but this avoids the interview question
instead of answering it. Why not `RefCell`? It moves the same check to run time,
where `i == j` becomes a "RefCell already borrowed" panic (see
`31_debugging/debugging4`), and it changes the type for every user."""

[[exercises]]
name = "borrowck2"
dir = "37_borrowck_errors"
hint = """
Three functions, three versions of "the owner is already gone".

`header_columns`, E0716 "temporary value dropped while borrowed": the `String` from
`line.to_lowercase()` is an unnamed temporary. It is freed at the `;` of the
`let names` statement, but `names` (a `Vec<&str>` pointing into it) is read on the
next line. A method receiver is not a temporary-lifetime-extension position, so
nothing keeps it alive. Give it a name so it lives to the end of the function:
```
let lower = line.to_lowercase();
let names: Vec<&str> = lower.split(',').map(str::trim).collect();
names.iter().map(|s| s.to_string()).collect()
```
Or build the owned names in ONE statement, while the temporary is still alive:
`line.to_lowercase().split(',').map(|s| s.trim().to_string()).collect()`.

`shout_longest`, E0515 "cannot return reference to local variable `shouted`":
`shouted` is dropped when the function returns. `-> &'a str` promises a borrow of
`a` or `b`, and the shouted text is neither (uppercasing does not even map one char
to one char: "ß" becomes "SS"). No lifetime annotation fixes that: the caller has
to own the new text. Return the `String` and drop the now-needless lifetimes:
```
fn shout_longest(a: &str, b: &str) -> String {
    let longest = if a.len() >= b.len() { a } else { b };
    format!("{}!", longest.to_uppercase())
}
```
`Box::leak` / `String::leak` would compile, but they leak memory on every call, and
a test rejects them. If the caller wants to reuse an allocation, the other good
answer is to write into a caller-provided buffer (`out: &mut String`).

`first_word`, E0515 "cannot return value referencing local variable `trimmed`":
the slice from `split` points into `trimmed`, a local `String` copy that dies on
return. Here the `&str` signature is RIGHT, so stop copying and slice the input
itself. `trim` and `split` on a `&str` return sub-slices of that same `&str`:
```
fn first_word(s: &str) -> &str {
    s.trim().split(' ').next().unwrap_or("")
}
```
`s.split_whitespace().next().unwrap_or("")` works too, and there the
`unwrap_or("")` matters: `split_whitespace` yields nothing for empty or all-space
input. (`split` always yields at least one piece, so after it the fallback never
fires.) With a single input reference, elision writes the `'a` for you; keep the
`<'a>` and clippy's `needless_lifetimes` will point that out. A test checks that
the result points INTO the input, so copies and leaks fail. For "usually return the
input unchanged, sometimes build new text", the tool is `Cow<'a, str>` (covered
later). See also `16_lifetimes/lifetimes1` and `25_lifetimes_deep/lifetimes5`."""

[[exercises]]
name = "borrowck3"
dir = "37_borrowck_errors"
hint = """
Both functions fail with E0499 "cannot borrow `*map` (or `*items`) as mutable more
than once at a time", with the note "returning this value requires that `*map` is
borrowed for `'1`" (or `*items` for `'a`). The first borrow MIGHT be returned, so it
must last for the caller's whole lifetime. NLL's outlives constraints are
location-insensitive: a requirement that arises on one path holds on every path. So
the borrow still counts as live on the miss path, where `insert`/`push` take a
second `&mut`. This is a known false positive: it is "problem case #3" in the NLL
RFC (RFC 2094). The RFC's design aimed to accept it, but the NLL that shipped does
not. Polonius, the next-generation borrow checker, accepts this code unchanged, but
it is nightly-only. On stable, restructure so no borrow crosses the conditional
return.

Part A: use the entry API. It takes ONE mutable borrow, hashes and looks up `key`
once, and returns a reference into the map for either outcome:
```
map.entry(key).or_default()
```
`or_insert_with(String::new)` compiles too, but clippy's `unwrap_or_default` lint
asks for `or_default()` instead. A `contains_key` check followed by `get_mut` also
compiles, but it looks the key up twice on a hit and three times on a miss (and
clippy's `map_entry` lint flags the `contains_key` + `insert` pair). Copying the
stored value (`.cloned()`, then `insert`) compiles as well, but the tests compare
heap pointers, so it fails them. Interview detail: `entry` takes the key BY VALUE,
so with `String` keys you would build the owned key even on a hit.

Part B: `Vec` has no entry API, so search for the INDEX. `position` borrows `items`
only while it searches and returns a plain `usize` (not a borrow), so nothing
borrowed reaches the `push`:
```
let index = match items.iter().position(|i| i.name == name) {
    Some(index) => index,
    None => {
        items.push(Item {
            name: name.to_string(),
            count: 0,
        });
        items.len() - 1
    }
};
&mut items[index]
```
An early `return &mut items[index];` followed by `push` and
`items.last_mut().unwrap()` works too. Do not reach for `.clone()`, `Box::leak`,
`unsafe`, or removing and re-pushing items. The tests check that writes through
the returned reference land in the collection, that a hit returns the stored value
itself (not a copy), that nothing is duplicated and that insertion order is kept.
For NLL ending a borrow at its last use (why a borrow that is only used locally
would be fine), see `24_ownership_model/ownership3`."""

[[exercises]]
name = "borrowck4"
dir = "37_borrowck_errors"
hint = """
Part A: E0502 "cannot borrow `*log` as immutable because it is also borrowed as
mutable". By elision, `fn push(&mut self, entry: String) -> &str` means
`fn push<'a>(&'a mut self, entry: String) -> &'a str`. The returned `&str` keeps the
EXCLUSIVE borrow of the whole `Log` alive for as long as `stored` is used, even
though the `&str` is read-only. Rust never "downgrades" that borrow to a shared one,
and Polonius rejects this code too. A downgrade would be unsound: with
`fn peek(c: &mut Cell<i32>) -> &i32 { c.get_mut() }`, `c.set(..)` could change the
value under your `&i32`. So `log.len()` conflicts with `stored`. Fix it in the API:
make the mutating method return no borrow, then read back through the `&self`
accessors. Their shared borrows can coexist:
```
fn push(&mut self, entry: String) {
    self.entries.push(entry);
}
```
```
log.push(entry.to_string());
let stored = log.last().expect("`push` just stored an entry");
format!("#{}: {stored}", log.len())
```
Another API-level fix: have `push` return a `Copy` handle (the new length or the
index) instead of a reference. Keeping `push` as it is and just not holding its
result also compiles, but it leaves the trap in the API for the next caller.
Copying the text out (`.to_owned()`) compiles too. But it pays for an allocation to
get around a design problem, and interviewers push back on that answer.

Part B: E0382 "use of moved value: `buf`". `&mut String` is not `Copy` (two copies
would be two live exclusive references), so passing `buf` by value moves it. With
`fn f(x: &mut String)` the compiler quietly rewrites `f(buf)` as `f(&mut *buf)`, an
implicit reborrow. That coercion only happens when the parameter type is already
known to be `&mut _`. `append_all`'s parameter is a bare generic `W`, so `buf`
itself gets moved into the first call. Reborrow explicitly, as rustc's `help:` line
suggests:
```
append_all(&mut *buf, &["a", "b"])?;
append_all(buf, &["c"])
```
`&mut *buf` is a new, shorter-lived `&mut String`, and `buf` is only frozen while that
call runs. The last call may move `buf` because nothing uses it afterwards. Writing
`&mut *buf` in both calls is fine too.

Alternatives that show the rule at work: name the type so the expected type is
known (`append_all::<&mut String>(buf, ..)`, or `let first: &mut String = buf;`).
You can also declare `mut buf` and pass `&mut buf`, which works through
`impl Write for &mut W` but adds a level of indirection. Don't change `append_all`
to take `&mut W`. Taking writers by value (Rust API Guidelines C-RW-VALUE) is what
lets a test pass an adapter like `Shout(&mut buf)`. `Iterator::by_ref()` and
`io::Write::by_ref()` spell that borrow as a method call, so you can hand your
iterator or writer to a by-value API and keep using it. `fmt::Write` has no
`by_ref`. See also `24_ownership_model/ownership3` (shared XOR exclusive) and
`25_lifetimes_deep/lifetimes6` (the `&self` elision rule)."""

# MODULE 1 · SMART POINTERS — Box / Rc·Weak / RefCell

[[exercises]]
name = "smartptr1"
dir = "26_smart_pointers_deep"
hint = """
`Cons(i32, List)` stores a `List` inline, giving the type infinite size —
"recursive type has infinite size". Put the tail behind a fixed-size pointer on the
heap to break the recursion: `Cons(i32, Box<List>)`. Now each node is one `i32` plus
one pointer — a known size. Wrap the successor node with `Box::new(...)` when
building it."""

[[exercises]]
name = "smartptr2"
dir = "26_smart_pointers_deep"
hint = """
A child should hold only a WEAK reference to its parent to avoid a reference
cycle; `link_to_parent` must return a `Weak<Node>` pointing at `parent`. An empty
body returns `()`, which mismatches `Weak<Node>` — a compile error. Downgrade with
`Rc::downgrade` (the parameter is already `&Rc<Node>`, so pass `parent` directly):
```
fn link_to_parent(parent: &Rc<Node>) -> Weak<Node> {
    Rc::downgrade(parent)
}
```
A weak reference doesn't raise the strong count (`strong_count` unchanged,
`weak_count` +1), and `.upgrade()` returns `Some(Rc)` while the parent is alive."""

[[exercises]]
name = "smartptr3"
dir = "26_smart_pointers_deep"
hint = """
You only have a shared `&Rc<RefCell<Vec<i32>>>`; `RefCell`'s interior mutability
lets you mutate the data through a shared reference. An empty body returns `()`,
which mismatches the declared `usize` — a compile error. Complete it by borrowing
mutably, pushing, and returning the new length:
```
let mut data = handle.borrow_mut();
data.push(value);
data.len()
```
Because several `Rc` handles point at the same cell, a change made through one
handle is visible through another."""

# MODULE 1 · Drop and RAII: Drop Order, Guards and Leaks

[[exercises]]
name = "drop1"
dir = "39_drop_raii"
hint = """
Each `quiz_*` test compares the real log with your constant, so it fails until
the prediction is exact. Every answer follows from two rules. A value is
dropped exactly once, when its CURRENT owner goes away. When several owners go
away at the same point, bindings go in REVERSE order of declaration, while the
parts of one value (struct fields, tuple, array and `Vec` elements) go
FORWARD, after the value's own `Drop::drop`:
```
const S_LOCALS: &[&str] = &["end of body", "last", "list[0]", "list[1]", "first"];
const S_LET_UNDERSCORE: &[&str] = &["temporary", "end of body", "named", "guard"];
const S_FIELDS: &[&str] = &["end of body", "request", "header", "body"];
const S_PARAMS: &[&str] = &["end of body", "local", "second", "first", "returned"];
const S_MOVES: &[&str] = &["a", "old", "end of body", "b", "new"];
```
`locals`: the three locals go last-declared first, and the `Vec` drops its
items front to back. `let_underscore`: `_` binds nothing, so
`let _ = Noisy(..);` leaves a temporary that dies at the `;` (that is why
rustc's deny-by-default `let_underscore_lock` lint rejects
`let _ = m.lock().unwrap();`). `let _ = named;` does not move `named` at all,
so it lives to the end of the scope; `_guard` is an ordinary binding.
`fields`: `Request::drop` runs first, with every field intact, then the
fields in DECLARATION order; the order of the struct literal only decides
creation. `params`: the parameters own the arguments and are dropped when
`handle` returns, after its locals, in reverse order (a bare `_` parameter
too). `moves`: `drop(a)` is an empty function that takes `a` by value, the
assignment drops "old" on the spot, and "b" now belongs to `_moved`, declared
after `_slot`, so it goes before "new". The README has a cheat sheet, and the
Reference's "Destructors" chapter has the full rules."""

[[exercises]]
name = "drop2"
dir = "39_drop_raii"
hint = """
Each `quiz_*` test fails until its constant matches the real log exactly. A
temporary is dropped at the end of the smallest enclosing temporary scope: a
statement, an `if` or `while` condition, and (since edition 2024) a block's
tail expression. Temporaries that end at the same point go in reverse order of
creation. The exception is lifetime extension: `let x = &temp;` makes the
temporary live until the end of the block, like a hidden local declared at
that statement:
```
const S_STATEMENT: &[&str] = &["right", "left", "next statement"];
const S_BORROWED: &[&str] = &["end of body", "local", "borrowed"];
const S_TAIL: &[&str] = &["tail", "local", "after the block"];
const S_IF_CONDITION: &[&str] = &["condition", "then block", "after the if"];
```
In edition 2021 `S_TAIL` would be `["local", "tail", "after the block"]`: the
tail temporary lived to the end of the enclosing `let`, which is why
`{ let c = RefCell::new(..); c.borrow().len() }` used to be E0597. To see it
without editing the course's `Cargo.toml` (other exercises need 2024), run
`rustc --edition 2021 --test exercises/39_drop_raii/drop2.rs -o target/drop2 && target/drop2`
from the rustlings directory. A method call on a temporary is not extended:
`let s = String::from("hi").as_str();` is E0716 as soon as `s` is used
(`37_borrowck_errors/borrowck2`). `match`, `if let` and `while let`
scrutinees follow other rules again; they keep a guard alive through the arms
or the body, which `31_debugging/debugging6..8` turns into real bugs."""

[[exercises]]
name = "raii1"
dir = "39_drop_raii"
hint = """
E0507 "cannot move out of `self.f` which is behind a mutable reference":
calling an `FnOnce` consumes it, and `drop` only has `&mut self`. Give `drop`
something it can take: store the closure in an `Option` and `take()` it,
which leaves `None` behind (`mem::take` would need `F: Default`, and closures
are not `Default`):
```
struct Defer<F: FnOnce()> {
    f: Option<F>,
}

impl<F: FnOnce()> Defer<F> {
    fn new(f: F) -> Self {
        Defer { f: Some(f) }
    }

    fn cancel(mut self) {
        self.f = None; // drops the closure now; `drop` then finds nothing
    }
}

impl<F: FnOnce()> Drop for Defer<F> {
    fn drop(&mut self) {
        if let Some(f) = self.f.take() {
            f();
        }
    }
}
```
Keep the `#[must_use]` attribute on the struct. `cancel` cannot stop `drop`
from running when it returns; it can only disarm it. `mut self` changes only
the local binding, not what callers see (`24_ownership_model/ownership6`).
These fail: `F: FnMut()` or `F: Fn()` (E0507 again, now inside the test
closures that move a captured value out, which makes them `FnOnce` only),
`F: Clone` or `F: Copy` plus calling a copy (E0277: those closures capture a
`Receipt`, an `Rc` or a `&mut`), `mem::forget(self)` in `cancel` (it leaks the
closure, a test counts its `Rc`, and clippy denies it), and
`cancel(&mut self)` (the tests call it on a non-`mut` binding, E0596). A
non-generic `Option<Box<dyn FnOnce() + 'a>>` would pass the tests too, but
the TODO rules it out: it costs an allocation and a lifetime parameter. The
`scopeguard` crate is the production version of this guard."""

[[exercises]]
name = "raii2"
dir = "39_drop_raii"
hint = """
`dropping_without_commit_rolls_back` fails: nothing undoes an uncommitted
transaction, so the store is `[1, 2]` instead of `[1]`. `Drop` is the one
place that runs on every way out (end of scope, `return`, `?`, a panic that
unwinds), so roll back there. And because `drop` also runs on the `Tx` that
`commit` consumes, `commit` must leave it a note:
```
use std::mem;

    // in `impl<'a> Tx<'a>`:
    fn commit(mut self) {
        self.committed = true;
    }

impl Drop for Tx<'_> {
    fn drop(&mut self) {
        if !self.committed {
            mem::swap(self.store, &mut self.snapshot);
        }
    }
}
```
Assigning a field of an owned `self` is fine in a `Drop` type; only moving one
out is E0509 (`24_ownership_model/ownership6`). `mem::swap` (or
`*self.store = mem::take(&mut self.snapshot)`) moves the snapshot back without
copying; `self.store.clone_from(&self.snapshot)` also passes but copies. These
fail: `truncate(snapshot.len())` or popping the pushes (the cleared-rows test),
rolling back unconditionally or leaving `commit` empty (the commit tests), and
`commit(&mut self)` (the `tx` then stays alive until the end of the test and
its `drop` still needs the `&mut store` borrow: E0502 / E0499 in the tests).
Don't skip `drop` in `commit` with `mem::forget(self)` or
`ManuallyDrop::new(self)` either: the tests cannot see it, but it leaks the
snapshot (and clippy denies `mem::forget`). Keep `drop` panic-free: a panic in
`drop` during unwinding aborts the process. An `Option<Vec<i32>>` snapshot
that `commit` sets to `None` is an equivalent design without the flag.
`rusqlite::Transaction` and `sqlx::Transaction` roll back on drop the same
way."""

[[exercises]]
name = "raii3"
dir = "39_drop_raii"
hint = """
E0597 "`roster` does not live long enough ... when `on_duty` is dropped and
runs the `Drop` code for type `Vec`". Locals are dropped in reverse order, so
`on_duty` (declared first) is dropped after `roster`, and every
`Inspector::drop` would read a day count that is already freed. The drop
check assumes a `Drop` impl may use every reference in the value, so what it
borrows must STRICTLY outlive it. Declare the roster first:
```
fn run_shift(text: &str) -> usize {
    let roster = Roster::parse(text);
    let mut on_duty = Vec::new();
    for days in roster.days_left() {
        on_duty.push(Inspector(days));
    }
    on_duty.len()
}
```
Now the inspectors retire, front to back, before "roster of N freed". Without
`impl Drop for Inspector` the original order compiles, and so does
`count_short`: std writes `unsafe impl<#[may_dangle] T, A: Allocator> Drop for
Vec<T, A>`, a promise that `Vec::drop` never reads its elements, so dangling
`&u8`s are harmless; dropping an `Inspector` element, though, reads through its
reference. A `drop(on_duty)` at the end is not enough: if a `push` panicked,
unwinding would still drop `roster` first, and the checker rejects that path
too. Leaking the roster (`Box::leak`) compiles but loses the "freed" log line,
and removing `Inspector`'s `Drop` loses the inspector lines. See the
Rustonomicon's "Drop Check" chapter, where `Inspector` comes from."""

[[exercises]]
name = "raii4"
dir = "39_drop_raii"
hint = """
The drop counter stays at 0: `adopt` makes the parent own the child (in
`children`) and the child own the parent (in `parent`). That is a cycle of
strong `Rc`s whose counts never reach zero, so no `Drop` runs and both nodes
leak, safely (a leak is not undefined behavior). Make the child's link
non-owning with `Weak`, as in `26_smart_pointers_deep/smartptr2`:
```
use std::rc::{Rc, Weak};

struct Node {
    name: &'static str,
    parent: RefCell<Weak<Node>>,
    children: RefCell<Vec<Rc<Node>>>,
    drops: Rc<Cell<u32>>,
}

// in Node::new:
    parent: RefCell::new(Weak::new()),

fn parent(&self) -> Option<Rc<Node>> {
    self.parent.borrow().upgrade()
}

// in adopt:
    *child.parent.borrow_mut() = Rc::downgrade(parent);
```
`Rc::downgrade` bumps only the weak count, so the parent's strong count stays
at 1 and dropping the last handle frees it; `upgrade` returns `None` from then
on. `RefCell<Option<Weak<Node>>>` works too. Making `children` weak instead
breaks the other direction: a parent must own its children (the tests use
`children` as `Rc`s, and a child whose test handle is gone must survive).
Dropping the parent link entirely fails the `parent()` tests. The general rule
is that ownership flows one way (parent to children) and back-pointers only
observe; an arena addressed by index (`59_arena`) avoids reference counting
altogether."""

# MODULE 1 · Interior Mutability: Cell, OnceCell, OnceLock, LazyLock and Thread-Locals

[[exercises]]
name = "cell1"
dir = "40_interior_mutability"
hint = """
Part A — `get`: E0594 "cannot assign to `self.hits`, which is behind a `&` reference". A `&self` method cannot change a plain field. rustc's `help:` (`&mut self`) is the wrong fix here: the tests call `get` through an `Rc<Cache>` and through two `&Cache` at once, so it only moves the error into the tests (E0596 "cannot borrow data in an `Rc` as mutable", "cannot borrow `*a` as mutable, as it is behind a `&` reference"). A `Copy` counter that one thread owns needs `Cell<u32>`:
```
hits: Cell<u32>,                   // the field
hits: Cell::new(0),                // in `new`
self.hits.update(|hits| hits + 1); // in `get`
self.hits.get()                    // in `hits()`
```
`self.hits.set(self.hits.get() + 1)` does the same as `update` (stable since 1.88). `Cell<u32>` is `repr(transparent)`: exactly the layout of a `u32`. A `RefCell<u32>` or `Mutex<u32>` compiles too, but `the_cells_are_no_bigger_than_their_values` rejects it: the borrow flag or the lock makes the field bigger than a `u32`. An `AtomicU32` would pass the tests, but it pays for synchronization that a single-threaded cache never uses, which is why the TODO rules it out.

Part B — `remember` and `take_last`: E0599 "the method `get` exists for struct `Cell<String>`, but its trait bounds were not satisfied" (`String: Copy`). `Cell::get` returns a bitwise copy, and for a `String` that would mean two owners of one heap buffer. Move values in and out instead. `replace` is `mem::replace` and `take` is `mem::take`, both through a shared reference:
```
fn remember(&self, key: String) -> String {
    self.last.replace(key)
}

fn take_last(&self) -> String {
    self.last.take()
}
```
(`self.last.replace(String::new())` does the same as `take()`, and `let old = self.last.take(); self.last.set(key); old` the same as `replace`.) Cloning is out twice over: a `Cell<String>` never lends you a `&String` to clone from, and the tests compare heap pointers. A `RefCell<String>` has `replace` and `take` too, but the size test rejects its borrow flag. When you need to READ a non-`Copy` value without taking it out, reach for `RefCell` (a guard, `26_smart_pointers_deep/smartptr3`) or `OnceCell` (write once, `cell2`).

Why rustc lists the E0599s first: all type checking runs before borrow checking, and a function body that fails type checking is not borrow-checked at all."""

[[exercises]]
name = "cell2"
dir = "40_interior_mutability"
hint = """
Part A — `word_count`: `word_count_is_computed_once` fails with `left: 3, right: 1` because every call runs `count_words` again. Let the cell decide: `get_or_init` runs its closure only while the cell is empty, stores the result and returns a `&usize` either way.
```
fn word_count(&self) -> usize {
    *self.word_count.get_or_init(|| self.count_words())
}
```
The `*` copies the cached `usize` out. A hand-rolled `Cell<Option<usize>>` also works for a `Copy` value. A `Cell<usize>` where `0` means "not computed yet" does not: an empty text really has 0 words (`a_cached_zero_is_still_cached`).

Part B — `summary`: the starter builds first and asks second, so it builds a summary on every call and then `set` throws it away because the cell is already full (compute-then-set). Ask first:
```
fn summary(&self) -> &str {
    self.summary.get_or_init(|| self.build_summary())
}
```
`get_or_init` returns a `&String` borrowed for as long as `&self`, which coerces to `&str`. It is a plain reference with no guard, because nothing reachable through `&self` can replace a value once it is set. (Checking `self.summary.get()` first and calling `set` only when it is `None` also works; `get_or_init` does both in one call.) Try the same with a `RefCell<Option<String>>` and you get E0515 "cannot return value referencing temporary value": the `&str` would borrow the `Ref` guard, which dies when the method returns. Using ANOTHER cell inside the closure is fine (`build_summary` calls `word_count`). Calling `self.summary()` inside its own closure is not: every nested call finds the cell still empty and runs the closure again, so it recurses until the stack overflows. `Box::leak` or `String::leak` would also give you a `&str`, but they leak memory, and the test that checks that the `&str` points into `self.summary` rejects them.

Part C — `set_text`: with `&mut self` you need no interior mutability, and the borrow checker already guarantees that no `&str` from `summary()` is still alive. Empty both caches and compute nothing:
```
fn set_text(&mut self, text: String) {
    self.text = text;
    self.word_count.take();
    self.summary.take();
}
```
(`self.word_count = OnceCell::new();` works too.) Recomputing eagerly here fails `set_text_computes_nothing_by_itself`: staying lazy is the point of the cache. Why not `LazyCell`? Its initializer is fixed when the struct is built, so it cannot borrow the struct's own `text`."""

# DEEP DIVE · TRAITS & ABSTRACTION — dispatch, closures, iterators, error design
# (Prerequisites the async and concurrency modules assume; std + 100% safe.)

# TRAITS & ABSTRACTION · Trait objects & dispatch — dyn vs generics vs enum
[[exercises]]
name = "dispatch1"
dir = "32_dispatch"
hint = """
A `Vec<T>` stores one concrete `T` per slot, laid out end to end, so it cannot
hold both a `Circle` and a `Rectangle` at once. Erase the concrete type behind a
trait object: the element type is `Box<dyn Shape>`, a fat pointer (data ptr +
vtable ptr) that is the same size no matter which shape it points to. Return
`vec![Box::new(Circle { radius: 1.0 }), Box::new(Rectangle { width: 2.0, height:
3.0 })]` — each `Box::new(..)` coerces to `Box<dyn Shape>`. An empty body returns
`()` and mismatches the declared `Vec<Box<dyn Shape>>` return type, which is the
compile error you are seeing."""

[[exercises]]
name = "dispatch2"
dir = "32_dispatch"
hint = """
E0038 means `Widget` is not dyn-compatible ("object safe"), so `Box<dyn Widget>`
is rejected. The culprit is `fn duplicate(&self) -> Self`: a vtable needs a fixed,
known return layout, but each implementor returns a differently sized `Self`, so
that method cannot be dispatched through a trait object. Don't delete it — gate it
off the vtable with `where Self: Sized`. Change the trait method to
`fn duplicate(&self) -> Self where Self: Sized;` and add the same `where Self:
Sized` bound to each impl's `duplicate`. That keeps `duplicate` callable on
concrete `Button`/`Slider` while making `dyn Widget` legal again (`width` stays in
the vtable)."""

[[exercises]]
name = "dispatch3"
dir = "32_dispatch"
hint = """
`total_static` is the static-dispatch twin of `total_dynamic`: the body is
identical — `shapes.iter().map(|s| s.area()).sum()` — only the dispatch differs.
Because it is generic over one concrete `S: Shape`, the compiler monomorphizes it
(one specialized, inlinable copy per `S`, larger binary, homogeneous slice), while
`total_dynamic` shares a single copy and pays an indirect vtable call per element
that cannot inline. Same answer, different cost model. An empty body returns `()`
instead of `f64`, which is why it does not compile — return the sum."""

[[exercises]]
name = "dispatch4"
dir = "32_dispatch"
hint = """
Enum dispatch replaces the heap `Box` and the vtable hop with a `match` whose arms
inline like ordinary code — the price is a CLOSED variant set you must enumerate
here (outside code cannot add a shape). Write `area` by matching every variant and
destructuring its fields: `match self { Shape::Circle { radius } => PI * radius *
radius, Shape::Rectangle { width, height } => width * height }`. An empty or
non-exhaustive body will not compile: the function must return an `f64` on every
path, and `match` must cover both variants."""

[[exercises]]
name = "dispatch5"
dir = "32_dispatch"
hint = """
The tests fail because every `downcast_ref` returns `None`. In the closure, `s`
is a `&Box<dyn Shape>`, and `Box<dyn Shape>` is a `'static` type, so it
implements `Any` itself. `let any: &dyn Any = s;` therefore erases the BOX, and
each downcast compares `TypeId::of::<Box<dyn Shape>>()` with the `T` you asked
for. Nothing warns you: clippy's `type_id_on_box` only catches the method-call
form (`s.type_id()`), not this coercion.

Erase the shape inside the box instead. Going from `&dyn Shape` to `&dyn Any`
is a trait-upcasting coercion (stable since Rust 1.86), and it only exists when
`Any` is a supertrait. Without that you get E0308 "expected trait `Any`, found
trait `Shape`" (ignore its "try removing the method call" help: that is the
original bug). Two changes:
```
trait Shape: Any + Debug {
    fn area(&self) -> f64;
}
```
and in `all_of`:
```
let any: &dyn Any = s.as_ref();
any.downcast_ref::<T>()
```
`&**s` works as well as `s.as_ref()`, and so does
`(s.as_ref() as &dyn Any).downcast_ref::<T>()`. The downcast copies nothing:
the `&T` has the same address as the boxed value, which is what
`returns_references_into_the_boxes` checks.

What does not work: `.downcast_ref::<Box<T>>()` (a `Box<Circle>` is not a
`Box<dyn Shape>` either); an `unsafe` pointer cast (forbidden here, and it skips
the type check); an `as_any` method that every implementor must write (the
tests' `Hexagon` has none: E0046). The pre-1.86 blanket helper,
`impl<T: Any> AsAny for T`, passes only if you call it as `(**s).as_any()`:
`s.as_any()` picks the box's own impl and brings the bug back. `Any` needs
`'static` because a `TypeId` is computed with lifetimes erased, so every
`Shape` implementor must now be `'static` (the README has the details)."""

[[exercises]]
name = "dispatch6"
dir = "32_dispatch"
hint = """
E0038 "the trait `Node` is not dyn compatible", with the note "...because
method `accept` has generic type parameters". A vtable holds one function
pointer per method, but `accept<V: Visitor>` is one function PER visitor type,
and new visitor types can appear anywhere (the tests define one), so rustc
cannot build a vtable for `dyn Node`. `&mut impl Visitor` is the same generic
method, and `V: Visitor + ?Sized` (which rustc's E0277 help in the test build
suggests) does not help either: it is still a type parameter.

dispatch2's fix does not apply here. `where Self: Sized` removes `accept` from
the vtable, and then `walk`, `Branch::accept` and a test fail with "the
`accept` method cannot be invoked on a trait object". Keep `accept` in the
vtable and drop the type parameter by taking the visitor as a trait object:
```
trait Node {
    fn accept(&self, visitor: &mut dyn Visitor);
    // `boxed` stays as it is.
}

impl Node for Leaf {
    fn accept(&self, visitor: &mut dyn Visitor) {
        visitor.visit_leaf(self);
    }
}

impl Node for Branch {
    fn accept(&self, visitor: &mut dyn Visitor) {
        visitor.visit_branch(self);
        for child in &self.children {
            child.accept(visitor);
        }
    }
}
```
Each call now dispatches twice, once on the node's vtable (`accept`) and once
on the visitor's (`visit_leaf` / `visit_branch`): double dispatch. `walk`
compiles unchanged, because its `&mut V` coerces to `&mut dyn Visitor`, and
`child.accept(visitor)` implicitly reborrows the `&mut dyn Visitor` for each
child. `&mut (dyn Visitor + '_)` works too.

Wrong turns: making the trait generic (`Node<V>`) breaks every `Box<dyn Node>`
(E0107 missing generics for trait `Node`); taking `&mut CountingVisitor`
rejects the tests' own visitor (E0308). A generic `accept<V>` gated with
`where Self: Sized` next to a dyn twin (`accept_dyn`) is a real pattern for
keeping static dispatch on concrete types, but every caller here goes through
`dyn Node`, so they would all have to call the twin. If the node kinds were a
closed set, an enum (dispatch4) with a generic visitor would avoid both vtables;
rustc's help ("consider defining an enum ...") suggests exactly that."""

# TRAITS & ABSTRACTION · Closures — Fn / FnMut / FnOnce
[[exercises]]
name = "closure1"
dir = "33_closures"
hint = """
A closure captures the variables its body uses, and by default it captures them
in the least-privileged way that works — here just a shared borrow of `name`. But
`make_greeter` RETURNS the closure, so the closure outlives the function and
thus outlives its local `name`; a borrow would dangle, which is exactly what
E0373 ("closure may outlive the current function, but it borrows `name`")
reports. Add the `move` keyword so the closure captures `name` BY VALUE and owns
it: `move || format!("Hello, {name}!")`. Now the `String` lives inside the
returned closure, so it is safe to call `g()` as many times as you like."""

[[exercises]]
name = "closure2"
dir = "33_closures"
hint = """
Which closure trait a closure implements depends on how CALLING it must touch
its captures. The test's `inc` does `count += 1`, so it mutates a capture and
needs `&mut self` per call — that makes it `FnMut`, not the stricter `Fn` (`Fn`
is the `&self`-only, read-only subset). Requiring `F: Fn()` therefore rejects it
with E0525 ("...only implements `FnMut`"). Relax the bound to `F: FnMut()`. The
`mut f` binding is already present, so each `f()` call can borrow `f` as `&mut`.
Remember the hierarchy: every `Fn` is an `FnMut`, so asking for `FnMut` still
accepts read-only closures too."""

[[exercises]]
name = "closure3"
dir = "33_closures"
hint = """
The test's closure is `move || owned`: it captures the `String` by value and
then RETURNS it, moving the value out of the closure. Moving a capture out is a
once-only capability — after one call the value is gone — so the closure is
`FnOnce`, not `Fn`. A `F: Fn() -> String` bound is too strict and the compiler
reports that the closure "implements `FnOnce`, not `Fn`". Relax the bound to
`F: FnOnce() -> String`; `FnOnce` takes `self`, which is exactly what consuming
a capture requires. Ordering to remember: `Fn` implies `FnMut` implies `FnOnce`,
so `FnOnce` is the most permissive bound and accepts the widest set of closures."""

[[exercises]]
name = "closure4"
dir = "33_closures"
hint = """
Every closure that captures something is its own unique anonymous type, so the
two arms `move |x| x + step` and `move |x| x - step` have DIFFERENT types. A
return type of `-> impl Fn(i32) -> i32` promises exactly ONE concrete type, so
the compiler can't reconcile the two arms and reports E0308 ("`if` and `else`
have incompatible types"). The fix is a trait object that erases the concrete
type behind a pointer + vtable (dynamic dispatch, like the trait-objects
module): change the return type to `Box<dyn Fn(i32) -> i32>` and wrap each arm
in `Box::new(...)`. `adder` needs no change — it returns the same closure type
on every call, so `impl Fn` is fine there. (Note: closures that capture nothing
can coerce to a plain `fn` pointer and would have unified — it's the captured
`step` that keeps them distinct.)"""

[[exercises]]
name = "closure5"
dir = "33_closures"
hint = """
Two errors, one idea: in `Fn(&T) -> X` the argument's lifetime is higher-ranked, but anything named outside that binder is fixed.

`measure_greeting`, E0597 "`greeting` does not live long enough ... argument requires that `greeting` is borrowed for `'a`": `'a` is a parameter of the function, so the CALLER picks it, and it outlives the whole call. A local buffer dies inside the call, so it can never be borrowed for `'a`. Drop the fn-level lifetime. The elided `Fn(&str)` already means "for every lifetime":
```
fn measure_greeting<F: Fn(&str) -> usize>(name: &str, measure: F) -> usize {
```
Written out, that bound is `F: for<'a> Fn(&'a str) -> usize`, which is equally correct. Making the greeting `'static` (a literal, or `String::leak`) also compiles, but it either changes what is measured or leaks memory on every call.

`sort_by_name`, "lifetime may not live long enough ... returning this value requires that `'1` must outlive `'2`": `sort_by_key` is bounded by `F: FnMut(&T) -> K`, and `K` is one type chosen outside the implicit `for<'a>`, so the key cannot borrow from the element it came from. Compare in place instead. The comparator returns an `Ordering`, which borrows nothing:
```
people.sort_by(|a, b| a.name.cmp(&b.name));
```
`sort_by` is stable, like `sort_by_key`. `sort_unstable_by` is not, and the test with repeated names catches it, as it also catches breaking ties by age. `sort_by_key(|p| p.name.clone())` compiles but allocates two new `String`s for every comparison. If you really need owned keys, `sort_by_cached_key` computes each key only once. A copied key such as `sort_by_key(|p| p.age)` is fine, because a `u32` borrows nothing. The same limit comes back for async callbacks in `closure8`."""

[[exercises]]
name = "closure6"
dir = "33_closures"
hint = """
E0597 "`c` does not live long enough ... argument requires that `c` is borrowed for `'a`", once for every `&c`. `stats` owns `c` (it was moved in), so every borrow of it ends before `stats` returns. But `'a` is a lifetime parameter of the function, picked by the caller and longer than the call, so `where &'a C: IntoIterator` only says that borrows lasting THAT long can be iterated. Move the lifetime into the bound with a higher-ranked `for<'a>`, so the impl is promised for every lifetime, including the short borrows inside the body:
```
fn stats<C>(c: C) -> (usize, i32, Option<i32>)
where
    for<'a> &'a C: IntoIterator<Item = &'a i32>,
{
```
The `C: 'a` bound goes away together with the fn-level `'a`. This is the bound behind `for x in &c`. Elision cannot write it for you, because it is not an `Fn(..)` bound: a bare `&C` in a where clause is E0637 (compare `closure5`). The binder does not force `C: 'static` either, and adding that bound breaks the test with a `Window` that borrows a local array. The tests also reject the tempting dodges: `C: IntoIterator<Item = i32> + Clone` (copies the container for every pass, and `Readings` is neither `Clone` nor iterable by value), collecting into a `Vec` first (the borrow for the collect still hits E0597), and `Box::leak`-ing `c` to get a long enough borrow (the test that checks `Readings` gets dropped fails)."""

[[exercises]]
name = "closure7"
dir = "33_closures"
hint = """
Both let-bound closures fail on their own with "lifetime may not live long enough ... returning this value requires that `'1` must outlive `'2`", and boxing them as a `Stage` gives E0308 "one type is more general than the other". A closure bound with `let` has no expected type, so rustc gives its `&str` parameter a fresh lifetime on every call but infers ONE fixed lifetime for the returned `&str`. `Box<dyn Fn(&str) -> &str>` needs `for<'a> Fn(&'a str) -> &'a str`. Annotating `-> &str` on the closure changes nothing, because closures do not use the fn elision rules.

Give the closures an expected signature. The simplest way is to write them inline, like the middle stage already is:
```
pipeline.push(Box::new(|s| s.trim()));
pipeline.push(Box::new(|s| s.strip_prefix('>').unwrap_or(s).trim_start()));
pipeline.push(Box::new(|s| s.split_whitespace().next().unwrap_or(s)));
```
To keep the `let` bindings, pass each closure through an identity helper whose bound supplies the signature (`F: Fn(&str) -> &str` is the higher-ranked `for<'a> Fn(&'a str) -> &'a str`):
```
fn text_stage<F: Fn(&str) -> &str>(f: F) -> F {
    f
}

let trim = text_stage(|s| s.trim());
```
A named `fn trim(s: &str) -> &str`, the path `str::trim`, `let trim: Stage = Box::new(|s| s.trim());` or `let trim: fn(&str) -> &str = |s| s.trim();` all work too, because each gives the closure (or fn item) the full elided signature. Casting with `Box::new(|s: &str| s.trim()) as Stage` does not: the cast comes too late to guide inference. Adding a lifetime parameter to `Pipeline` instead ties the whole pipeline to one input lifetime, and a test rejects that. The direct syntax `for<'a> |s: &'a str| -> &'a str { .. }` is still unstable (E0658)."""

[[exercises]]
name = "closure8"
dir = "33_closures"
hint = """
"captured variable cannot escape `FnMut` closure body": `|| attempt(log)` returns a future that holds the closure's captured `&mut Vec`, but `F: FnMut() -> Fut` fixes one future type `Fut` outside the call, so that future may not borrow the closure. The test's `async ||` closure is rejected for the same reason ("async closure does not implement `FnMut` because it captures state from its environment"). Bound `retry` by `AsyncFnMut`, whose calls return a future that keeps the closure borrowed until it is done, and name the output instead of the future type:
```
async fn retry<F>(mut op: F, max_attempts: usize) -> Option<u32>
where
    F: AsyncFnMut() -> Option<u32>,
{
```
The loop stays as it is, since `op().await` works the same. Then make the caller's closure async, so its future may reborrow the captured `log`:
```
retry(async || attempt(log).await, 5).await
```
(`async move ||` works too.) An async block inside a plain closure, `|| async { attempt(log).await }`, is not enough: it is still a plain closure whose future escapes the call. `AsyncFnMut` is in the prelude (stable since Rust 1.85), and plain closures that return a future still satisfy it, which is why the `ready(..)` tests keep working. `AsyncFn` would be too strict (these closures mutate their captures), and `AsyncFnOnce` could be called only once. Wrapping the log in a `RefCell` and keeping the old bound makes `fetch` compile, but the test `retry_lends_captures_to_each_call` still does not. The same trick applies to arguments: `for<'a> Fn(&'a u8) -> Fut` cannot let the future borrow the argument, but `AsyncFn(&u8)` can (compare `sort_by_key` in `closure5`)."""

# TRAITS & ABSTRACTION · Iterators — implementing Iterator, custom adapters, laziness
[[exercises]]
name = "iter1"
dir = "34_iterators"
hint = """
`Iterator` has ONE required method, `next`; everything else (`take`, `map`,
`sum`, `collect`) is a default method built on it - so implementing `next` is
all it takes to make `Fibonacci` fully iterable. An empty `next` body evaluates
to `()`, not `Option<u64>`, which is the E0308 type mismatch you see. Yield the
current value while advancing the pair, and let `checked_add` decide where the
sequence has to stop:
```
let current = self.curr;
let next = self.next.checked_add(current)?;
self.curr = self.next;
self.next = next;
Some(current)
```
Compute the sum BEFORE assigning anything: the `?` then bails with the state
untouched, so the iterator stays exhausted instead of yielding nonsense. F(94) is
the first Fibonacci number a `u64` cannot hold, and since each step works out the
number two ahead before yielding, the sequence ends after 92 values. A plain
`self.next += current` would panic with "attempt to add with overflow" in debug
builds and silently wrap in release - see `31_debugging/debugging2`. Short of that
limit nothing stops the iterator on its own; `take(10)` is what ends the first
test."""

[[exercises]]
name = "iter2"
dir = "34_iterators"
hint = """
An adapter is a struct that OWNS an inner iterator and computes lazily inside
`next`. Empty body -> returns `()` not `Option`, hence the compile error. Pull
the left element (the remembered one, or the first item), then the right one,
remember it, and pair them:
```
let prev = match self.prev.take() {
    Some(p) => p,
    None => self.inner.next()?,
};
let cur = self.inner.next()?;
self.prev = Some(cur.clone());
Some((prev, cur))
```
`?` on an `Option` returns `None` early once `inner` is exhausted - that is how
the adapter signals it is done, which is why a single-element input yields
nothing."""

[[exercises]]
name = "iter3"
dir = "34_iterators"
hint = """
This compiles (with an unused-`Map` / `must_use` warning) but the test fails
because `seen` stays 0. Adapters like `map` are LAZY: calling `map` only builds
a description and does ZERO work - the closure never runs until an EAGER
consumer drives `next`. The `data.iter().map(|_| { seen += 1; });` line is
constructed and immediately dropped, so nothing happens. Replace it with a real
consumer:
```
data.iter().for_each(|_| seen += 1);
```
Use `for_each` (not `map`) - a `map` kept only for its side effect is exactly the
no-op bug that the `#[must_use]` on std's adapters, via rustc's `unused_must_use`
lint, exists to warn about."""

[[exercises]]
name = "iter4"
dir = "34_iterators"
hint = """
`for x in coll` desugars to `let mut it = IntoIterator::into_iter(coll); while
let Some(x) = it.next() { .. }`, so implementing `IntoIterator` is what makes
`Grid` usable in a `for` loop. `IntoIter` is declared as
`std::vec::IntoIter<i32>`, which is precisely what `Vec<i32>` hands back, so
defer to it:
```
fn into_iter(self) -> Self::IntoIter {
    self.cells.into_iter()
}
```
An empty body returns `()` instead of `Self::IntoIter` (the E0308 error). This
is the consuming (by-value, `self`) form; std separately impls `IntoIterator`
for `&Grid`/`&mut Grid` patterns to yield `&T`/`&mut T`."""

# TRAITS & ABSTRACTION · Error design — custom errors, `?`, From / TryFrom, the Error trait
[[exercises]]
name = "err1"
dir = "35_error_design"
hint = """
`expr?` on an `Err(e)` desugars to `return Err(From::from(e))`, so `?` can only
convert a `ParseIntError` into a `ConfigError` if the `From<ParseIntError>` impl
actually produces a `ConfigError`. The body here is empty, so `from` returns `()`
instead of `Self` and the trait isn't satisfied (mismatched types). Fill it in with
`ConfigError::Parse(e)`. That one impl is what lets the bare `?` in `parse_port`
bridge the low-level parse error into your domain error — no `.map_err(...)` needed."""

[[exercises]]
name = "err2"
dir = "35_error_design"
hint = """
A type is "a real error" when it implements `std::error::Error` (supertraits
`Debug` + `Display`) and optionally overrides `source()`. Both bodies here are
empty, so they return `()` and mismatch the required `fmt::Result` and
`Option<&(dyn Error + 'static)>`. In `Display::fmt`, write to the formatter with no
trailing semicolon so the `fmt::Result` is returned:
`write!(f, "failed to parse record on line {}", self.line)`. In `source`, hand back
the cause: `Some(&self.source)`. Returning `Some(&cause)` is what builds the chain
that `Box<dyn Error>` and "caused by" reporters walk."""

[[exercises]]
name = "err3"
dir = "35_error_design"
hint = """
`From` is for conversions that cannot fail; `TryFrom` is the fallible sibling with
an associated `Error` type, used to validate at a type boundary so an invalid value
can't be constructed. The empty `try_from` body has no `Result<Self, Self::Error>`
to return, so it won't compile. Range-check the value and pick one of two arms:
```
if (0..=100).contains(&value) {
    Ok(Percentage(value as u8))
} else {
    Err(OutOfRange(value))
}
```
`OutOfRange` is already written for you above - and note that it is a REAL error
type (`Debug` + `Display` + `Error`) rather than a `String`, which is what lets a
caller match on it, print it, and wrap it with `?`. Implementing `TryFrom` also
gives you `TryInto` for free."""

[[exercises]]
name = "err4"
dir = "35_error_design"
hint = """
Two errors. E0599 "no method named `context` found for enum `Result<T, E>`": `Context`
is an extension trait, and its method only exists on types that an impl covers.
E0308 "mismatched types": `chain` has an empty body.

The blanket impl keeps the error ITSELF as the cause (boxed), which is what lets the
tests downcast the root cause later:
```
impl<T, E> Context<T> for Result<T, E>
where
    E: Error + Send + Sync + 'static,
{
    fn context(self, msg: &str) -> Result<T, Report> {
        self.map_err(|e| Report {
            msg: msg.to_string(),
            source: Some(Box::new(e)),
        })
    }
}
```
The second impl may sit next to it only because `Report` is not an `Error` (if it were,
`E = Report` would match both impls: E0119). The old report becomes the new report's
source through the given `From<Report> for BoxError`, which wraps it in `Layer`:
```
impl<T> Context<T> for Result<T, Report> {
    fn context(self, msg: &str) -> Result<T, Report> {
        self.map_err(|inner| Report {
            msg: msg.to_string(),
            source: Some(inner.into()),
        })
    }
}
```
anyhow uses the same trick: its `Context` impl for `Result<T, E>` goes through a private
helper trait with one blanket impl for std errors and one for `anyhow::Error`. A single
`impl<T, E: Into<BoxError>> Context<T> for Result<T, E>` also passes: std's `From`
covers every `Error + Send + Sync + 'static`, and the given `From` covers `Report`.

For `chain`, start with your own `msg` and follow `source()` to the end. The first link
is a `&(dyn Error + Send + Sync)`, every later one a `&(dyn Error + 'static)`, and a
coercion won't happen inside an `Option`, so `map` the first one:
```
let mut lines = vec![self.msg.clone()];
let mut next = self.source.as_deref().map(|e| e as &(dyn Error + 'static));
while let Some(err) = next {
    lines.push(err.to_string());
    next = err.source();
}
lines
```
Iterator version: `iter::once(self.msg.clone())` chained with
`iter::successors(first, |&e| e.source())` mapped through `to_string`. Write the closure
as `|&e|`: `|e| e.source()` reborrows through the closure argument and is rejected with
"lifetime may not live long enough". std's own `Error::sources()` is still unstable
(`error_iter`), so every crate writes this loop.

The tests catch the shortcuts. Stringifying the cause (`e.to_string().into()`) keeps
the text, but the root no longer downcasts to `ParseIntError`. `format!("{msg}: {e}")`
merges two links into one. Dropping the old report's `msg` loses a line. And
`impl Error for Report` is E0119 twice over: against the given `From` impl, and against
the `Label` pair in the tests, which mirrors the two `Context` impls. anyhow spells
this `.context("...")`, plus `.with_context(|| format!(...))`, which builds the message
only on the error path."""

[[exercises]]
name = "err5"
dir = "35_error_design"
hint = """
E0277 "`dyn std::error::Error` cannot be sent between threads safely" at
`thread::spawn` (its closure's result must be `Send + 'static`), and E0277 "... cannot
be shared between threads safely" in the scoped-thread test (it borrows `&err`, and a
`&T` is `Send` only when `T: Sync`). A trait object carries only the auto traits written
in its type, so put them into the alias:
```
type BoxError = Box<dyn Error + Send + Sync + 'static>;
```
(`'static` is already the default for a boxed trait object in an alias; writing it out
says what you mean.) Nothing else has to change: `?` and `.into()` keep working because
std has `From<E: Error + Send + Sync>`, `From<String>` and `From<&str>` for exactly this
box. `Box<dyn Error + Send>` is not enough: the sharing test still fails, and std has
no `From` impls for that type at all, so `?` stops working too.

Then E0308 "mismatched types" for the empty `verdict`. Ask the trait object about each
concrete type in turn. `downcast_ref` compares `TypeId`s, so a look-alike message of
another type never matches:
```
if let Some(parse) = err.downcast_ref::<ParseIntError>() {
    Verdict::Malformed(*parse.kind())
} else if err.is::<ZeroNotAllowed>() {
    Verdict::Zero
} else {
    Verdict::Other(err.to_string())
}
```
`downcast_ref` and `is` are defined on `dyn Error + 'static` (and on its `+ Send` and
`+ Send + Sync` versions), which is why the parameter is `&(dyn Error + 'static)`. With
a plain `&dyn Error` the object lifetime defaults to the reference's, and calling
`downcast_ref` is E0521 "borrowed data escapes outside of function". The by-value form
is `err.downcast::<ParseIntError>()` on the box: `Result<Box<ParseIntError>, BoxError>`,
giving the box back on a miss. A `"text".into()` error can't be downcast to `String`
(`String` is not an `Error`; std boxes the text in a private type), which is why
`Other` falls back to `to_string()`.

The tests catch the shortcuts. Matching on `err.to_string()` fails the look-alike
test, turning the error into a `String` inside the worker fails the downcast tests, and
an `unwrap` in the worker turns bad input into a panic. `IntErrorKind` is
`#[non_exhaustive]`, which part 6 comes back to."""

[[exercises]]
name = "err6"
dir = "35_error_design"
hint = """
E0119 "conflicting implementations of trait `From<Report>` for type `Report`": core has
`impl<T> From<T> for T`, and because `Report` implements `Error`, the blanket
`From<E: Error + Send + Sync + 'static>` produces a second `From<Report> for Report`.
Stable Rust has no specialization, so one impl has to go, and the tests need the
blanket `From`. Delete `impl Error for Report`. That is anyhow's choice, and it is why
`anyhow::Error` is not a `std::error::Error`.

Then give callers back what `Error` gave them. Inspection, for the E0599 on `as_ref`:
```
impl AsRef<dyn Error + Send + Sync> for Report {
    fn as_ref(&self) -> &(dyn Error + Send + Sync + 'static) {
        &*self.0
    }
}
```
Keep the `'static` in the return type: `AsRef<dyn Error + Send + Sync>` means
`+ 'static`, and a bare `&(dyn Error + Send + Sync)` return type would mean the
reference's lifetime, which rustc rejects with "`impl` item signature doesn't match
`trait` item signature".

Hand-off, for the E0277s on `?` and `.into()` that appear once `Report` is no longer an
`Error`. Give up the box the report already owns instead of boxing the report again:
```
impl From<Report> for BoxError {
    fn from(report: Report) -> Self {
        report.0
    }
}
```
This impl is legal only because `Report` is not an `Error`; otherwise std's
`From<E: Error + Send + Sync>` for boxes would already cover it (E0119 again, the same
fact part 4 relied on). anyhow also has
`Deref<Target = dyn Error + Send + Sync + 'static>`, `AsRef<dyn Error>`, and
`From<anyhow::Error>` for `Box<dyn Error>` and `Box<dyn Error + Send>`. Adding those
here is fine too (the tests name the `AsRef` target, so two `AsRef` impls stay
unambiguous).

The shortcuts fail. Keeping `impl Error` and writing one `From` per error type
(`ParseIntError`, `ParseFloatError`, `MissingStar`) breaks the generic `wrap` helper in
the tests with E0277. A `From<Report> for BoxError` that stringifies the report, or
wraps it in a second error type, fails the downcast and same-allocation tests. The
design rule behind all of this: libraries expose matchable (often `#[non_exhaustive]`)
error enums, so callers can branch on the cause; applications use an opaque report
like this one, add context, and downcast when they must."""

# MODULE 2 · DATA STRUCTURES — hand-written std-style containers (safe)

[[exercises]]
name = "linkedlist1"
dir = "27_data_structures"
hint = """
The classic ownership puzzle. Each node OWNS the next via `Box`; "no next" is
`None`.

push: build a `Node` whose `next` is the old head, taken out with `self.head.take()`
(which leaves `None` in place):
```
let node = Box::new(Node { value, next: self.head.take() });
self.head = Some(node);
```

pop: you can't read `self.head` directly (that would move out of `&mut self`).
`take()` the head, then `.map` to update the head and return the value:
```
self.head.take().map(|node| {
    self.head = node.next;
    node.value
})
```"""

[[exercises]]
name = "ringbuffer1"
dir = "27_data_structures"
hint = """
A ring buffer (the core of `VecDeque`) wraps around by indexing modulo the
capacity; the data itself never moves. The back slot is computed:
`tail = (head + len) % capacity`.

push_back: if full (`self.len == self.capacity()`) `return false`; otherwise
```
let tail = (self.head + self.len) % self.capacity();
self.buf[tail] = Some(value);
self.len += 1;
true
```

pop_front: if empty (`self.len == 0`) `return None`; otherwise `self.buf[self.head].take()`
to take the front, then `self.head = (self.head + 1) % self.capacity();`,
`self.len -= 1;`, and return it."""

[[exercises]]
name = "hashtable1"
dir = "27_data_structures"
hint = """
A separate-chaining hash map: `bucket_index` (already written) maps a key to a
bucket, then you scan the bucket linearly.

insert: compute `idx`, `let bucket = &mut self.buckets[idx];`, iterate and overwrite
if the key already exists (then `return`), otherwise `bucket.push((key, value));`:
```
for entry in bucket.iter_mut() {
    if entry.0 == key { entry.1 = value; return; }
}
bucket.push((key, value));
```

get: `self.buckets[idx].iter().find(|(k, _)| k == key).map(|(_, v)| *v)`
(`i32` is `Copy`)."""

[[exercises]]
name = "linkedlist2"
dir = "27_data_structures"
hint = """
The empty body is E0308 "mismatched types": the signature promises an
`Option<Box<ListNode>>`, and a body without a tail expression evaluates to `()`.
Returning `head` (rustc's suggestion) compiles, but nothing is reversed: only the
empty and single-node tests pass.

Reverse by MOVING nodes. `prev` holds the part already reversed, `cur` the rest
of the input. Each round detaches the current node's tail into `cur`, points the
node at `prev`, and makes it the new `prev`:
```
let mut prev = None;
let mut cur = head;
while let Some(mut node) = cur {
    cur = node.next.take();
    node.next = prev;
    prev = Some(node);
}
prev
```
The two middle lines can be one: `cur = std::mem::replace(&mut node.next, prev);`.
Because you own `node`, plain moves work too (`cur = node.next;` and then
`node.next = prev;`): you may move a field out of a `Box` you own and assign it
again. `take` is required only when all you have is a `&mut`, as in
`linkedlist1`'s `pop`.

Why the shortcuts fail the tests: collecting the values into a `Vec` and building
a new list creates new nodes with new serial numbers (they may even reuse the
freed addresses, which is why the tests do not rely on addresses alone). Swapping
the VALUES along the list leaves the nodes in their old order. A recursive
reverse relinks correctly but needs one stack frame per node, so the 200_000-node
test overflows the test thread's stack. If the run aborts with "has overflowed
its stack" instead of reporting FAILED, look for recursion, or for a long input
list being dropped inside `reverse` (its drop glue is recursive, as `linkedlist1`
explains). Interview answer: O(n) time, O(1) extra space, each node visited once."""

[[exercises]]
name = "linkedlist3"
dir = "27_data_structures"
hint = """
The empty body is E0308 "mismatched types" (expected `Option<Box<ListNode>>`,
found `()`). Returning `a` or `b`, as rustc notes you could, compiles but merges
nothing.

Keep a cursor at the END of the result: `tail` is a `&mut` to the empty link where
the next node goes. `Option::insert` stores a node there and returns `&mut` to it,
so borrowing that node's `next` moves the cursor onto the new empty link:
```
fn merge(mut a: Option<Box<ListNode>>, mut b: Option<Box<ListNode>>) -> Option<Box<ListNode>> {
    let mut head = None;
    let mut tail = &mut head;
    while let (Some(x), Some(y)) = (&a, &b) {
        // `<=` takes from `a` on ties: a stable merge.
        let source = if x.val <= y.val { &mut a } else { &mut b };
        if let Some(mut node) = source.take() {
            *source = node.next.take();
            tail = &mut tail.insert(node).next;
        }
    }
    // One input is empty and the other is already sorted.
    *tail = a.or(b);
    head
}
```
`tail = &mut tail.insert(node).next` compiles because the new cursor is a
reborrow THROUGH the old one, and the old one is overwritten in the same
statement: there is never a second, independent `&mut` into the result. After
the last use of `tail`, `head` is free to return. Adding `mut` to the parameters
changes only the bindings, not the function's type.

Alternatives the tests accept: `match (a, b)` by value, putting the unused node
back into its variable in each arm; or a dummy head (`let mut dummy =
Box::new(ListNode::new(0));` with `tail: &mut Box<ListNode>` and `dummy.next` at
the end), which costs one extra node that is not part of the result. What fails:
`<` instead of `<=` takes `b` first on ties (the stability tests); a recursive
merge overflows the stack on the 200_000-node test; sorting the values and
building new nodes fails the serial checks. If the run aborts with "has
overflowed its stack" instead of reporting FAILED, look for recursion, or for an
input list being dropped inside `merge`: returning just `a` drops all 100_000
nodes of `b`, and that drop glue is recursive (see `linkedlist1`)."""

[[exercises]]
name = "linkedlist4"
dir = "27_data_structures"
hint = """
split_half fails with E0502 "cannot borrow `head` as mutable because it is also
borrowed as immutable". `fast` (a `&`) and `slow` (a `&mut`) point into the same
chain in every round, and a `&mut` to a link is exclusive access to every node
after it. Deriving `fast` from `slow` (`slow.as_deref()`) only moves the E0502.
Separate the passes: count with a shared cursor, and only THEN create the single
`&mut` cursor:
```
fn split_half(mut head: Option<Box<ListNode>>) -> (Option<Box<ListNode>>, Option<Box<ListNode>>) {
    let front_len = len(&head).div_ceil(2);
    let mut cut = &mut head;
    for _ in 0..front_len {
        if let Some(node) = cut {
            cut = &mut node.next;
        }
    }
    let back = cut.take();
    (head, back)
}

fn len(list: &Option<Box<ListNode>>) -> usize {
    let mut count = 0;
    let mut cur = list.as_deref();
    while let Some(node) = cur {
        count += 1;
        cur = node.next.as_deref();
    }
    count
}
```
Two traps. Writing `for _ in 0..len(&head).div_ceil(2)` AFTER `let mut cut = &mut
head;` is E0502 again: the count has to come first. And walking with `while let
Some(node) = cut { if steps == 0 { break; } steps -= 1; cut = &mut node.next; }`
fails with E0499 at `cut.take()`: the borrow the pattern takes can flow into
`cut`, so NLL still counts it as live on the `break` path. It is the same family
of false positive as `37_borrowck_errors/borrowck3`. A counted `for` loop with an
`if let` inside avoids it. Running fast/slow with two SHARED cursors just to count
the steps, then walking the `&mut` cursor, also works.

remove_nth_from_end: E0308 from the empty body. Count, use `checked_sub` (in a
debug build `len - n` panics with "attempt to subtract with overflow" when
`n > len`), walk to the link that owns the node, and replace that link with the
node's `next`:
```
fn remove_nth_from_end(mut head: Option<Box<ListNode>>, n: usize) -> Option<Box<ListNode>> {
    let Some(index) = len(&head).checked_sub(n) else {
        return head;
    };
    let mut link = &mut head;
    for _ in 0..index {
        if let Some(node) = link {
            link = &mut node.next;
        }
    }
    if let Some(removed) = link.take() {
        *link = removed.next;
    }
    head
}
```
For `n == 0` the index is `len`, the empty link at the end, so `take` finds
nothing and the list is unchanged; an unconditional `link.take().unwrap()`
panics there. The textbook two-pointer version (a lead `&` cursor `n` nodes ahead
of a trailing `&mut` one) is E0502 for the same reason as `split_half`, and a
recursive version overflows the stack on the 200_000-node test. If the run aborts
with "has overflowed its stack" instead of reporting FAILED, look for recursion,
or for a long list being dropped inside your function (its drop glue is
recursive, see `linkedlist1`)."""

