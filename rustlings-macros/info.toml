# MODULE 4 · Async Bounds: Why `spawn` Needs `Send + 'static`

[[exercises]]
name = "async_send1"
dir = "56_async_bounds"
hint = """
"future cannot be sent between threads safely ... has type `std::sync::MutexGuard<'_, Stats>` which is not `Send` ... await occurs here, with `mut guard` maybe used later" has no E-code. It is the unmet `F: Send` bound of `spawn` (and of the tests' `assert_send`), worded for futures. An `async fn` stores every local that is still alive at an `.await` in its state machine, and `MutexGuard` is `!Send` (with POSIX threads, a mutex must be unlocked by the thread that locked it). In `record`, end each guard before the handler is awaited. A temporary guard dies at the end of its statement:
```
async fn record(stats: Arc<Mutex<Stats>>, id: u32) {
    stats.lock().unwrap().started += 1;
    handle_request().await;
    let mut guard = stats.lock().unwrap();
    guard.finished += 1;
    guard.queued.push(id);
}
```
The guard after the `.await` is fine because no `.await` follows it. A `{ let mut guard = ..; guard.started += 1; }` block works just as well.

In `flush`, `drop(guard)` releases the lock at run time, but `&mut guard.queued` borrowed `guard` through `DerefMut`. A local that was ever borrowed keeps its slot in the future until its scope ends, even after it was moved out. A read-only `guard.field` access through `Deref` counts as a borrow too. So end the scope instead:
```
let batch = {
    let mut guard = stats.lock().unwrap();
    mem::take(&mut guard.queued)
};
```
or, in one statement, `let batch = mem::take(&mut stats.lock().unwrap().queued);`. `mem::take` empties the queue while it is locked, so ids queued during the upload wait for the next flush. Cloning the queue and clearing it after the upload loses them, and `ids_queued_during_an_upload_wait_for_the_next_flush` catches that. `drop` only helps for a guard that was never borrowed.

Wrong turns:
- Removing the `.await`, or calling `block_on(handle_request())` while locked, compiles but fails the tests that poll `record` by hand: the first poll must stop inside the handler with the lock free.
- `mem::forget(guard)` fails just like `drop`, because the borrowed guard is still in the future. It would also never unlock.

Clippy's `await_holding_lock` lint flags both starter functions, including the one with the explicit `drop`. A current-thread runtime does not help: `tokio::spawn` still demands `Send`. Only `block_on` or `spawn_local` would accept this future, and there it could deadlock the thread. If a lock really must stay held across an `.await`, use an async mutex such as `tokio::sync::Mutex`. For short bookkeeping like this, the std `Mutex` is the right tool."""

[[exercises]]
name = "async_send2"
dir = "56_async_bounds"
hint = """
Two errors, one cause: a spawned task may outlive `greet_all`, so its future must be `'static` and may not borrow anything.
- E0521 "borrowed data escapes outside of function ... argument requires that `'1` must outlive `'static`" is the borrow of the caller's `names`: each `name` is a `&String` into it.
- E0373 "async block may outlive the current function, but it borrows `prefix`" is the borrow of the local `prefix`.

rustc suggests `move`, but `async move` moves the `&String` (still a borrow, so E0521 stays) and moves `prefix` into the first task only (E0382 "use of moved value ... value moved here, in previous iteration of loop"). Give every task owned data, and share the prefix through an `Arc`:
```
let prefix: Arc<str> = format!("{}, ", greeting.trim()).into();
let mut handles = Vec::new();
for name in names {
    let name = name.clone();
    let prefix = Arc::clone(&prefix);
    handles.push(spawn(async move { render(&prefix, &name).await }));
}
```
Also add `use std::sync::Arc;`. Cloning the `String` prefix for every task instead of using an `Arc` also works (one small allocation per task). The other idiomatic answer copies the names once into an `Arc<[String]>` (`let names: Arc<[String]> = names.into();`) and moves an `Arc::clone` plus the index into each task.

Wrong turns:
- `names: &'static [String]` makes the tests' local `Vec`s fail with E0597.
- `Box::leak` or `String::leak` compile, but they leak memory on every call (`25_lifetimes_deep/lifetimes9` is where leaking is deliberate).
- Calling `block_on` in a loop, or using `thread::scope`, avoids `spawn` and fails `spawns_one_task_per_name`.
- Copying the whole slice into every task works but costs O(n^2).

In real async code, if the tasks only need to run concurrently and not in parallel, skip spawning and `join` borrowing futures inside the current task (`57_async_combinators/join1`). There is no safe scoped async spawn, because a scope future could be `mem::forget`-ed while its tasks still run."""

[[exercises]]
name = "async_send3"
dir = "56_async_bounds"
hint = """
"future cannot be sent between threads safely ... the trait `Send` is not implemented for `impl std::future::Future<Output = Option<String>>`": in a trait, `async fn get` means `fn get(..) -> impl Future<Output = Option<String>>` with no auto-trait bounds. So for a generic `S`, rustc cannot assume the future is `Send`. For a concrete store it can look through the opaque type, which is why spawning a concrete store's `get` would compile. `S: Send + Sync` is about the store, not about its futures. Write the desugared signature in the trait and add the bound (rustc's own help prints it). The impls may keep `async fn`:
```
trait Store {
    fn get(&self, key: &str) -> impl Future<Output = Option<String>> + Send;
}
```
Now every impl must keep that promise, and `CachedStore` breaks it: "has type `std::sync::MutexGuard<'_, HashMap<String, String>>` which is not `Send` ... required by a bound in `Store::get::{anon_assoc#0}`". It holds the cache lock for the whole remote round trip. Lock only around the lookup and the insert:
```
async fn get(&self, key: &str) -> Option<String> {
    let hit = self.cache.lock().unwrap().get(key).cloned();
    if hit.is_some() {
        return hit;
    }
    let value = self.remote.get(key).await?;
    self.cache.lock().unwrap().insert(key.to_string(), value.clone());
    Some(value)
}
```
`if let Some(hit) = self.cache.lock().unwrap().get(key) { return Some(hit.clone()); }` also works, because the temporary guard dies at the end of the `if let`, before the `.await`. A `drop(cache)` before the `.await` does not work, because `cache.get(key)` borrowed it (see `async_send1`). Two tasks that miss at the same time may both fetch, which is fine for a read-through cache.

What does not work:
- `trait Store: Send + Sync` bounds the store, not the future.
- Return type notation, `where S::get(..): Send`, is unstable (E0658).
- Boxing the future in the trait breaks the `async fn` impls, including the tests' `Recorder` (E0053).
- Rewriting `spawn_fetch` to build the future on the new thread (`thread::spawn(move || block_on(store.get(&key)))`) does not help, because the tests' generic `assert_get_is_send` still needs the trait's promise.

The price of the bound: an `async fn` impl on a type that holds an `Rc` or a `RefCell` no longer compiles, because its future always holds `&self`, and `&Self` is `Send` only if `Self: Sync`. A `where Self: Sync` clause on the method is a valid variant. The `trait-variant` crate generates a local and a `Send` flavor when you need both."""

[[exercises]]
name = "async_send4"
dir = "56_async_bounds"
hint = """
E0038 "the trait `DynStore` is not dyn compatible ... because method `get` is `async`": a vtable needs one return type for `get`, but every `async fn` impl returns its own anonymous future. Erase the future's type with a boxed trait object (in essence what `#[async_trait]` generates; `futures::future::BoxFuture` is this alias), and make the trait object thread-safe with supertraits:
```
type BoxFuture<'a, T> = Pin<Box<dyn Future<Output = T> + Send + 'a>>;

trait DynStore: Send + Sync {
    fn get<'a>(&'a self, key: &'a str) -> BoxFuture<'a, Option<String>>;
}
```
Then move each old body into `Box::pin(async move { .. })`, which captures `self` and `key` and runs only when polled:
```
impl DynStore for MemStore {
    fn get<'a>(&'a self, key: &'a str) -> BoxFuture<'a, Option<String>> {
        Box::pin(async move {
            io().await;
            self.lookups.fetch_add(1, Ordering::Relaxed);
            self.data.get(key).cloned()
        })
    }
}
```
Do the same for `Fallback`, around its `match`.

Each piece matters:
- Without `+ Send`, the spawned tasks fail with "future cannot be sent between threads safely" and E0277 "`dyn std::future::Future<Output = Option<String>>` cannot be sent between threads safely".
- Without the supertraits, `Arc<dyn DynStore>` is not `Send`: E0277 "`dyn DynStore` cannot be sent between threads safely" and "cannot be shared between threads safely" (a trait object has only the auto traits written into it, see `35_error_design/err5`).
- Without the `'a`, the box means `+ 'static` and cannot borrow `self` (`25_lifetimes_deep/lifetimes8`).
- With the elided `fn get(&self, key: &str) -> BoxFuture<'_, ..>`, the future may borrow only `self`, so using `key` inside it gives "lifetime may not live long enough". Copying `key` into a `String` first works too.

Wrong turns:
- Doing the lookup in `get` itself and boxing only the result (`Box::pin(std::future::ready(..))`) compiles, but it is eager, so `get_does_its_work_only_when_polled` fails.
- Asking the backup even on a hit fails `fallback_asks_the_backup_only_on_a_miss`.

The cost is one allocation per call plus dynamic dispatch on every poll. Keep the static `-> impl Future + Send` trait from `async_send3` for generic code, and add a boxed twin (a second trait with a blanket impl, or the wrapper struct the `dynosaur` crate generates) when you need `dyn`."""

# MODULE 4 · Scoped Threads: Borrowing Across Threads, Disjoint `&mut` and Barriers

[[exercises]]
name = "scope1"
dir = "51_scoped_threads"
hint = """
E0521 "borrowed data escapes outside of function", reported twice: once for `data` and once for `on_chunk`. `thread::spawn` requires `F: Send + 'static` because a spawned thread may outlive the function that started it. These closures capture `left` and `right` (borrowed from `data`) and `on_chunk`, which are only valid until `parallel_sum_with` returns. Joining right away changes nothing, because the bound is in `spawn`'s signature, and `move` only moves the references.

Use `std::thread::scope` instead. Its `Scope::spawn` only asks for `'scope`, because `scope` joins every thread before it returns:
```
thread::scope(|s| {
    let a = s.spawn(|| {
        on_chunk(left);
        left.iter().sum::<u64>()
    });
    let b = s.spawn(|| {
        on_chunk(right);
        right.iter().sum::<u64>()
    });
    a.join().unwrap() + b.join().unwrap()
})
```
Spawn both threads before joining either. With `s.spawn(..).join()` on each line the halves run one after the other, and `both_halves_are_summed_at_the_same_time` fails after its 20 s deadline.

These also pass:
- summing one half on the current thread while the other runs on a scoped thread;
- keeping `move` on the closures (it only copies the references);
- adding both sums into an `AtomicU64` instead of joining.

Don't satisfy `'static` with `data.to_vec()`, an `Arc<Vec<u64>>` or `Box::leak`. Each of those copies the input, and `each_half_is_the_callers_memory_on_its_own_thread` compares addresses.

`join()` returns a worker's panic as an `Err`, and `unwrap()` turns it into a panic in the caller. If a scoped thread panics and you never join it, `scope` itself panics with "a scoped thread panicked" once every thread has finished. The module README explains why the older guard-based `thread::scoped` was unsound. See also `25_lifetimes_deep/lifetimes7` (`T: 'static` for owned values) and `33_closures/closure1` (E0373 and `move`)."""

[[exercises]]
name = "scope2"
dir = "51_scoped_threads"
hint = """
E0499 "cannot borrow `*data` as mutable more than once at a time". Each closure writes through `data`, so it captures `*data` by mutable borrow, and a closure handed to `s.spawn` keeps that borrow until the scope ends. The checker never compares `..mid` with `mid..`.

Split the slice first, so that each thread owns a disjoint `&mut [u64]`:
```
let size = data.len().div_ceil(n.max(1)).max(1);
thread::scope(|s| {
    for chunk in data.chunks_mut(size) {
        s.spawn(move || {
            on_chunk(chunk);
            for x in chunk.iter_mut() {
                *x *= factor;
            }
        });
    }
});
```
- `n.max(1)` turns 0 threads into 1, because `len.div_ceil(0)` panics with "attempt to divide by zero".
- The outer `.max(1)` keeps the chunk size above 0 for an empty slice, because `chunks_mut(0)` panics with "chunk size must be non-zero".
- `div_ceil` rounds up, so at most `n` chunks cover everything. `len / n` gives too many chunks (10 elements on 3 threads make 4), and it gives a size of 0 when `n > len`.
- `move` gives each closure its own `chunk`, plus copies of `factor` and `on_chunk`. If you loop over indices instead, a closure that borrows the loop variable `i` without `move` is E0373.

Joining each handle inside the loop, or putting a `Mutex` around the slice, makes the threads take turns, and `all_chunks_are_scaled_at_the_same_time` fails after 20 s. A balanced split built from repeated `split_at_mut` calls, with sizes that differ by at most one, passes too. In real code, `n` usually comes from `thread::available_parallelism()`.

The overflow in `a_panic_in_a_worker_reaches_the_caller` panics inside a worker, and `thread::scope` then panics after all threads are joined ("a scoped thread panicked"). Don't switch to `wrapping_mul` or `saturating_mul`, and don't join the handles and throw the `Err` away: either one makes that test fail. For E0499 and `split_at_mut` in single-threaded code, see `37_borrowck_errors/borrowck1`."""

[[exercises]]
name = "scope3"
dir = "51_scoped_threads"
hint = """
The tests fail their `assert_eq!` with "Every chunk after the first starts from 0" because phase 2 is missing: each worker has scanned only its own chunk. Phase 2 adds the totals of chunks `0..i` to every element of chunk `i`. It may read those totals only after every worker has published its own. That calls for one `Barrier` shared by exactly the workers that were spawned, which is `chunk_count`, not `n`:
```
use std::sync::Barrier;

// before `thread::scope`, next to `totals`:
let barrier = Barrier::new(chunk_count);
let barrier = &barrier;

// inside each worker, after `totals[i].store(..)`:
barrier.wait();
let offset: u64 = totals[..i].iter().map(|t| t.load(Ordering::Relaxed)).sum();
for x in chunk.iter_mut() {
    *x += offset;
}
```
Without the `let barrier = &barrier;` line, the `move` closures try to move the barrier itself: E0382 "use of moved value: `barrier`" (value moved into closure here, in previous iteration of loop).

Mistakes the tests catch:
- `Barrier::new(n)` blocks forever whenever there are fewer chunks than `n` (9 elements on 4 threads make only 3 chunks). The 20 s watchdog reports that as "did not finish".
- A `Barrier` created inside each worker is a separate barrier per thread, so with two or more chunks it never releases anyone.
- Waiting before your own `store`, or not waiting at all, lets a worker read a total that is still 0. The slow-chunk tests make one total arrive late on purpose, and the many-chunk tests catch the rest.

`Relaxed` loads are enough because `wait` goes through the barrier's internal `Mutex`, which orders every store made before the wait before every load made after it. `Arc<Barrier>` also works but isn't needed inside a scope.

Ending the scope after phase 1 and running phase 2 in a second scope also passes, since the end of a scope is a barrier, but it respawns every thread. The `Barrier` version scales to many phases, and `BarrierWaitResult::is_leader()` lets one thread do one-off work between them. Memory orderings are covered in `36_atomics`; blocking coordination continues in `52_condvar`."""

# MODULE 4 · Condition Variables: Blocking Queues and a Semaphore

[[exercises]]
name = "condvar1"
dir = "52_condvar"
hint = """
`pop`'s body is empty, so it evaluates to `()` where a `T` is expected: E0308 "mismatched types" ("implicitly returns `()` as its body has no tail or `return` expression"). Once it has a body, the tests check FIFO order, that a consumer on an empty queue sleeps (counted in `waiters`, with the lock released) until a push, and that a wakeup WITHOUT an item sends it back to sleep. The test fakes that wakeup by calling `notify_all()` without pushing, which is exactly what a spurious or stolen wakeup looks like from inside `wait`.

Wait in a `while` loop, and count yourself in around each `wait`:

```rust
fn pop(&self) -> T {
    let mut inner = self.inner.lock().unwrap();
    while inner.items.is_empty() {
        inner.waiters += 1;
        inner = self.not_empty.wait(inner).unwrap();
        inner.waiters -= 1;
    }
    inner
        .items
        .pop_front()
        .expect("the loop exits only when an item is queued")
}
```

`wait` unlocks the mutex and sleeps in one atomic step, and locks it again before it returns, so no push can slip in between your check and your sleep. Every change to `waiters` happens under the same lock that `push` reads it with, so `push` never misses a sleeper, and nobody ever sees the brief dip between `-= 1` and the next `+= 1`.

The same loop, packaged with `wait_while` (it keeps waiting while the closure returns `true`):

```rust
let mut inner = self.inner.lock().unwrap();
inner.waiters += 1;
let mut inner = self
    .not_empty
    .wait_while(inner, |i| i.items.is_empty())
    .unwrap();
inner.waiters -= 1;
inner.items.pop_front().unwrap()
```

When an item is already there, the count goes up and down inside one critical section, so nobody can observe it.

Wrong answers the tests catch: `if` instead of `while` (the bare `notify_all` test), not counting yourself in (then `push` never notifies, and the watchdog gives up after 20s), counting in but never out (`waiters()` is not 0 after `pop` returns), resetting the count to 0 or setting it to 1 instead of counting, LIFO order, and spinning while holding the lock (state is read with `try_lock`, so the test fails instead of hanging). `29_async_runtime/runtime2` has the same "look again after every wakeup" loop around `thread::park`, and Rust Atomics and Locks, chapter 9 ("Condition Variable", "Avoiding Syscalls") builds a condvar that counts its waiters to skip the wake syscall, as this `push` does."""

[[exercises]]
name = "condvar2"
dir = "52_condvar"
hint = """
On the starter, `try_push_refuses_when_full_and_hands_the_item_back` gets `Ok(())` where it expects `Err(3)`, and every test that needs a blocked producer panics with "push did not block when the queue was full": neither `try_push` nor `push` looks at `capacity`. Once `push` blocks, `push_blocks_while_full_and_one_pop_releases_it` gives up after 20s instead, because `pop` frees a slot without waking the producer that is waiting for it.

`try_push`: check and push under ONE lock, and hand the caller's own item back when the queue is full:

```rust
fn try_push(&self, item: T) -> Result<(), T> {
    let mut items = self.items.lock().unwrap();
    if items.len() >= self.capacity {
        return Err(item);
    }
    items.push_back(item);
    drop(items);
    self.not_empty.notify_one();
    Ok(())
}
```

`push`: part 1's loop, on the other condvar:

```rust
fn push(&self, item: T) {
    let mut items = self.items.lock().unwrap();
    while items.len() >= self.capacity {
        items = self.not_full.wait(items).unwrap();
    }
    items.push_back(item);
    drop(items);
    self.not_empty.notify_one();
}
```

Or, with the packaged loop, replace the lock line and the `while` with `let mut items = self.not_full.wait_while(self.items.lock().unwrap(), |items| items.len() >= self.capacity).unwrap();`.

`pop`: every pop frees one slot, so every pop wakes ONE producer, on the condvar that only producers sleep on:

```rust
    drop(items);
    self.not_full.notify_one();
    item
```

Do not notify only when the queue was full before the pop. After two quick pops, the second one finds the queue no longer full (the producer woken by the first has not pushed yet), and the other blocked producer never hears about its slot: `two_quick_pops_let_in_both_blocked_producers` catches that. (`notify_all` here also passes, but wakes every producer for one slot.)

Why two condvars: with one shared condvar, the `notify_one` of a pop can wake another consumer, which goes back to sleep while the producer never hears about the slot; with a few threads on each side, every thread can end up asleep (the capacity-1 stress test catches it). One condvar works only with `notify_all` everywhere (a thundering herd). Checking `len()` in a separate call before pushing is check-then-act (another producer can take the slot in between), and so is waiting after a failed `try_push` in a separate critical section: a slot freed in between is announced to nobody, and you sleep through it. std's own bounded queue is `std::sync::mpsc::sync_channel`, used for backpressure in `54_channels/channel1`."""

[[exercises]]
name = "condvar3"
dir = "52_condvar"
hint = """
The starter's `acquire` skips the decrement when no permit is free and returns a `Permit` anyway, so `a_blocked_acquire_waits_until_a_permit_is_dropped` panics with "acquire handed out a permit although none was free", and eight threads hold more than three permits at once. And `Permit` has no `Drop`, so a dropped permit never comes back: `dropping_a_permit_gives_it_back` fails with `left: 0`, `right: 1`, and a panicking holder leaks its permit for good.

Wait in a loop in `acquire`:

```rust
fn acquire(&self) -> Permit<'_> {
    let mut permits = self.permits.lock().unwrap();
    while *permits == 0 {
        permits = self.cv.wait(permits).unwrap();
    }
    *permits -= 1;
    Permit { sem: self }
}
```

(or replace the lock line and the `while` with `let mut permits = self.cv.wait_while(self.permits.lock().unwrap(), |p| *p == 0).unwrap();`), and give the permit back in `Drop`, state first, then notify:

```rust
impl Drop for Permit<'_> {
    fn drop(&mut self) {
        let mut permits = self.sem.permits.lock().unwrap();
        *permits += 1;
        drop(permits);
        self.sem.cv.notify_one();
    }
}
```

`Drop` runs however the holder's scope ends (a `return`, a `?`, a panic), so no permit can leak, and no lock is held while the permit is in use, so a panicking holder poisons nothing. One permit lets in one thread, so `notify_one` is enough (`notify_all` also works, but wakes the others for nothing). Notify on EVERY drop: skipping the notify when the count was not 0 strands a second waiter when two permits come back in quick succession (`two_permits_dropped_back_to_back_wake_two_waiters`). Notifying before you take the lock and increment is a lost wakeup: the woken thread can look before the count changes, see 0 and sleep through the permit. So is an `acquire` that calls `try_acquire` and then locks again just to wait. The loop is needed because this semaphore is not fair: a thread that was not even waiting can take the returned permit first. See `39_drop_raii` for more `Drop` guards, and tokio's `Semaphore` for an async, FIFO-fair version whose `acquire_owned` returns a permit that owns an `Arc` of its semaphore, so it can move into a spawned task."""

# MODULE 4 · Lock Hazards: Deadlocks by Lock Order and RwLock Semantics

[[exercises]]
name = "deadlock1"
dir = "53_lock_hazards"
hint = """
The failing tests take about 10 seconds: that is a watchdog giving up. There is no compiler error here. `transfer(2, 2, ..)` locks the same `Mutex` twice on one thread. std's `Mutex` is not reentrant, so the second `lock()` "will not return" (it might panic or deadlock). `transfer(1, 0, ..)` locks account 1 first, while `transfer(0, 1, ..)` on another thread locks account 0 first. Each then holds the lock the other is waiting for. That is a circular wait, which is a deadlock.

Reject equal ids before locking anything. Then lock the two accounts in ascending index order, whichever way the money goes. That is the order `total` uses. Then map the guards back to their roles:
```
if from == to {
    return Err(TransferError::SameAccount);
}
let (low, high) = (from.min(to), from.max(to));
let mut low_guard = self.accounts[low].lock().unwrap();
let mut high_guard = self.accounts[high].lock().unwrap();
let (src, dst) = if from == low {
    (&mut *low_guard, &mut *high_guard)
} else {
    (&mut *high_guard, &mut *low_guard)
};
if *src < amount {
    return Err(TransferError::InsufficientFunds { balance: *src, amount });
}
*src -= amount;
*dst += amount;
Ok(())
```
Both guards live until the function returns, so every other thread sees the funds check, the debit and the credit as one step. Every code path must use the same order. Among transfers alone, descending order would also be consistent, but it deadlocks against `total`, which locks in ascending order.

Wrong answers the tests catch:
- Releasing `from` before locking `to` avoids the deadlock, but for a moment the money is in neither account (`a_transfer_holds_both_accounts_until_it_is_done`, and `total()` in `an_audit_during_transfers_always_balances`).
- A `try_lock` back-off loop lets go of the lower account while it waits for the higher one.
- A bank-wide `Mutex` makes `transfer(2, 3)` wait for a blocked `transfer(1, 0)`, although the two share no account.
- Reordering the locks without mapping the guards back debits the wrong account.
- Returning `Ok(())` for `from == to` hides a caller bug: the test expects `Err(SameAccount)`.
- Checking the funds under a lock of its own before taking both locks is check-then-act: two transfers can both pass the check, and the second one underflows. It also locks `from` first, which the lock-order probe catches.

When locks have no natural number, order them by address (compare `std::ptr::from_ref(a)` with `std::ptr::from_ref(b)`). That works as long as a lock never moves while anyone may lock it. For the single-thread self-deadlock, see also `31_debugging/debugging8`."""

[[exercises]]
name = "rwlock1"
dir = "53_lock_hazards"
hint = """
`readers_run_at_the_same_time` fails because a `Mutex` lets one thread in at a time. The first reader waits at the `Barrier` inside `with_read` while it holds the lock, and the other three wait for the lock, forever. `a_hit_does_not_wait_for_readers` fails because `get_or_insert_with` takes the map exclusively even on a hit.

Switch the field to `RwLock<HashMap<String, String>>` and import `std::sync::RwLock`. (`#[derive(Default)]` still builds the store.) rustc then reports E0599 "no method named `lock` found for struct `std::sync::RwLock<T>` in the current scope" at every old `lock()`. Readers take `read()` and keep the guard while `f` runs. Writers take `write()`:
```
fn with_read<R>(&self, f: impl FnOnce(&HashMap<String, String>) -> R) -> R {
    f(&self.map.read().unwrap())
}

fn set(&self, key: &str, value: String) -> Option<String> {
    self.map.write().unwrap().insert(key.to_owned(), value)
}
```
In `get_or_insert_with`, a hit must need only the read lock. std has no upgradable read. So on a miss, let the read guard go, take the write lock, and look again, because another thread may have stored the key in between. The entry API does the second look and the insert in one step, and calls `make` only if the key is still missing:
```
if let Some(value) = self.get(key) {
    return value;
}
self.map
    .write()
    .unwrap()
    .entry(key.to_owned())
    .or_insert_with(make)
    .clone()
```
`self.get(key)` has dropped its read guard by the time it returns.

Wrong answers the tests catch:
- Using `self.map.write()` for every call: a hit waits for readers.
- Keeping a read guard alive while calling `write()`. Examples: a `let guard = self.map.read().unwrap();` still in scope, or `match self.map.read().unwrap().get(key) { .. }` with the write in the `None` arm (a scrutinee's guard lives through every arm). The writer then waits for its own reader forever, and the tests report "deadlock detected". Calling `write()` from inside `with_read` is the same self-deadlock.
- Inserting on a miss without looking again, or calling `make()` before taking the write lock: two threads that miss together both run `make` (`racing_misses_run_make_once`).
- Handing `f` a copy of the map, or an `Arc` snapshot that `set` replaces copy-on-write, so that no lock is held while `f` runs. `with_read_lends_the_stored_values` compares heap pointers, and `a_write_waits_for_readers_to_leave` sees `set` return while a reader is still inside. A snapshot is a fine design for hot-swapped config, but it is not this store's contract.

These also work:
- In edition 2024, `if let Some(v) = self.map.read().unwrap().get(key) { v.clone() } else { /* write */ }`, because the scrutinee's guard is dropped before the `else` block runs. In edition 2021 the same code deadlocks.
- A plain `get` / `contains_key` check under the write guard instead of the entry API.

`RwLockWriteGuard::downgrade` (Rust 1.92) goes the other way, from write to read. If `make` were slow, you would build the value with no lock held and keep the first value stored (`31_debugging/debugging8`)."""

# MODULE 4 · Channels: Backpressure, Disconnect-Driven Shutdown and Actors

[[exercises]]
name = "channel1"
dir = "54_channels"
hint = """
The tests fail at run time: at capacity 2 the third offer returns `Ok(())` where `Err(OfferError::Busy(3))` is expected. `mpsc::channel()` is unbounded, so its `send` never finds the buffer full, and `bounded` never even looks at `capacity` (rustc warns about the unused variable).

Use std's bounded channel, and offer with the non-blocking `try_send`. Both of its errors hand the item back, so it moves into your error without a copy:
```
use std::sync::mpsc::{self, Receiver, SyncSender, TrySendError};

struct Ingest<T> {
    tx: SyncSender<T>,
}

// Inside `impl<T> Ingest<T>`:
fn bounded(capacity: usize) -> (Ingest<T>, Receiver<T>) {
    let (tx, rx) = mpsc::sync_channel(capacity);
    (Ingest { tx }, rx)
}

fn offer(&self, item: T) -> Result<(), OfferError<T>> {
    self.tx.try_send(item).map_err(|err| match err {
        TrySendError::Full(item) => OfferError::Busy(item),
        TrySendError::Disconnected(item) => OfferError::Closed(item),
    })
}
```
The `Clone` impl compiles unchanged: a `SyncSender` clones like a `Sender`, and all clones share one buffer. `sync_channel(0)` is the rendezvous: `try_send` succeeds only while a receiver is already blocked in `recv`. Once the receiver is gone, `try_send` reports `Disconnected` even if the buffer is also full, so a closed queue is never mistaken for a busy one.

Wrong answers the tests catch:
- `sync_channel(capacity)` with `send` instead of `try_send`: a full buffer blocks the caller. That is backpressure by waiting, the other valid design, but not what `offer` promises, and the watchdog reports "`offer` blocked". Falling back to `send` after `Full`, or retrying `try_send` in a loop, blocks the same way.
- `sync_channel(capacity.max(1))` or `capacity + 1`: the buffer can hold one item too many, and the rendezvous or capacity tests fail.
- Mapping both errors to `Busy`: callers would retry forever against a queue that is closed.
- A counter next to an unbounded channel: the consumer never decrements it, so after `capacity` items every offer is `Busy` forever, even once the consumer has drained the queue or gone away.

Tokio's `mpsc::channel(n)` offers the same two choices: `send(..).await` waits, `try_send` fails with `TrySendError::Full` or `Closed`. The planned deep-dive lab `backend-tokio-lab` maps `Full` to HTTP 503. See also `52_condvar/condvar2`, which builds a bounded queue by hand from a `Mutex` and two `Condvar`s."""

[[exercises]]
name = "channel2"
dir = "54_channels"
hint = """
Two separate bugs, each with its own tests.

1. The tests that run the whole input through fail with the watchdog's "pipeline never shut down: a Sender is still alive". `for x in rx` and the consumer's `collect()` end only once EVERY Sender of their channel has been dropped. `run_pipeline` gives each stage a `clone()` of its output Sender and keeps the original alive in its own scope until it returns. So `collect()` waits for `batches_tx` to be dropped, the `batch` stage waits for `squares_tx`, `square` waits for `numbers_tx`, and `run_pipeline` never gets past `collect()` to drop any of them. Move the original Senders into the stage threads instead of cloning them:
```
let stages = [
    spawn_stage("source", move || source(numbers, numbers_tx)),
    spawn_stage("square", move || square(numbers_rx, squares_tx)),
    spawn_stage("batch", move || batch(squares_rx, batches_tx)),
];
```
Keeping the clones and calling `drop(numbers_tx); drop(squares_tx); drop(batches_tx);` right after spawning works too. Dropping them after `collect()` is too late, and dropping only `batches_tx` is not enough. Now the source returns when it runs out of numbers, its Sender is dropped, `square`'s loop ends, and so on down to the consumer.

2. `a_consumer_that_stops_early_shuts_every_stage_down` and `a_limit_of_zero_hangs_up_before_reading` find `["source", "square", "batch"]` panicked, and the three single-stage tests fail the same way. Once the consumer drops its Receiver, the next `send` into that link fails, and `unwrap()` panics. A failed send means "nobody wants this any more", so return. Returning drops the stage's own Receiver, the stage upstream fails its next send too, and the stop travels back to the source:
```
fn source(numbers: impl Iterator<Item = u64>, out: SyncSender<u64>) {
    for n in numbers {
        if out.send(n).is_err() {
            return;
        }
    }
}

// In `square`:
for n in input {
    if out.send(n * n).is_err() {
        return;
    }
}

// In `batch`, inside the loop:
if out.send(full).is_err() {
    return;
}
// and after the loop:
if !current.is_empty() {
    let _ = out.send(current);
}
```
`break` works as well as `return`. Don't `unwrap` the flush: it can fail too (`batch_does_not_panic_flushing_into_a_closed_link`). A plain `let _ = out.send(..)` in every loop is wrong the other way: nothing panics, but every stage keeps working for a consumer that left. The early-stop test counts the numbers pulled and catches it (all 10000 instead of a few dozen), and `square_returns_when_its_downstream_hangs_up` waits until its watchdog fires. Timeouts, sentinel values and reading the whole input up front are ruled out too: a stage must stop only because its input disconnected or its output hung up.

The bounded links matter here: a stage blocked in `send` on a full link is woken with the error the moment its receiver goes away. `drop_the_sender_first_then_join_the_stage` is the thread-pool form of rule 1: drop the job queue's Sender, then join the workers, as the Book's `ThreadPool` does in its `Drop` impl. See also `20_threads/threads3`, where each producer gets its own `tx.clone()`."""

[[exercises]]
name = "channel3"
dir = "54_channels"
hint = """
The tests fail to compile: E0559 "variant `Cmd::Get` has no field named `reply`" where they build a `Cmd::Get`, and E0026 "variant `Cmd::Get` does not have a field named `reply`" where they match on one. A command on a channel travels one way. To get an answer back, the request must carry its own reply channel.

1. Add the field. rustc then reports E0027 "pattern does not mention field `reply`" in `run_actor` and E0063 "missing field `reply` in initializer of `Cmd`" in `Handle::get`, the two places left to fix:
```
enum Cmd {
    Put { key: String, value: u32 },
    Get { key: String, reply: Sender<Option<u32>> },
}
```
2. The actor answers on the request's own channel. It must not `unwrap()` that send, or stop on its error. A caller that gave up has dropped its Receiver, and one impatient caller must not take the actor down for everybody:
```
Cmd::Get { key, reply } => {
    let _ = reply.send(map.get(&key).copied());
}
```
3. `get` creates a fresh channel for every request, sends the Sender half along with the command, and waits on the Receiver half. `recv` fails only when the reply Sender is dropped unanswered, which means the actor is gone:
```
fn get(&self, key: &str) -> Result<Option<u32>, Gone> {
    let (reply, answer) = mpsc::channel();
    let cmd = Cmd::Get { key: key.to_owned(), reply };
    self.tx.send(cmd).map_err(|_| Gone)?;
    answer.recv().map_err(|_| Gone)
}
```
`reply` is dropped at the end of the actor's match arm, so each reply channel carries exactly one answer. Each answer travels on the channel that came with its request, so it cannot reach the wrong caller, even when the actor answers out of order. One reply channel shared by every caller would mix the answers up, and a `Receiver` stored in `Handle` would make it neither `Clone` nor `Sync` (the tests also build `Handle { tx }` directly). `answer.recv().unwrap()` panics when the actor dies, and `unwrap_or(None)` reports a dead actor as a missing key: `get_reports_gone_when_the_actor_dies_mid_request` catches both.

This is the tokio actor pattern: an `mpsc` mailbox plus a `tokio::sync::oneshot` channel for each reply (std's `std::sync::oneshot` is still unstable). The actor ends by itself once the last `Handle` is dropped, because its `for cmd in commands` loop sees the disconnect, as in `channel2`. A `get` followed by a `put` from one client is not atomic: anything that must be atomic, such as an increment, has to be a single command."""

# MODULE 4 · ATOMICS — atomic operations & memory ordering
[[exercises]]
name = "atomics1"
dir = "36_atomics"
hint = """
The per-thread loop body is empty, so nothing ever touches the shared counter and
it stays 0 — the test expects 80_000. A plain `*counter += 1` across threads would
be a data race (load, add, store can interleave and lose updates), and a Mutex is
overkill for one integer. Instead do the whole read-modify-write in a single
indivisible step: `c.fetch_add(1, Ordering::Relaxed);`. `Relaxed` is enough here
because we only need the count itself to be atomic — we are not using it to publish
any OTHER memory to the readers, so no stronger ordering is required."""

[[exercises]]
name = "atomics2"
dir = "36_atomics"
hint = """
`handoff` must RETURN a `u64`, but the body ends after spawning the producer, so it
implicitly returns `()` and will not compile (E0308). Synchronize purely through the
atomics — do NOT join the producer:
```
while !flag.load(Ordering::Acquire) {
    std::hint::spin_loop();
}
data.load(Ordering::Relaxed)
```
The Acquire load pairs with the producer's `Release` store of the SAME flag: that
pairing creates a happens-before edge, so once you observe `true` you are guaranteed
to see the earlier (even Relaxed) write of `data` — never the initial 0. With
Relaxed on both sides the CPU/compiler could reorder the writes and let you read 0.
`std::hint::spin_loop()` keeps the busy-wait idiomatic and CPU-friendly."""

[[exercises]]
name = "atomics3"
dir = "36_atomics"
hint = """
`try_lock` must return a `bool`, but its body is empty, so it implicitly returns `()`
and will not compile (E0308). A lock is just an atomic flag plus a compare-and-swap:
atomically flip `locked` from `false` to `true`, and report who won:
```
self.locked
    .compare_exchange(false, true, Ordering::Acquire, Ordering::Relaxed)
    .is_ok()
```
Exactly one thread can win that CAS race. `Acquire` on the successful lock pairs with
the `Release` store in `unlock`, so the previous holder's critical section is visible
to the next holder. Real spinlocks loop on `compare_exchange_weak`, which may fail
SPURIOUSLY (report `Err` even when the value matched) but compiles to cheaper code on
some CPUs; retrying in a loop absorbs the spurious failures. `lock` already spins with
`std::hint::spin_loop()` until `try_lock` succeeds."""

[[exercises]]
name = "atomics4"
dir = "36_atomics"
hint = """
This compiles, but `retries_after_losing_the_race`, `rechecks_the_limit_after_losing_the_race` and `a_thread_that_keeps_losing_retries_until_full` fail with `left: Ok(0)`. The body is check-then-act. It loads the value, lets the rival run inside `race_window`, then stores `current + 1` over whatever the rival wrote. So the rival's increment is lost and both callers get ticket 0. `if c.load() < max { c.fetch_add(1) }` has the same bug, because two atomic operations are not one. Publish with a compare-and-swap, which succeeds only if the value is still the one you checked, and retry when it fails:
```
let mut current = self.value.load(Ordering::Relaxed);
loop {
    if current >= max {
        return Err(Full);
    }
    race_window();
    match self.value.compare_exchange_weak(
        current,
        current + 1,
        Ordering::Relaxed,
        Ordering::Relaxed,
    ) {
        Ok(ticket) => return Ok(ticket),
        Err(actual) => current = actual,
    }
}
```
A failed CAS returns `Err(actual)`, the value it found. Re-check the limit against it, since the slot may be gone. Keep retrying while slots are left: a lost race does not mean `Full`, so a retry cap fails `a_thread_that_keeps_losing_retries_until_full`. `compare_exchange_weak` may fail spuriously on LL/SC CPUs (ARM without LSE, RISC-V, POWER). Inside a loop that costs one more iteration, and it avoids the strong version's own internal loop. Check `current >= max` BEFORE computing `current + 1`, or `u64::MAX + 1` panics in the debug-mode tests. `Relaxed` is enough because the counter publishes no other memory.
The same loop as a std combinator. `try_update` is stable since 1.95; its old name `fetch_update` is marked deprecated from 1.99:
```
self.value
    .try_update(Ordering::Relaxed, Ordering::Relaxed, |v| {
        race_window();
        if v < max { Some(v + 1) } else { None }
    })
    .map_err(|_| Full)
```
Avoid `(v < max).then_some(v + 1)`: `then_some` evaluates `v + 1` eagerly and overflows at `u64::MAX`. The lazy `(v < max).then(|| v + 1)` is fine. `fetch_add` followed by an undo is also wrong: it cannot refuse, and other threads can see a value above `max`. Do not hold a lock around the body either. The rival inside `race_window` runs on the same thread, so the test deadlocks instead of failing. std's `Weak::upgrade` uses this CAS loop (through `try_update`) to bump a strong count that must never go from 0 back to 1. Compare the single strong CAS of `try_lock` in atomics3. atomics5 shows when comparing values is not enough (ABA)."""

[[exercises]]
name = "atomics5"
dir = "36_atomics"
hint = """
This compiles, but three tests fail. `aba_stale_commit_is_rejected` fails with `left: Ok(0)`, `right: Err(Stale)`. `aba_never_relists_a_slot_in_use` finds slot 1 both in use and on the free list. `a_thousand_scripted_interleavings_never_double_allocate` sees T1's commit hand out a slot that T2 still holds. `next_head` always writes tag 0. So after T2 pops 0, pops 1 and pushes 0 back, the head word is bit for bit the one T1 saw, and T1's stale CAS succeeds. That is the ABA problem. A CAS compares bits, not history, so make the bits carry history: every successful CAS writes the next tag.
```
let (tag, _) = unpack(observed);
pack(tag.wrapping_add(1), new_idx)
```
After the A-B-A the index matches but the tag has moved on, so the stale `pop_commit` returns `Err(Stale)` and `pop` retries from a fresh snapshot. Use `wrapping_add`, because the tag is a version, not a count: a plain `+ 1` panics at `u32::MAX` in the debug-mode tests, and `saturating_add` gets stuck at `u32::MAX`. These do NOT fix it:
- a constant nonzero tag, which never changes;
- deriving the tag from an index, which can repeat;
- a tag that only toggles (`tag ^ 1`), which repeats after two updates;
- stronger orderings like SeqCst, which do not change what a CAS compares;
- re-checking `next[idx]` inside `pop_commit`, which is another check-then-act race.
The limit is that a 32-bit tag repeats after 2^32 updates. With heap nodes on `AtomicPtr`, ABA comes together with use-after-free, so real lock-free stacks use hazard pointers or epoch-based reclamation (`crossbeam-epoch`) rather than tags alone. atomics4 covers the plain CAS retry loop that `push` and `pop` are built on."""

# QUIZ 5 · Send and Sync of std Types

[[exercises]]
name = "quiz5"
dir = "quizzes"
hint = """
Each answer applies one row of this table (`T: ?Sized` omitted):
```
type                  Send if            Sync if
Cell<T>, RefCell<T>   T: Send            never
Mutex<T>              T: Send            T: Send
RwLock<T>             T: Send            T: Send + Sync
Rc<T>                 never              never
Arc<T>                T: Send + Sync     T: Send + Sync
&T                    T: Sync            T: Sync
&mut T                T: Send            T: Sync
MutexGuard<'_, T>     never              T: Sync
mpsc::Sender<T>       T: Send            T: Send (since Rust 1.72)
mpsc::Receiver<T>     T: Send            never
*const T, *mut T      never              never
Box<T>                T: Send            T: Sync
```
So:
```
const CELL: Answer = Answer::SendOnly;
const MUTEX_OF_CELL: Answer = Answer::SendAndSync;
const RWLOCK_OF_CELL: Answer = Answer::SendOnly;
const MUTEX_OF_RC: Answer = Answer::Neither;
const ARC_OF_CELL: Answer = Answer::Neither;
const ARC_OF_MUTEX_OF_REFCELL: Answer = Answer::SendAndSync;
const SHARED_REF_TO_CELL: Answer = Answer::Neither;
const MUT_REF_TO_CELL: Answer = Answer::SendOnly;
const GUARD_OF_U32: Answer = Answer::SyncOnly;
const GUARD_OF_CELL: Answer = Answer::Neither;
const SENDER: Answer = Answer::SendAndSync;
const RECEIVER: Answer = Answer::SendOnly;
const CONST_PTR: Answer = Answer::Neither;
const BOXED_SEND_CLOSURE: Answer = Answer::SendOnly;
```
The reasons. A `Mutex` hands its content to one thread at a time (as `&mut T`),
which is no different from moving it there, so it asks only `T: Send`, and that
is how it makes a `Cell` shareable. `RwLock` readers hold `&T` on several
threads at once, so sharing it also needs `T: Sync` (`53_lock_hazards`). A lock
protects its content, not the other clones of an `Rc` inside it. Every clone of
an `Arc` gives out `&T`, and the last drop may happen on any thread, hence
`T: Send + Sync` for both traits. `&T` is Send exactly when `T` is Sync (that
is the definition of Sync); `&mut T` is exclusive, like ownership, so sending
it needs `T: Send`. A `MutexGuard` must unlock on the thread that locked it
(POSIX threads require it), so it never moves (`56_async_bounds`), while
sharing `&guard` only shares `&T`: the textbook "Sync but not Send" type, and
its `Cell` version is neither. `Sender` became Sync in Rust 1.72; a `Receiver`
never is, so several consumers share `Arc<Mutex<Receiver<T>>>` (`54_channels`).
Raw pointers are neither as a conservative default, which a type built on them
lifts with `unsafe impl Send` / `unsafe impl Sync` once its author has checked
the invariants. A trait object has only the auto traits its type names
(directly or through a supertrait), which is why errors that cross threads are
`Box<dyn Error + Send + Sync>` (`35_error_design`).

To check a type yourself, write `fn assert_send<T: Send>() {}` and call
`assert_send::<Mutex<Cell<i32>>>();`. A false case fails to compile with E0277,
for example "`Cell<i32>` cannot be shared between threads safely" for
`RwLock<Cell<i32>>` as Sync. The planned `api-surface-lab` in
`deep-dive/ROADMAP.md` turns such negative checks into `compile_fail` doctests,
and the store-buffering questions once planned for this quiz went to the
planned `lock-free-ordering-lab`."""

# MODULE 5 · DEBUGGING — debugging & interview drills

[[exercises]]
name = "debugging1"
dir = "31_debugging"
hint = """
To print a type with `{:?}` / `{:#?}` it must implement `Debug`. Most types get it
for free with a single `#[derive(Debug)]` above the `struct`. The derived `Debug`
prints `Config { retries: 3, verbose: true }`."""

[[exercises]]
name = "debugging2"
dir = "31_debugging"
hint = """
This compiles but the large-input test blows up: `acc += v` overflows once the
running total passes `u32::MAX`. Rust does not ignore that — in debug builds the
overflow check PANICS ("attempt to add with overflow"), and in release builds the
value silently WRAPS around to a small wrong number. Either way `+=` is not what
you want here. Pick the behavior on purpose: `checked_add` returns an `Option`
(`None` on overflow), `wrapping_add` wraps deliberately, and `saturating_add`
clamps at `u32::MAX`. We want to clamp, so write `acc = acc.saturating_add(v);`."""

[[exercises]]
name = "debugging3"
dir = "31_debugging"
hint = """
`Display` (`{}`) can never be derived — you must write it by hand. An empty `fmt`
body returns `()`, which mismatches `fmt::Result` and fails to compile. Write into the
formatter `f` with `write!`, using `{:02x}` (two digits, zero-padded, lowercase hex):
`write!(f, "#{:02x}{:02x}{:02x}", self.r, self.g, self.b)`. Note: no trailing
semicolon, so it becomes the returned `fmt::Result`."""

[[exercises]]
name = "debugging4"
dir = "31_debugging"
hint = """
This compiles but panics at runtime with `BorrowMutError` ("already borrowed").
`RefCell` moves the borrow check to run time, but the rule is unchanged: a live
shared `borrow()` and an exclusive `borrow_mut()` may not overlap. `let current =
cell.borrow();` returns a `Ref` guard that keeps the shared borrow alive for the
whole `if` block, so the `borrow_mut()` inside it conflicts. End the shared borrow
first by copying the value out — `let current = *cell.borrow();` — so the temporary
guard drops at the end of that statement, then compare and `borrow_mut()`."""

[[exercises]]
name = "debugging5"
dir = "31_debugging"
hint = """
This is a COMPILE error (E0502), not a runtime bug — Rust makes iterator
invalidation impossible. `v.iter()` borrows `v` immutably for the whole loop, so
`v.remove(i)` cannot take the `&mut` borrow it needs at the same time. Don't try to
patch the indices (a forward index-remove would also SKIP elements, since `remove`
shifts everything left). Replace the entire loop with one safe in-place pass:
`v.retain(|&x| x % 2 != 0);`, which keeps the odd numbers and drops the evens."""

[[exercises]]
name = "debugging6"
dir = "31_debugging"
hint = """
This compiles, but the tests panic with "RefCell already borrowed". A guard that never gets a name is a temporary, and a temporary is dropped at the end of its temporary scope, not after its last use. A `match` scrutinee is not a temporary scope of its own, so the `RefMut` from `self.lanes.borrow_mut()` stays alive until the whole `match` is done. The job runs in the `Some` arm and calls back into `submit`, and that `borrow_mut()` finds the cell still borrowed. `pop_front()` returns an owned `Job`, which ends the BORROW of the guard (so the borrow checker is happy). It does not end the guard's life, and only the guard's `Drop` releases the `RefCell`.

Part A: pop in a statement of its own. A `let` statement is a temporary scope, so the guard is dropped at its `;`, before the job runs:
```
let next = self.lanes.borrow_mut().now.pop_front();
match next {
    Some(job) => {
        self.execute(job);
        true
    }
    None => false,
}
```
`let Some(job) = self.lanes.borrow_mut().now.pop_front() else { return false; };` followed by `self.execute(job); true` works the same way. What does not work:
- turning the `match` into an `if let`: the then-block still holds the guard (see `debugging7`);
- `.map(|job| self.execute(job))` on the popped value: the guard lives until the whole expression is done;
- one named guard held across the `match`.

Edition 2024 would also accept `match { self.lanes.borrow_mut().now.pop_front() } { .. }`, because a block's tail temporaries die with the block. But Clippy's `blocks_in_conditions` suggests removing the braces, and that brings the bug back.

Part B: `mem::swap(&mut self.lanes.borrow_mut().now, &mut self.lanes.borrow_mut().next)` creates two guards, and both live until the `;`. With one named guard, `mem::swap(&mut lanes.now, &mut lanes.next)` is E0499 "cannot borrow `lanes` as mutable more than once at a time". The reason: `lanes.now` means `(*DerefMut::deref_mut(&mut lanes)).now`, and that call borrows the whole guard, twice. Go through `DerefMut` once, then split the fields of the plain `&mut Lanes`. Temporary lifetime extension keeps the guard alive until the end of the function:
```
let lanes = &mut *self.lanes.borrow_mut();
mem::swap(&mut lanes.now, &mut lanes.next);
```
`let Lanes { now, next } = &mut *self.lanes.borrow_mut(); mem::swap(now, next);` and `RefMut::map_split` work too. Wrong answers the tests catch:
- `lanes.now = mem::take(&mut lanes.next);` compiles, but it frees the drained lane's buffer, and a test checks the capacities.
- `lanes.now.append(&mut lanes.next)`, `lanes.now.extend(lanes.next.drain(..))` or a `pop_front` / `push_back` loop keep both buffers, but they move every job into the other buffer, which is O(n). A swap exchanges the two `VecDeque` headers in O(1), and a test checks that the waiting job is still at the same address.

The same split-borrow rule for plain structs is in `37_borrowck_errors/borrowck1`."""

