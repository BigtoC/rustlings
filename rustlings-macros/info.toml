    Some(&self.nodes[i].value)
}
```
Wrong turns the tests reject at compile time: `key: &str` (then `Vec<u8>` and `u32` keys cannot be looked up), `Q: ToOwned<Owned = K>` with `key.to_owned()` (it allocates, and a `str` becomes a `String`, not an `Arc<str>`: E0271), `K: From<&Q>` (there is no `From<&u32>` for `u32`), `K: AsRef<Q>` with a scan (O(n), and neither `u32` nor `String` is `AsRef` of itself: E0277), and a `peek(&mut self)`, or one that calls `get` (E0596 through the `&LruCache` and the `RwLock` read guard). At run time, a `peek` that scans `nodes` or walks the list fails `get_and_peek_are_one_hash_lookup_not_a_scan`. Because `get` needs `&mut self`, a cache behind a `RwLock` takes the write lock for every lookup that counts as a use; the README covers what production caches do about that."""

# MODULE 2 · Binary Search Trees: Link Cursors, a Lazy In-Order Iterator, No Recursion

[[exercises]]
name = "bst1"
dir = "61_trees"
hint = """
The empty bodies are rejected twice with E0308 "mismatched types" (expected `bool`, found `()`).

`insert` walks a cursor that points at a LINK (`&mut Option<Box<Node>>`), not at a node. When the cursor reaches an empty link, that link is where the new leaf belongs, so one assignment through the cursor hangs it there:
```
fn insert(&mut self, key: i32) -> bool {
    let mut cur = &mut self.root;
    while let Some(node) = cur {
        match key.cmp(&node.key) {
            Ordering::Less => cur = &mut node.left,
            Ordering::Greater => cur = &mut node.right,
            Ordering::Equal => return false,
        }
    }
    *cur = Some(Box::new(Node::new(key)));
    self.len += 1;
    true
}
```
(with `use std::cmp::Ordering;` at the top). `cur = &mut node.left` reborrows THROUGH the old cursor and overwrites it, and assigning to `cur` kills the loans on the old `*cur` (problem case #4 of the NLL RFC), so there is never a second live `&mut` into the tree. `return false` returns no borrow, so it is fine inside the loop; returning `cur` itself from inside the loop is part 4's E0499. `contains` is the same walk with a shared cursor:
```
fn contains(&self, key: i32) -> bool {
    let mut cur = self.root.as_deref();
    while let Some(node) = cur {
        match key.cmp(&node.key) {
            Ordering::Less => cur = node.left.as_deref(),
            Ordering::Greater => cur = node.right.as_deref(),
            Ordering::Equal => return true,
        }
    }
    false
}
```
`if key < node.key { .. } else if key > node.key { .. } else { .. }` works just as well as `cmp`. What fails: a recursive helper (the 200_000-deep test aborts the whole run with "thread ... has overflowed its stack"), a `contains` that scans the whole tree instead of one path (the test with a key hidden off the search path), sending equal keys to the right (the duplicate tests), comparing with `key - node.key` (it overflows once `i32::MIN` is the root, and debug builds panic), and forgetting `self.len += 1`. The follow-up interviewers ask: both operations are O(h), and h is n for a sorted insertion order (see the degenerate-tree test), which is why balanced trees and std's `BTreeMap` exist."""

[[exercises]]
name = "bst2"
dir = "61_trees"
hint = """
Both bodies are empty: E0308 "mismatched types" (expected `InOrder<'_>` for `iter`, and `Option<&i32>` for `next`).

Keep the pending LEFT CHAIN on the stack. The smallest key of any subtree is at the end of its chain of left children, and the key right after a node's key is the smallest key of that node's right subtree. So `iter` pushes the root and its left chain, and `next` pops the top node and pushes the left chain of its right child before returning the key:
```
impl<'a> InOrder<'a> {
    fn push_left_chain(&mut self, mut node: Option<&'a Node>) {
        while let Some(n) = node {
            self.stack.push(n);
            node = n.left.as_deref();
        }
    }
}

fn iter(&self) -> InOrder<'_> {
    let mut iter = InOrder { stack: Vec::new() };
    iter.push_left_chain(self.root.as_deref());
    iter
}

fn next(&mut self) -> Option<Self::Item> {
    let node = self.stack.pop()?;
    self.push_left_chain(node.right.as_deref());
    Some(&node.key)
}
```
The helper's parameter must be `Option<&'a Node>`: with a bare `Option<&Node>` rustc says E0621 "explicit lifetime required in the type of `node`", because the nodes go into a `Vec<&'a Node>`. `node` is a `&'a Node` (a copy of the reference that was on the stack), so `&node.key` is a `&'a i32` that borrows the tree, not `self`. Every node is pushed and popped once: O(n) for the whole walk, O(1) amortized per `next`, and at most one node per level on the stack. `as_deref` turns `&'a Option<Box<Node>>` into `Option<&'a Node>`.

What fails: collecting every node up front (the stack-length test on the 1023-node tree), a recursive `push_left_chain` (the 200_000-deep chain of left children aborts with "has overflowed its stack"), a pre-order walk (the order tests), and `Box::leak(Box::new(node.key))` (the address tests). Once `next` returns `None` it keeps returning `None`, because the stack stays empty; `impl FusedIterator for InOrder<'_> {}` would state that promise in the type. Follow-up questions: the memory cost (O(h) versus O(n) for a collected `Vec`), and why `tree.insert(..)` inside `for k in &tree` is E0502."""

[[exercises]]
name = "bst3"
dir = "61_trees"
hint = """
`height` is empty: E0308 "mismatched types" (expected `usize`, found `()`). `invert` compiles as it is (an empty body returns `()`), so once `height` compiles, the invert tests fail until it mirrors the tree.

Invert with an explicit stack of `&mut Node`:
```
fn invert(&mut self) {
    let mut pending: Vec<&mut Node> = Vec::new();
    pending.extend(self.root.as_deref_mut());
    while let Some(node) = pending.pop() {
        std::mem::swap(&mut node.left, &mut node.right);
        pending.extend(node.left.as_deref_mut());
        pending.extend(node.right.as_deref_mut());
    }
}
```
Several `&mut Node` live in the `Vec` at once, and that is sound: each one was reborrowed from its parent through `left` or `right`, two disjoint fields, and the parent's `&mut` is never used again after its children were pushed. `mem::swap` exchanges two pointers; no subtree moves and no key changes node. `Option::as_deref_mut` turns `&mut Option<Box<Node>>` into `Option<&mut Node>`, and `Vec::extend` accepts an `Option` because `Option` implements `IntoIterator` (zero or one items). A `VecDeque` used as a queue works the same.

Height, breadth-first: count the levels.
```
fn height(&self) -> usize {
    let mut level: VecDeque<&Node> = self.root.as_deref().into_iter().collect();
    let mut height = 0;
    while !level.is_empty() {
        height += 1;
        for _ in 0..level.len() {
            if let Some(node) = level.pop_front() {
                level.extend(node.left.as_deref());
                level.extend(node.right.as_deref());
            }
        }
    }
    height
}
```
(with `use std::collections::VecDeque;`). A depth-first stack of `(node, depth)` pairs that keeps the largest depth is just as good, and uses O(h) instead of O(width) memory. What fails: recursion in either function (the 200_000-deep test aborts with "has overflowed its stack"), following only the leftmost or the rightmost path, counting edges instead of nodes, swapping only the root's children, and writing the keys back in reverse order instead of relinking (the address test compares every node's key and children)."""

[[exercises]]
name = "bst4"
dir = "61_trees"
hint = """
find_slot fails with E0499 "cannot borrow `*cur` as mutable more than once at a time" at `return cur`, with the note "returning this value requires that `cur.0` is borrowed for `'1`". `while let Some(node) = cur` takes a MUTABLE borrow of `*cur`. On the looping path that borrow flows into `cur`, which is returned, so it must last for the caller's `'1`, and NLL's location-insensitive constraints keep it live on the early-return path too. That is NLL problem case #3 (see `37_borrowck_errors/borrowck3`) inside a loop. Decide with a SHARED borrow, and take the mutable one only to step the cursor:
```
fn find_slot(&mut self, key: i32) -> &mut Option<Box<Node>> {
    let mut cur = &mut self.root;
    while cur.as_ref().is_some_and(|node| node.key != key) {
        if let Some(node) = cur {
            cur = if key < node.key { &mut node.left } else { &mut node.right };
        }
    }
    cur
}
```
`let node = cur.as_mut().unwrap();` in the body works too, and so does a let chain whose FIRST test is shared: `while let Some(node) = cur.as_deref() && node.key != key`, with `cur.as_mut().unwrap()` inside. These do NOT compile, because they take the mutable borrow before the test: `match cur { Some(node) if node.key != key => .., _ => return cur }`, `while let Some(node) = cur && node.key != key`, and `break` in place of `return cur`.

`take_min` is the same walk along the left links, then an unlink:
```
fn take_min(slot: &mut Option<Box<Node>>) -> Option<Box<Node>> {
    let mut cur = slot;
    while cur.as_ref().is_some_and(|node| node.left.is_some()) {
        if let Some(node) = cur {
            cur = &mut node.left;
        }
    }
    let mut min = cur.take()?;
    *cur = min.right.take();
    Some(min)
}
```
(A loop that `break`s when `node.left` is empty and then calls `cur.take()` gets E0499 plus E0506 "cannot assign to `*cur` because it is borrowed": returning the cursor is not required to hit this.)

`remove` takes the node out of its slot and writes the replacement back:
```
fn remove(&mut self, key: i32) -> bool {
    let slot = self.find_slot(key);
    let Some(mut node) = slot.take() else {
        return false;
    };
    *slot = match (node.left.take(), node.right.take()) {
        (None, None) => None,
        (Some(child), None) | (None, Some(child)) => Some(child),
        (Some(left), Some(right)) => {
            let mut right = Some(right);
            let mut successor = take_min(&mut right).expect("the right subtree is not empty");
            successor.left = Some(left);
            successor.right = right;
            Some(successor)
        }
    };
    self.len -= 1;
    true
}
```
What fails: copying the successor's key into the removed node (the address checks: the successor's key must stay in its own node), picking the predecessor or hanging the left subtree under the successor instead of moving the successor up (the shape checks), moving a successor or predecessor up when the node has only one child (the one-child test: the child's whole subtree moves up), `unwrap` on a missing key, a forgotten `self.len -= 1`, and recursion anywhere (the 200_000-deep test aborts with "has overflowed its stack"). On nightly, the original Polonius (`-Zpolonius`) accepts the starter's `find_slot`; `-Zpolonius=next` still rejects the loop."""

# MODULE 2 · Graphs: BFS, Iterative DFS, Topological Order, Union-Find, Grids

[[exercises]]
name = "graph1"
dir = "62_graphs"
hint = """
All five bodies are empty, so each one fails with E0308 "mismatched types" (expected `Vec<Option<usize>>`, `Option<Vec<usize>>`, `Result<Vec<usize>, CycleError>`, `usize` or `bool`, found `()`). Add `use std::cmp::Reverse;` and `use std::collections::{BinaryHeap, VecDeque};`.

bfs: a `VecDeque` of `(node, distance)`. A node gets its distance when it is QUEUED, so `dist` doubles as the visited set and nothing is queued twice:
```
fn bfs(adj: &[Vec<usize>], src: usize) -> Vec<Option<usize>> {
    let mut dist = vec![None; adj.len()];
    dist[src] = Some(0);
    let mut queue = VecDeque::from([(src, 0)]);
    while let Some((u, d)) = queue.pop_front() {
        for &v in &adj[u] {
            if dist[v].is_none() {
                dist[v] = Some(d + 1);
                queue.push_back((v, d + 1));
            }
        }
    }
    dist
}
```
A depth-first walk (recursive, or with a `Vec` as a stack) fails `bfs_counts_the_fewest_edges_not_the_first_route_found`: it reaches node 4 the long way first. `Vec::remove(0)` as the queue costs O(n) per pop.

shortest_path: the same BFS with a parent array, then a loop back from `dst` and one `reverse`:
```
fn shortest_path(adj: &[Vec<usize>], src: usize, dst: usize) -> Option<Vec<usize>> {
    let mut seen = vec![false; adj.len()];
    let mut parent = vec![None; adj.len()];
    seen[src] = true;
    let mut queue = VecDeque::from([src]);
    while let Some(u) = queue.pop_front() {
        if u == dst {
            break;
        }
        for &v in &adj[u] {
            if !seen[v] {
                seen[v] = true;
                parent[v] = Some(u);
                queue.push_back(v);
            }
        }
    }
    if !seen[dst] {
        return None;
    }
    let mut path: Vec<usize> = std::iter::successors(Some(dst), |&v| parent[v]).collect();
    path.reverse();
    Some(path)
}
```
`src` never gets a parent, so the walk stops there. Building the path recursively aborts the test binary with "has overflowed its stack" on the 100_000-node path. `insert(0, ..)` in the loop is O(n^2). Forgetting the `reverse` returns `[dst, .., src]`.

topo_order: count the in-degrees, then always take the smallest ready node from a min-heap:
```
fn topo_order(n: usize, edges: &[(usize, usize)]) -> Result<Vec<usize>, CycleError> {
    let mut targets = vec![Vec::new(); n];
    let mut in_degree = vec![0_usize; n];
    for &(u, v) in edges {
        targets[u].push(v);
        in_degree[v] += 1;
    }
    let mut ready: BinaryHeap<Reverse<usize>> =
        (0..n).filter(|&u| in_degree[u] == 0).map(Reverse).collect();
    let mut order = Vec::with_capacity(n);
    while let Some(Reverse(u)) = ready.pop() {
        order.push(u);
        for &v in &targets[u] {
            in_degree[v] -= 1;
            if in_degree[v] == 0 {
                ready.push(Reverse(v));
            }
        }
    }
    match n - order.len() {
        0 => Ok(order),
        unordered => Err(CycleError { unordered }),
    }
}
```
A FIFO `VecDeque` gives a valid order but not the smallest one ([4, 5, 2, 0, 3, 1] instead of [4, 5, 0, 2, 3, 1]). A `BinaryHeap<usize>` without `Reverse` gives the largest-first order. A `BTreeSet` with `pop_first` works too. A node on a cycle, or behind one, never reaches in-degree 0, so `n - order.len()` is the unordered count.

find: two loops, one up to the root and one that repoints the same path. rustc suggests returning the local binding `x`; that compiles, but `x` is the answer only when it is a root already:
```
fn find(&mut self, x: usize) -> usize {
    let mut root = x;
    while self.parent[root] != root {
        root = self.parent[root];
    }
    let mut node = x;
    while node != root {
        let next = self.parent[node];
        self.parent[node] = root;
        node = next;
    }
    root
}
```
The recursive version (`let root = self.find(p); self.parent[x] = root;`) overflows the stack on the 200_000-node chain. Path halving (`self.parent[x] = self.parent[self.parent[x]]`) has the same amortized bound but only shortens the path, so `find_compresses_the_whole_path_in_one_call` fails. So does a `find` that compresses nothing.

union: compare the sizes of the two ROOTS and hang the smaller under the bigger:
```
fn union(&mut self, a: usize, b: usize) -> bool {
    let (mut big, mut small) = (self.find(a), self.find(b));
    if big == small {
        return false;
    }
    if self.size[big] < self.size[small] {
        std::mem::swap(&mut big, &mut small);
    }
    self.parent[small] = big;
    self.size[big] += self.size[small];
    true
}
```
Always hanging `a`'s root under `b`'s (or the reverse) builds a 4_095-deep chain in `unions_in_a_line_keep_every_tree_shallow`, in one of the two argument orders. Taking `self.parent[a]` as the root instead of calling `find` fails `union_reports_whether_it_merged`: once two sets of 2 merge, a node sits two links below its root, and `union` merges a set with itself. Comparing `self.size[a]` with `self.size[b]` reads the out-of-date sizes of non-roots and fails a union-by-size test. Returning `true` for two nodes of one set breaks the given Kruskal: `mst_weight` then counts a self-loop as a merge and reports a disconnected graph as connected. Union by rank is fine in general, but this `Dsu` keeps sizes, and `set_size` reads them. Related: `59_arena` (index links), `44_trait_contracts/contracts3` (`Reverse` and a min-heap in Dijkstra's algorithm), and `graph2` for depth-first search."""

[[exercises]]
name = "graph2"
dir = "62_graphs"
hint = """
E0502 "cannot borrow `*self` as mutable because it is also borrowed as immutable": `for &v in &self.adj[start]` keeps the field `self.adj` borrowed for the whole loop, and `self.dfs(v)` needs `&mut self`, which borrows every field, `adj` included. rustc does not look into `dfs` to see that it only writes `seen`; it trusts the signature, and a `&mut self` method could push onto `self.adj[start]` and invalidate the loop. `has_cycle_directed` is empty: E0308 "mismatched types", expected `bool`, found `()`.

dfs: keep your own stack and use the fields directly inside the loop. A shared borrow of `self.adj` and a write to `self.seen` borrow two different places, so they do not conflict (a split borrow, `37_borrowck_errors/borrowck1`). Mark a node when it is pushed, so it is counted once:
```
fn dfs(&mut self, start: usize) -> usize {
    if self.seen[start] {
        return 0;
    }
    self.seen[start] = true;
    let mut marked = 1;
    let mut stack = vec![start];
    while let Some(u) = stack.pop() {
        for &v in &self.adj[u] {
            if !self.seen[v] {
                self.seen[v] = true;
                marked += 1;
                stack.push(v);
            }
        }
    }
    marked
}
```
Marking and counting on pop (skip a node that is already seen) is fine too. The split-borrow recursion, `fn visit(adj: &[Vec<usize>], seen: &mut [bool], u: usize) -> usize` called as `visit(&self.adj, &mut self.seen, start)`, compiles and copies nothing. It is the right fix when the depth is known to be small, but here it aborts the test binary with "has overflowed its stack" on the 200_000-node path. So does recursing over `self.adj[start].clone()`, and so does taking the list out with `std::mem::take(&mut self.adj[start])` and putting it back after the recursive loop. Cloning a neighbor list inside the loop above passes the tests, but pays an allocation per node for nothing.

has_cycle_directed: three colors, and a stack of `(node, next edge index)` frames, so a node turns black only when its last edge is done (where a recursive DFS would return):
```
fn has_cycle_directed(&self) -> bool {
    let mut color = vec![Color::White; self.len()];
    let mut stack: Vec<(usize, usize)> = Vec::new();
    for root in 0..self.len() {
        if color[root] != Color::White {
            continue;
        }
        color[root] = Color::Gray;
        stack.push((root, 0));
        while let Some(frame) = stack.last_mut() {
            let (u, next_edge) = *frame;
            match self.adj[u].get(next_edge) {
                Some(&v) => {
                    frame.1 += 1;
                    match color[v] {
                        Color::Gray => return true,
                        Color::White => {
                            color[v] = Color::Gray;
                            stack.push((v, 0));
                        }
                        Color::Black => {}
                    }
                }
                None => {
                    color[u] = Color::Black;
                    stack.pop();
                }
            }
        }
    }
    false
}
```
`frame` borrows `stack` mutably, but its last use is `frame.1 += 1`, so the `stack.push` after it compiles. These all fail: a visited set ("seen before means a cycle") fails the diamond; graying nodes when they are pushed fails `0 -> 1, 0 -> 2, 2 -> 1`; blackening a node as soon as its neighbors are pushed misses `0 -> 1 -> 2 -> 0`; starting only from node 0 misses a cycle elsewhere; a recursive three-color DFS overflows the stack on the 200_000-node tests. Searching from every node for a way back to itself is O(V * (V + E)), about 2 * 10^10 steps on the 200_000-node path. Two alternatives pass: a stack of `(node, exiting)` markers (gray on entry, black when the marker comes off), and Kahn's algorithm (graph1's `topo_order`: there is a cycle exactly when some node never reaches in-degree 0). In an undirected graph every edge would look like a cycle this way: skip the edge back to the parent, or use union-find. Related: `61_trees` (traversal with an explicit stack)."""

[[exercises]]
name = "grid1"
dir = "62_graphs"
hint = """
The tests panic with "attempt to subtract with overflow": at row 0 (or column 0), `r - 1` is `0 - 1` on a `usize`, and tests run with overflow checks on. (In a release build the checks are off, `r - 1` wraps to `usize::MAX`, and the `< rows` check throws it out by accident.) Never compute a coordinate that may not exist. Add a signed offset with `checked_add_signed`, which returns `None` below 0 or past `usize::MAX`, and let `?` drop that direction inside `filter_map`:
```
fn neighbors(r: usize, c: usize, rows: usize, cols: usize) -> impl Iterator<Item = (usize, usize)> {
    const DIRECTIONS: [(isize, isize); 4] = [(-1, 0), (1, 0), (0, -1), (0, 1)];
    DIRECTIONS.into_iter().filter_map(move |(dr, dc)| {
        let nr = r.checked_add_signed(dr)?;
        let nc = c.checked_add_signed(dc)?;
        (nr < rows && nc < cols).then_some((nr, nc))
    })
}
```
Add the four diagonal pairs to the table for 8 neighbors. `checked_sub` works too:
```
let up = r.checked_sub(1).map(|nr| (nr, c));
let left = c.checked_sub(1).map(|nc| (r, nc));
let down = (r + 1 < rows).then_some((r + 1, c));
let right = (c + 1 < cols).then_some((r, c + 1));
[up, down, left, right].into_iter().flatten()
```
So do `if r > 0` guards, and so does `r.wrapping_sub(1)` followed by the `< rows` check (the wrapped value, `usize::MAX`, fails it). `saturating_sub(1)` turns `(0, c)` into its own neighbor, which fails the corner, edge, 1x1 and brute-force tests. A detour through `i32` breaks past `i32::MAX` rows, and `r as isize - 1` overflows past `isize::MAX`: `coordinates_beyond_i32_and_isize_work` catches both. Related: `63_slices_strings/window1` (`len() - 1` on an empty slice) and `31_debugging/debugging2` (overflow checks in debug and release builds)."""

[[exercises]]
name = "grid2"
dir = "62_graphs"
hint = """
E0502 "cannot borrow `self.cells` as mutable because it is also borrowed as immutable", with the note "Rust 2024 has adjusted the `impl Trait` lifetime capture rules". In edition 2024 a return-position `impl Trait` captures every generic parameter in scope, including the anonymous lifetime of `&self`. So a caller must assume that the iterator borrows `*self` for as long as it lives, whatever the body does. The `for` loop keeps it alive while `count_islands` writes `self.cells`. The test gets E0502 on `grid.cells` and E0597 on `small` for the same reason. The closure only holds copies of `r`, `c`, `rows` and `cols`, so declare that the hidden type captures nothing:
```
fn neighbors(&self, r: usize, c: usize) -> impl Iterator<Item = (usize, usize)> + use<> {
    let (rows, cols) = (self.rows, self.cols);
    DIRECTIONS.into_iter().filter_map(move |(dr, dc)| {
        let nr = r.checked_add_signed(dr)?;
        let nc = c.checked_add_signed(dc)?;
        (nr < rows && nc < cols).then_some((nr, nc))
    })
}
```
`+ use<>` (precise capturing, stable since Rust 1.82) is a promise the compiler checks. If the closure read `self.rows` instead of the copy, the hidden type would hold `&self`, and you would get E0700 "hidden type for `impl Iterator<Item = (usize, usize)>` captures lifetime that does not appear in bounds". `+ 'static` also compiles here; `+ use<'_>` spells out the default and changes nothing. `Box<dyn Iterator<Item = (usize, usize)>>` passes too, because a boxed trait object in a return type defaults to `+ 'static`, but it allocates on every call and is not the `impl Iterator` the TODO asks for. Collecting the neighbors into a `Vec` inside `count_islands` fixes that function but not the test, and allocates for every cell. Under edition 2021 the original signature compiled, because lifetimes were captured only when the bounds named them (`+ '_`).

E0608 "cannot index into a value of type `Grid`": `grid[(r, c)]` means `*grid.index((r, c))`, or `*grid.index_mut((r, c))` when assigned to, so implement both traits with the tuple as the index type. Check each axis on its own: with only `r * cols + c`, `(0, cols)` reads `(1, 0)` and both `#[should_panic]` tests fail. Add `use std::ops::{Index, IndexMut};` and:
```
impl Grid {
    fn offset(&self, (r, c): (usize, usize)) -> usize {
        assert!(
            r < self.rows && c < self.cols,
            "cell ({r}, {c}) is outside the {}x{} grid",
            self.rows,
            self.cols
        );
        r * self.cols + c
    }
}

impl Index<(usize, usize)> for Grid {
    type Output = u8;

    fn index(&self, cell: (usize, usize)) -> &u8 {
        &self.cells[self.offset(cell)]
    }
}

impl IndexMut<(usize, usize)> for Grid {
    fn index_mut(&mut self, cell: (usize, usize)) -> &mut u8 {
        let offset = self.offset(cell);
        &mut self.cells[offset]
    }
}
```
In `index_mut`, compute the offset before borrowing `self.cells`. `&mut self.cells[self.offset(cell)]` is E0502 "cannot borrow `*self` as immutable because it is also borrowed as mutable": the part 2 lesson again, since a `&self` method call borrows the whole struct. Related: `graph2` (a recursive flood fill would overflow the stack on the 400x400 island, as its DFS does) and `37_borrowck_errors` for the borrow rules behind both errors."""

