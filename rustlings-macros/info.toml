hint = """
Both parts compile, and both panic with "RefCell already borrowed".

Part A: the temporaries of a `while let` scrutinee are dropped at the end of each iteration's body. So the queue is still mutably borrowed while `attempt` runs, and the first `retry_later` panics. A `let` above the loop cannot help, because the loop has to pop again on every iteration. Pop inside the body, in a statement of its own. A `let ... else` drops its temporaries at the end of the statement, and before its `else` block when the pattern does not match:
```
let mut runs = 0;
loop {
    let Some(task) = self.queue.borrow_mut().pop_front() else {
        break;
    };
    runs += 1;
    self.attempt(task);
}
runs
```
Other fixes that work:
- a helper method, because its guard dies when it returns: `fn pop_next(&self) -> Option<Task> { self.queue.borrow_mut().pop_front() }`, then `while let Some(task) = self.pop_next() { .. }`;
- `let next = self.queue.borrow_mut().pop_front(); match next { .. }` inside a `loop`.

`loop { if let Some(task) = self.queue.borrow_mut().pop_front() { .. } else { break } }` does NOT work: the then-block keeps the guard. Clippy's `while_let_loop` even suggests turning it back into the original `while let`. Draining the whole queue into a `Vec` first compiles, but the retries added during the loop never run. This is the thread-pool trap from the Rust Book (Listing 21-21): `while let Ok(job) = receiver.lock().unwrap().recv()` holds the `Mutex` while the job runs.

Part B: edition 2024 drops an `if let` scrutinee's temporaries before the `else` block. The then-block still sees them, because the pattern's bindings may borrow from them. `pos` is a plain `usize`, but the `Ref` from `self.queue.borrow()` is still alive, so the `borrow_mut()` inside panics. Search in a statement of its own, then mutate through one guard:
```
let found = self.queue.borrow().iter().position(|t| t.name == name);
if let Some(pos) = found {
    let mut queue = self.queue.borrow_mut();
    let task = queue.remove(pos).expect("`position` just found it");
    queue.push_front(task);
    true
} else {
    false
}
```
Taking `borrow_mut()` once up front and searching through that guard works too, and so does `queue.make_contiguous()[..=pos].rotate_right(1)`. `queue.swap(0, pos)` does not: it moves the old front task to `pos` and breaks the order of the others. If two queued tasks share the name, only the first one moves, which is the one `position` finds. `rposition`, or a stable sort that pulls every matching task forward, fails that test. A plain `if` condition (no pattern) is its own temporary scope, so `if self.queue.borrow().is_empty() { .. }` never has this problem."""

[[exercises]]
name = "debugging8"
dir = "31_debugging"
hint = """
The tests fail to build first: E0425 "cannot find value `MATCH_ARM_CAN_RELOCK` in this scope" (and three more) until Part B's constants exist. After that, every miss panics. The `MutexGuard` from `lock()` is a temporary of the `match` scrutinee, so it lives until the whole `match` is done. `.cloned()` ends the borrow of the guard, not the guard. The `None` arm then locks the mutex again on the same thread. With `lock()` that call "will not return" (std's `Mutex` is not reentrant), so the thread deadlocks on itself. Here `try_lock` returns `Err(WouldBlock)` instead, and `expect` panics. The test whose `compute` probes the lock fails even earlier, because `compute` runs while the lock is held.

Part A: look the key up in a statement of its own, so the guard is dropped at the `;`. Compute with no lock held, then lock again to store the value. `entry(key).or_insert(value)` keeps a value that another thread stored in the meantime, and returns it:
```
let cached = self.map.lock().unwrap().get(&key).cloned();
if let Some(hit) = cached {
    return hit;
}
let value: Arc<str> = compute(key).into();
Arc::clone(self.map.lock().unwrap().entry(key).or_insert(value))
```
The second lock is a plain `lock()` again: no guard of ours is alive, and `try_lock` would also fail whenever ANOTHER thread holds the mutex. `let Some(hit) = self.map.lock().unwrap().get(&key).cloned() else { .. };` with the computation in the `else` block works too, because a `let ... else` drops its temporaries before `else` runs. In edition 2024 even `if let Some(hit) = ...cloned() { hit } else { .. }` works, because the guard is dropped before `else`. But the same code deadlocks in edition 2021, and it turns back into the bug the moment someone rewrites it as a `match`.

Wrong answers the tests catch:
- `entry(key).or_insert_with(..)` with `compute` inside the closure holds the lock while computing.
- A plain `insert` after computing overwrites the value the other thread stored.
- Copying the whole map out of the mutex (`self.map.lock().unwrap().clone()`) frees the lock but copies every entry on every lookup. A test counts the `Arc` handles while `compute` runs.

To avoid the duplicate computation as well, you would need a per-key single flight (a `OnceLock` per key, for example).

Part B, with the reason for each answer:
```
// A `match` scrutinee is not a temporary scope: the guard lives through every arm.
const MATCH_ARM_CAN_RELOCK: bool = false;
// The then-block keeps the scrutinee's temporaries (its bindings may borrow from them).
const IF_LET_THEN_CAN_RELOCK: bool = false;
// Edition 2024 drops them before `else` runs (in 2021 this was `false`).
const IF_LET_ELSE_CAN_RELOCK_2024: bool = true;
// A `let` statement drops its temporaries at the `;`.
const LET_STMT_CAN_RELOCK: bool = true;
```
See also `debugging6` (the `RefCell` version) and `debugging7` (`while let` and the 2024 `if let` rules)."""

# MODULE 5 · Slices and Strings: Two Pointers, Unicode Windows, Intervals, Binary Search

[[exercises]]
name = "window1"
dir = "63_slices_strings"
hint = """
Two panics, one per integer rule, plus an empty function.

`three_sum` first (E0308, the body is empty). Sort a copy, fix the first element,
and run two pointers over the rest, skipping repeated values so each triple is
found once:
```
fn three_sum(nums: &[i32]) -> Vec<[i32; 3]> {
    let mut v = nums.to_vec();
    v.sort_unstable();
    let mut out = Vec::new();
    for (a, &first) in v.iter().enumerate() {
        if a > 0 && first == v[a - 1] {
            continue;
        }
        let (mut lo, mut hi) = (a + 1, v.len() - 1);
        while lo < hi {
            let sum = i64::from(first) + i64::from(v[lo]) + i64::from(v[hi]);
            match sum.cmp(&0) {
                Ordering::Less => lo += 1,
                Ordering::Greater => hi -= 1,
                Ordering::Equal => {
                    out.push([first, v[lo], v[hi]]);
                    lo += 1;
                    while lo < hi && v[lo] == v[lo - 1] {
                        lo += 1;
                    }
                }
            }
        }
    }
    out
}
```
Skipping a repeated second value is enough: the same triple would need the same
first and second values. `v.len() - 1` is safe here because the loop body only
runs when `v` is not empty. Collecting the triples into a `BTreeSet<[i32; 3]>`
(sorted and deduplicated for free) also passes. You cannot simply reuse
`two_sum_sorted` with target `-first`: it finds only one pair, and `-i32::MIN`
overflows.

`two_sum_sorted`: on `&[]`, `nums.len() - 1` is `0 - 1` on a `usize` ("attempt to
subtract with overflow"), and `nums[i] + nums[j]` overflows for pairs like
`1 + i32::MAX` ("attempt to add with overflow"). Ask for the last index instead of
assuming one, and compare in `i64`, where every sum of two `i32`s is exact:
```
let mut i = 0;
let mut j = nums.len().checked_sub(1)?;
let target = i64::from(target);
while i < j {
    let sum = i64::from(nums[i]) + i64::from(nums[j]);
    match sum.cmp(&target) {
        Ordering::Equal => return Some((i, j)),
        Ordering::Less => i += 1,
        Ordering::Greater => j -= 1,
    }
}
None
```
`if nums.len() < 2 { return None; }` works as the guard too, and so does a
half-open scan: `let (mut i, mut j) = (0, nums.len()); while i + 1 < j { .. nums[j - 1] .. }`,
returning `(i, j - 1)`. A `HashMap` from value to index also passes, but it
gives up the O(1) space that the sorted input buys you.

What fails: `nums[i].checked_add(nums[j])?` gives up at the first overflow and
misses `(0, 1)` in `[1, 4, i32::MAX - 1, i32::MAX]`; `saturating_add` makes
`1 + i32::MAX` equal to a target of `i32::MAX`; `wrapping_add` wraps a sum that
leaves the `i32` range around to the other sign, so the pointers move the wrong
way (that is what the original code does in a release build). Integer overflow
basics are in `31_debugging/debugging2`."""

[[exercises]]
name = "window2"
dir = "63_slices_strings"
hint = """
The byte scan treats every byte as a character. "éã" is the bytes C3 A9 C3 A3:
the repeated lead byte C3 moves the window's start to byte 1, inside 'é', and
`&s[best]` panics with "start byte index 1 is not a char boundary; it is inside
'é' (bytes 0..2 of string)". It also measures windows in bytes, so it would
prefer "🦀🐍" (2 chars, 8 bytes) to "🐍abc" (4 chars, 7 bytes).

Step through `char_indices()`, which yields `(byte_offset, char)` with every offset
on a char boundary, and remember for each char its position counted in chars and
the byte offset just past it:
```
use std::collections::HashMap;

fn longest_unique_substring(s: &str) -> &str {
    let mut last_seen: HashMap<char, (usize, usize)> = HashMap::new();
    let (mut start, mut start_pos) = (0, 0);
    let (mut best, mut best_len) = (0..0, 0);
    for (pos, (i, c)) in s.char_indices().enumerate() {
        let end = i + c.len_utf8();
        if let Some((prev_pos, prev_end)) = last_seen.insert(c, (pos, end))
            && prev_pos >= start_pos
        {
            (start, start_pos) = (prev_end, prev_pos + 1);
        }
        let len = pos + 1 - start_pos;
        if len > best_len {
            (best, best_len) = (start..end, len);
        }
    }
    &s[best]
}
```
`insert` returns the previous entry, so each char costs one hash lookup. The let
chain's `prev_pos >= start_pos` stops an occurrence that is already behind the
window from moving the start back ("abba" must give "ab", "tmmzuxt" must give
"mzuxt"). `len > best_len`, not `>=`, keeps the leftmost window on a tie ("pwwkew"
gives "wke", not "kew").

Other correct shapes: a `HashMap<char, usize>` of byte offsets plus a char counter
(subtract `s[start..new_start].chars().count()` when the start jumps; each char
leaves the window once, so it stays O(n)); or collect `char_indices()` into a
`Vec`, run the window over char positions, and turn the best range back into byte
offsets at the end.

What fails: `s.get(best).unwrap_or("")`, or rounding the offsets with
`floor_char_boundary` / `ceil_char_boundary`, hides the panic but keeps the wrong
window; comparing `end - start` (bytes) instead of a length in chars; `>=` for
ties; returning `Box::leak(text.into_boxed_str())` fails the address check,
because the answer must borrow the input."""

[[exercises]]
name = "window3"
dir = "63_slices_strings"
hint = """
The body is empty (E0308). rustc suggests returning `intervals`, which compiles
but merges nothing.

Sort by start, then sweep once. Each interval either extends the last merged one
or starts a new one, and the let chain says exactly that:
```
fn merge_intervals(mut intervals: Vec<(i32, i32)>) -> Vec<(i32, i32)> {
    intervals.sort_unstable_by_key(|&(start, _)| start);
    let mut out: Vec<(i32, i32)> = Vec::with_capacity(intervals.len());
    for (start, end) in intervals {
        if let Some(last) = out.last_mut()
            && start <= last.1
        {
            last.1 = last.1.max(end);
        } else {
            out.push((start, end));
        }
    }
    out
}
```
(`mut` in the parameter list only makes the binding mutable; the function's type
does not change.) The `else` branch may push because `last` is not used there, so
its borrow of `out` has already ended. Without let chains (before Rust 1.88, or in
edition 2021) write `match out.last_mut() { Some(last) if start <= last.1 => last.1 = last.1.max(end), _ => out.push((start, end)) }`.

The follow-up "can you do it without a second Vec?": `Vec::dedup_by` merges
neighbors in place. Its closure gets the CURRENT element first and the last kept
one second, and returning `true` drops the current one:
```
intervals.sort_unstable_by_key(|&(start, _)| start);
intervals.dedup_by(|next, last| {
    if next.0 <= last.1 {
        last.1 = last.1.max(next.1);
        true
    } else {
        false
    }
});
intervals
```

What fails: `<` instead of `<=` (touching intervals stay apart); `last.1 = end`
instead of the max (`(2, 3)` shrinks `(1, 10)`); no sort, or sorting by end
(`(1, 10)` gets merged into `(2, 3)` as `(2, 10)`); swapping the two `dedup_by`
arguments. `sort_by_key` and `sort_unstable()` on the whole tuples pass too;
`sort_by_key` just allocates a buffer it does not need."""

[[exercises]]
name = "window4"
dir = "63_slices_strings"
hint = """
Two empty bodies (E0308) and one overflow.

`count_in_range`: find the first index holding a value `>= lo`, then count the
values `< hi` in the suffix that starts there. That suffix holds only values
`>= lo`, so a reversed range counts 0 without any subtraction:
```
let start = sorted.partition_point(|&x| x < lo);
sorted[start..].partition_point(|&x| x < hi)
```
`sorted.partition_point(|&x| x < hi).saturating_sub(sorted.partition_point(|&x| x < lo))`,
or an early `if lo >= hi { return 0; }`, works too. A plain subtraction panics
with "attempt to subtract with overflow" on `(5, 2)`. `binary_search` is not a
lower bound: with duplicates it returns any matching index (`[2; 8].binary_search(&2)`
is `Ok(7)` on Rust 1.96, so counting from it gives 1 instead of 8). And `<=` in
the second call would count `hi` itself, a closed range.

`first_true`: once `lo` passes the middle of `0..u64::MAX`, `lo + hi` overflows
("attempt to add with overflow"). Replace the midpoint:
```
let mid = lo.midpoint(hi);
```
or `let mid = lo + (hi - lo) / 2;`. Both stay inside `lo..hi` whenever `lo < hi`,
so `hi = mid` and `lo = mid + 1` keep the half-open invariant.
`lo.wrapping_add(hi) / 2` and `lo.saturating_add(hi) / 2` put `mid` below `lo`:
the tests catch the probe outside the range (in release, such a search can loop
forever).

`min_ship_capacity`: a capacity check that loads greedily is monotone (a bigger
ship never needs more days), so binary search the smallest capacity that fits.
Nothing below the heaviest package fits, and the total weight (all in one day)
always fits, so the total is the right `hi`: if nothing smaller fits,
`first_true` returns it.
```
let fits = |cap: u64| {
    let (mut used, mut load) = (1, 0);
    for &w in weights {
        let w = u64::from(w);
        if load + w > cap {
            used += 1;
            load = 0;
            if used > days {
                return false;
            }
        }
        load += w;
    }
    true
};
let heaviest = weights.iter().copied().max().map_or(0, u64::from);
let total = weights.iter().copied().map(u64::from).sum();
first_true(heaviest, total, fits)
```
`hi = total + 1` also works. Starting the search at 0 or 1 is wrong: a check that
never looks at single packages then says a ship smaller than the heaviest package
fits. Summing in `u32` overflows on three `u32::MAX` packages."""

# MODULE 5 · Parsing: Borrowed Tokens, Recursive Descent, Never-Panicking Evaluation, an AST

[[exercises]]
name = "parse1"
dir = "64_parsing"
hint = """
The body is empty, so rustc reports E0308 "mismatched types": expected `Option<Result<(usize, Token<'a>), LexError>>`, found `()`.

Skip the whitespace, look at the first other character, and let a small helper consume a run of characters and say where the run ends. `next_if` consumes a character only when it matches, so the first one that doesn't is still waiting in the iterator, and its offset (or `src.len()` at the end of the input) is where the token ends:
```
use std::num::IntErrorKind;

impl<'a> Lexer<'a> {
    fn eat_while(&mut self, pred: impl Fn(char) -> bool) -> usize {
        while self.chars.next_if(|&(_, c)| pred(c)).is_some() {}
        self.chars.peek().map_or(self.src.len(), |&(i, _)| i)
    }
}

impl<'a> Iterator for Lexer<'a> {
    type Item = Result<(usize, Token<'a>), LexError>;

    fn next(&mut self) -> Option<Self::Item> {
        let (start, c) = self.chars.find(|&(_, c)| !c.is_whitespace())?;
        let token = match c {
            '+' => Token::Plus,
            '-' => Token::Minus,
            '*' => Token::Star,
            '/' => Token::Slash,
            '(' => Token::LParen,
            ')' => Token::RParen,
            '0'..='9' => {
                let end = self.eat_while(|c| c.is_ascii_digit());
                return Some(match self.src[start..end].parse() {
                    Ok(n) => Ok((start, Token::Num(n))),
                    Err(e) => match e.kind() {
                        IntErrorKind::PosOverflow => Err(LexError::NumberTooLarge { pos: start }),
                        kind => unreachable!("ASCII digits failed with {kind:?}"),
                    },
                });
            }
            c if is_ident_start(c) => {
                let end = self.eat_while(is_ident_continue);
                Token::Ident(&self.src[start..end])
            }
            ch => return Some(Err(LexError::UnexpectedChar { ch, pos: start })),
        };
        Some(Ok((start, token)))
    }
}
```
(`eat_while` can also go into the existing `impl<'a> Lexer<'a>` block.) `find` consumes the whitespace AND the first other character, and its `?` ends the iteration when only whitespace was left. `&self.src[start..end]` is a `&'a str` even though `next` borrows `self` only for the call: the slice is taken through the `&'a str` field, so it borrows the source, not the lexer (`25_lifetimes_deep/lifetimes6`). Both offsets come from `char_indices`, so the slice cannot panic. The bad character in the last arm is already consumed, and that is what makes the lexer carry on after an error.

Numbers: a non-empty run of ASCII digits can only fail to parse by overflowing, so `PosOverflow` is the one reachable `IntErrorKind` (`.map_err(|_| LexError::NumberTooLarge { pos: start })` passes too). Accumulating the digits with `checked_mul(10)` and `checked_add(digit)` also works; leading zeros never overflow either way. Tracking the end yourself with `end = i + c.len_utf8()` for the last consumed char is fine as well.

What fails: positions from `.chars().enumerate()` (character counts, not byte offsets: the `$` in "é + $" is at byte 5); `&self.src[start..start + n]` with `n` counted in chars (the wrong slice, or a char-boundary panic); `Box::leak(name.to_string().into_boxed_str())` (the address check); `parse().unwrap()`, `parse::<u64>()` plus `as i64`, or a saturated `i64::MAX` for 9223372036854775808; giving up in the middle of an overlong literal (the rest of its digits must not come back as a second number); `c.is_numeric()` for digits (it accepts '١' and '½', which `parse` rejects); `is_ascii_alphabetic` for names ("héllo" falls apart into three items); `is_ascii_whitespace` (U+3000 IDEOGRAPHIC SPACE is whitespace too); peeking at a character without consuming it (the same item forever: the tests give up after `src.len()` items); returning `None` for good after the first error. Real lexers carry spans too: LALRPOP's custom lexers yield `(start, token, end)` triples."""

[[exercises]]
name = "parse2"
dir = "64_parsing"
hint = """
Three problems with one cause: the given rules recurse on the RIGHT. `expr := term (('+' | '-') expr)?` reads `8 - 3 - 2` as `8 - (3 - 2)` = 7, `term` reads `8 / 4 / 2` as `8 / (4 / 2)` = 4, and every operator nests one level deeper, so a flat sum of more than `MAX_DEPTH` terms is `TooDeep`. On top of that the plain operators panic, and there is no unary minus.

Read each level with a loop that folds the next operand into the running value, and put the checked arithmetic in one helper:
```
// expr := term (('+' | '-') term)*
fn expr(&mut self) -> Result<i64, EvalError> {
    let mut acc = self.term()?;
    while let Some(op @ (Token::Plus | Token::Minus)) = self.peek()? {
        self.bump()?;
        acc = apply(op, acc, self.term()?)?;
    }
    Ok(acc)
}

// term := factor (('*' | '/') factor)*
fn term(&mut self) -> Result<i64, EvalError> {
    let mut acc = self.factor()?;
    while let Some(op @ (Token::Star | Token::Slash)) = self.peek()? {
        self.bump()?;
        acc = apply(op, acc, self.factor()?)?;
    }
    Ok(acc)
}

// Outside the `impl Parser` block:
fn apply(op: Token<'_>, lhs: i64, rhs: i64) -> Result<i64, EvalError> {
    let value = match op {
        Token::Plus => lhs.checked_add(rhs),
        Token::Minus => lhs.checked_sub(rhs),
        Token::Star => lhs.checked_mul(rhs),
        Token::Slash if rhs == 0 => return Err(EvalError::DivByZero),
        Token::Slash => lhs.checked_div(rhs),
        _ => unreachable!("{op:?} is not a binary operator"),
    };
    value.ok_or(EvalError::Overflow)
}
```
`checked_div` returns `None` both for a zero divisor and for `i64::MIN / -1` (2^63 does not fit in an `i64`), so the zero test has to come first: `checked_div(..).ok_or(Overflow)` alone reports `1 / 0` as `Overflow`, and `.ok_or(DivByZero)` reports `MIN / -1` as `DivByZero`. Both of those divisions panic in every build profile with plain `/`; `+`, `-` and `*` panic only in debug builds and wrap in release (`31_debugging/debugging2`).

Unary minus is one more arm in `factor`, and it recurses through the depth guard:
```
Some((_, Token::Minus)) => self
    .nested(Self::factor)?
    .checked_neg()
    .ok_or(EvalError::Overflow),
```
It negates one factor, so it binds tighter than `*`: `-4611686018427387904 * 2` is `i64::MIN`, while `-(4611686018427387904 * 2)` overflows. A loop that counts the minus signs and then calls `checked_neg` once per sign passes too (so does `0i64.checked_sub(x)`); negating once when the count is odd does not, because `--(-9223372036854775807 - 1)` must overflow at the inner minus. Calling `self.factor()` directly, without `nested`, aborts the whole test run with "has overflowed its stack" on 100_000 minus signs, and so does calling `self.expr()` for parentheses.

What else fails: `wrapping_*` or `saturating_*` (a wrong number instead of `Overflow`); evaluating in `i128` and converting once at the end (`9223372036854775807 + 1 - 1` must be `Overflow`: every intermediate result must fit); `checked_div_euclid` (`-7 / 2` must be -3: `/` rounds toward zero, like Rust's); adding up the subtracted terms and subtracting once (it overflows in different places than left-to-right evaluation); a loop in `expr` but the old right recursion left in `term`; handling a minus only in front of the first term (`2 * -3`). Collecting a level's operands into a `Vec` and folding them afterwards is fine, and so is precedence climbing or a Pratt parser (one loop driven by a table of binding powers; see matklad's "Simple but Powerful Pratt Parsing")."""

[[exercises]]
name = "parse3"
dir = "64_parsing"
hint = """
Two empty bodies, two E0308 "mismatched types" errors: `from_str` must return `Result<Expr, ParseError>`, and `fmt` must return `fmt::Result`.

`from_str`: part 2's grammar again, but each loop folds the next operand into a TREE. The tree built so far becomes the LEFT child of the new node, and that is what makes the tree left-deep:
```
impl Parser<'_> {
    // expr := term (('+' | '-') term)*
    fn expr(&mut self) -> Result<Expr, ParseError> {
        let mut acc = self.term()?;
        loop {
            let op = match self.peek()? {
                Some(Token::Plus) => BinOp::Add,
                Some(Token::Minus) => BinOp::Sub,
                _ => return Ok(acc),
            };
            self.bump()?;
            let rhs = self.term()?;
            acc = Expr::Binary(op, Box::new(acc), Box::new(rhs));
        }
    }

    // term := factor (('*' | '/') factor)*
    fn term(&mut self) -> Result<Expr, ParseError> {
        let mut acc = self.factor()?;
        loop {
            let op = match self.peek()? {
                Some(Token::Star) => BinOp::Mul,
                Some(Token::Slash) => BinOp::Div,
                _ => return Ok(acc),
            };
            self.bump()?;
            let rhs = self.factor()?;
            acc = Expr::Binary(op, Box::new(acc), Box::new(rhs));
        }
    }

    // factor := '-' factor | NUMBER | IDENT | '(' expr ')'
    fn factor(&mut self) -> Result<Expr, ParseError> {
        match self.bump()? {
            Some((_, Token::Num(n))) => Ok(Expr::Num(n)),
            Some((_, Token::Ident(name))) => Ok(Expr::Var(name.to_owned())),
            Some((_, Token::Minus)) => Ok(Expr::Neg(Box::new(self.nested(Self::factor)?))),
            Some((_, Token::LParen)) => {
                let inner = self.nested(Self::expr)?;
                self.close_paren()?;
                Ok(inner)
            }
            Some((pos, _)) => Err(ParseError::UnexpectedToken { pos }),
            None => Err(ParseError::UnexpectedEnd),
        }
    }
}

impl FromStr for Expr {
    type Err = ParseError;

    fn from_str(s: &str) -> Result<Self, Self::Err> {
        let mut parser = Parser { tokens: Lexer::new(s).peekable(), depth: 0 };
        let expr = parser.expr()?;
        match parser.bump()? {
            None => Ok(expr),
            Some((pos, _)) => Err(ParseError::TrailingInput { pos }),
        }
    }
}
```
`acc = Expr::Binary(op, Box::new(acc), Box::new(rhs))` moves the old `acc` into the new node before the node is assigned back, which the borrow checker accepts. `name.to_owned()` is the one copy of the source text: `from_str(s: &str) -> Result<Self, _>` has no lifetime that could let `Self` borrow `s`. The parentheses arm returns `inner` itself, so `(((7)))` is just `Num(7)`.

Unary minus must go through `nested` as well, not only parentheses: in a tree every minus is a node, so a loop that stacks 100_000 `Neg` nodes builds a tree too deep to print, evaluate or even drop, and the test run aborts with "has overflowed its stack".

`fmt`: one arm per variant. `{lhs}` and `{rhs}` recurse into the children through this same impl:
```
match self {
    Expr::Num(n) => write!(f, "{n}"),
    Expr::Var(name) => f.write_str(name),
    Expr::Neg(operand) => write!(f, "(-{operand})"),
    Expr::Binary(op, lhs, rhs) => write!(f, "({lhs} {op} {rhs})"),
}
```

What fails: part 2's right recursion (`8 - 3 - 2` becomes `Binary(Sub, 8, Binary(Sub, 3, 2))`); swapping the children; `-x` as `Binary(Sub, Num(0), x)` or as a negated `Num` (the tests want a `Neg` node); folding constants while parsing (the shape tests want every operator kept); skipping the trailing-input check; printing only the parentheses that are needed, none around `Neg`, parentheses around leaves, or no spaces (`display_is_fully_parenthesized` pins the format). Printing with as few parentheses as possible is the usual follow-up: that is the `minimal` function in the tests, which wraps a child only when its precedence is lower than its parent's, or equal on the right-hand side. `eval` is given: part 2's checked arithmetic, applied to the tree. Related: `26_smart_pointers_deep/smartptr1` (Box and recursive types), `23_conversions/conversions3` (FromStr), `66_checked_math/checkedmath3` (another canonical Display with a round-trip test)."""

# MODULE 5 · Performance: Buffer Reuse, Borrowed Parameters and Returns, Bulk Slice Operations

[[exercises]]
name = "perf1"
dir = "65_performance"
strict_clippy = true
hint = """
This exercise runs Clippy with `-D warnings`. The tests catch a replaced buffer. Clippy's `format_push_string` (a `pedantic` lint that the `#![deny]` at the top turns on) catches the temporary `String` per line.

`render_into_reuses_the_callers_buffer` fails because `*out = render(rows)` allocates a new `String` while the caller's is still alive (so it has a different address), then drops the caller's buffer with all its capacity. Clear the caller's buffer and write into it. Move the layout code into `render_into`, and make `render` the thin wrapper:
```
use std::fmt::Write;

fn render(rows: &[Row]) -> String {
    let mut table = String::new();
    render_into(rows, &mut table);
    table
}

fn render_into(rows: &[Row], out: &mut String) {
    out.clear();
    let _ = writeln!(out, "{:<10}{:>7}", "item", "count");
    let mut total: u64 = 0;
    for row in rows {
        let _ = writeln!(out, "{:<10}{:>7}", row.item, row.count);
        total += u64::from(row.count);
    }
    let _ = writeln!(out, "{:<10}{:>7}", "total", total);
}
```
`clear()` keeps the capacity, so once the buffer has held the biggest frame, nothing allocates. `writeln!` on a `String` needs `std::fmt::Write` in scope. Without the `use`, rustc reports E0599 "cannot write into `String`" and suggests the import. `String::write_str` never fails, so the `fmt::Result` can only be an `Err` if a `Display` impl returns one: `let _ =`, `.unwrap()` and `.expect(..)` are all common. Use `writeln!`, not `write!` with a newline at the end of the format string; Clippy's `write_with_newline` rejects that here.

Passing the tests is not the whole job. `write!(out, "{}", format!(..))` still builds the temporary, and Clippy rejects it (`format_in_format_args`). These versions allocate on every call too, and neither the tests nor Clippy can see it:
- `out.clear(); out.push_str(&render(rows));` with a `write!`-based `render`: a whole temporary table, copied over.
- `let line = format!(..); out.push_str(&line);` and `out.push_str(format!(..).as_str())`: the same temporary, and `format_push_string` misses both.
- `row.count.to_string()` per line.

Proving zero allocations takes a counting global allocator, which needs `unsafe`: that is the planned `alloc-perf-lab` deep-dive lab.

`let mut buf = std::mem::take(out);`, fill `buf`, then `*out = buf;` is fine: the same allocation leaves and comes back. `shrink_to_fit()`, a new `String::with_capacity(..)`, or `mem::swap` with a new `String` fail the pointer or capacity checks."""

[[exercises]]
name = "perf2"
dir = "65_performance"
hint = """
E0308 first. `&String` and `&Vec<String>` accept only a borrowed `String` or `Vec<String>`, and the tests are callers that hold literals, slices of longer strings, arrays and a `Vec<&str>`. Take the most general borrowed form, and return views into the line instead of copies:
```
fn tokens(line: &str) -> Vec<&str> {
    line.split_whitespace().collect()
}

fn count_long(words: &[impl AsRef<str>], min_chars: usize) -> usize {
    words
        .iter()
        .filter(|word| word.as_ref().chars().count() >= min_chars)
        .count()
}
```
A `&String` argument still works: deref coercion turns it into a `&str` at the call (see `45_sized_deref`). With one reference parameter, elision gives the `Vec<&str>` the line's lifetime, so the words cannot outlive the line. `split_whitespace` already yields `&str`s into `line`. The `.map(|word| word.to_string())` was the copy that `tokens_borrow_from_the_line` catches.

In `count_long` the element type is what varies (`String` in one call, `&str` in another), so make it generic: `&[impl AsRef<str>]`, or spelled out, `fn count_long<S: AsRef<str>>(words: &[S], min_chars: usize)`. `&[&str]` refuses the `Vec<String>` (E0308 "expected `&[&str]`, found `&Vec<String>`"), and `&[String]` refuses the literals: a slice cannot be converted element by element without building a new one. `Borrow<str>` or `Deref<Target = str>` work as the bound too. `words: impl IntoIterator<Item = impl AsRef<str>>` also compiles and passes. Clippy then warns about the tests' `&literals` (`needless_borrows_for_generic_args`: an array can be passed by value), so a slice is the better fit here.

Wrong turns the tests catch:
- keeping `Vec<String>` (the words live somewhere else);
- leaking the strings to get `&'static str`s (still copies);
- `split(' ')` (tabs, runs of spaces) and `split_ascii_whitespace` (U+3000 and U+00A0);
- `.len()` instead of `.chars().count()` ("héllo" is 6 bytes).

One they cannot catch: `&[impl ToString]` with `word.to_string().chars().count()` compiles and passes, but allocates a `String` per word just to count it.

A `Vec<Cow<str>>` whose words are all `Cow::Borrowed` passes as well, but a `Cow` is for results that are only sometimes owned (`45_sized_deref/cow1`). The opposite case, a function that STORES the string, takes `impl Into<String>` (`47_type_level/builder1`)."""

[[exercises]]
name = "perf3"
dir = "65_performance"
strict_clippy = true
hint = """
Three contracts, three bulk operations. This exercise runs Clippy with `-D warnings`, so fix the tests first, then Clippy.

`dot`: the index loop over `0..a.len()` panics with "index out of bounds" when `b` is shorter, and silently ignores the rest of `b` when `a` is shorter. `zip` alone is no better: it stops at the shorter input. Check the contract first, then zip:
```
fn dot(a: &[f64], b: &[f64]) -> f64 {
    assert_eq!(a.len(), b.len(), "length mismatch");
    a.iter().zip(b).map(|(x, y)| x * y).sum()
}
```
`assert!(a.len() == b.len(), "length mismatch")`, or an `if` with a `panic!`, is just as good. Not `debug_assert_eq!`: it passes these tests (they run in a debug build), but release builds compile it out, and then `zip` truncates silently. An index loop behind the same assert is also correct. The assert is what lets LLVM drop that loop's bounds checks; look for `panic_bounds_check` in the assembly to be sure.

`copy_prefix`: the loop runs to `src.len()` and indexes past a shorter `dst`. `copy_from_slice` is one `memcpy`, but it panics unless both sides have the same length, so cut both to the shorter one:
```
fn copy_prefix(dst: &mut [i32], src: &[i32]) -> usize {
    let n = dst.len().min(src.len());
    dst[..n].copy_from_slice(&src[..n]);
    n
}
```
`dst.copy_from_slice(src)` and `dst[..src.len()].copy_from_slice(src)` both panic in the tests. A loop over `0..n` passes the tests, and then Clippy's `manual_memcpy` rejects it. (`clone_from_slice` is the same for `Clone` types.) `for (d, s) in dst.iter_mut().zip(src)` passes the tests and Clippy (`manual_memcpy` only looks at index loops), and here `zip` stopping at the shorter slice is exactly the spec. LLVM usually turns that loop into a `memcpy`; `copy_from_slice` guarantees one and says so.

`append_chunks`: pushing byte by byte into an empty `Vec` grows it to 8, 16, 32, ..., 2048 bytes for 1025 bytes of data. Add up the total, `reserve` it once, then copy each chunk in bulk:
```
fn append_chunks(out: &mut Vec<u8>, chunks: &[&[u8]]) {
    let total = chunks.iter().map(|chunk| chunk.len()).sum();
    out.reserve(total);
    for chunk in chunks {
        out.extend_from_slice(chunk);
    }
}
```
`reserve` does nothing when the capacity already suffices, so a buffer with room stays where it is, and a total of 0 allocates nothing. `reserve_exact(total)` works too.

Versions the tests catch:
- no `reserve`: `extend_from_slice` per chunk still grows step by step (capacity 1600), and so does `out.extend(chunks.iter().flat_map(|c| c.iter()))`, because the `size_hint` of `flat_map` cannot know the total;
- `shrink_to_fit()` afterwards, or a new `Vec` assigned to `*out`: either one moves a buffer that had room.

Versions the tests cannot catch:
- `reserve_exact(chunk.len())` inside the loop ends with the same capacity as one `reserve_exact(total)`, but it reallocates for every chunk, and each reallocation may copy everything so far. That makes it quadratic.
- `reserve(total)` followed by a byte-by-byte `push` (or an `extend` over a `flat_map`) never reallocates, but copies one byte at a time instead of one `memcpy` per chunk.
- `out.extend_from_slice(&chunks.concat())` builds a whole temporary `Vec` first: two allocations and two copies instead of one of each."""

# MODULE 5 · Checked Math: Overflow-Safe `mul_div`, Rounding Direction, Fixed Point and Determinism

[[exercises]]
name = "checkedmath1"
dir = "66_checked_math"
hint = """
`the_motivating_example_fits` fails with `left: None`, `right: Some(750000000000000000000000000)`. `5e26 * 1.5e18` is about 7.5e44, far above `u128::MAX` (about 3.4e38), so `checked_mul` returns `None` even though the quotient fits. A zero divisor panics with "attempt to divide by zero", and the textbook ceiling `(x + d - 1) / d` panics with "attempt to add with overflow" near `u128::MAX`.

Two 128-bit factors never need more than 256 bits. `carrying_mul` (stable since 1.91) returns the full product as `(low, high)`, and the given `div_wide` divides it:
```
fn mul_div_floor(a: u128, b: u128, d: u128) -> Option<u128> {
    let (lo, hi) = a.carrying_mul(b, 0);
    div_wide(hi, lo, d).map(|(quot, _)| quot)
}

fn mul_div_ceil(a: u128, b: u128, d: u128) -> Option<u128> {
    let (lo, hi) = a.carrying_mul(b, 0);
    let (quot, rem) = div_wide(hi, lo, d)?;
    if rem == 0 { Some(quot) } else { quot.checked_add(1) }
}
```
Watch the order: `carrying_mul` returns the LOW half first, and `div_wide` takes the high half first. `div_wide` already returns `None` for `d == 0` and for a quotient that needs more than 128 bits (exactly when `hi >= d`). `checked_add(1)` turns a rounded-up `u128::MAX` into `None` instead of a panic. Nothing is added before the division, so nothing can overflow there.

Shortcuts the tests reject: dividing first (`a / d * b`) throws the remainder away. The split `a / d * b + a % d * b / d` is exact only while `a % d * b` fits. `f64` has only 53 bits of mantissa, `saturating_mul` gives wrong answers, and "floor + 1" over-rounds exact quotients. `div_ceil` (which Clippy's `manual_div_ceil` suggests) fixes the `+ d - 1` overflow but not the product.

Three other correct ceilings:
- Test the remainder with `quot.wrapping_mul(d) != a.wrapping_mul(b)`. Both sides are exact modulo 2^128, and the true remainder is below `d`, so they agree only when it is 0.
- Fold the `+ d - 1` into the product: `a.carrying_mul(b, d - 1)` computes `a * b + (d - 1)` exactly, and that sum always fits in 256 bits. Check `d == 0` first, or `d - 1` underflows.
- Do the `(x + d - 1)` addition in 256 bits yourself.

`widening_mul` (no carry argument) is still unstable, and `carrying_mul` cannot be called in a `const fn` yet. For overflow behavior in debug and release builds, see `31_debugging/debugging2`."""

[[exercises]]
name = "checkedmath2"
dir = "66_checked_math"
hint = """
`minting_one_share_pays_the_full_price` fails with `left: Ok(1)`, `right: Ok(2)`. With A = 3 and S = 2 a share is worth 1.5 assets. Flooring charges only 1, and the share price falls to 4/3. `withdrawing_one_asset_burns_a_share` gets `Ok(0)`: 2/3 of a share floors to nothing, so the asset is free. `no_trade_lowers_the_share_price` reports the first trade that leaves `A' * S < A * S'`.

Round against the user: what the user RECEIVES rounds down, and what the user PAYS rounds up.
```
fn preview_deposit(&self, assets: u128) -> Result<u128, VaultError> {
    self.convert_to_shares(assets, Rounding::Down) // the user receives shares
}

fn preview_mint(&self, shares: u128) -> Result<u128, VaultError> {
    self.convert_to_assets(shares, Rounding::Up) // the user pays assets
}

fn preview_withdraw(&self, assets: u128) -> Result<u128, VaultError> {
    self.convert_to_shares(assets, Rounding::Up) // the user pays (burns) shares
}

fn preview_redeem(&self, shares: u128) -> Result<u128, VaultError> {
    self.convert_to_assets(shares, Rounding::Down) // the user receives assets
}
```
Why it works, for a deposit of x assets that mints s = floor(x * S / A) shares: A' * S = A * S + x * S >= A * S + A * s = A * S'. The other three trades work the same way.

Wrong fixes the tests catch:
- Rounding everything up breaks deposits: 1 asset at A = 3, S = 2 would buy a whole share.
- Adding 1 by hand overcharges exact trades (A = 4, S = 2).

Ethereum's ERC-4626 states the same rule in its Security Considerations, and requires its plain price quotes `convertToShares` / `convertToAssets` to round down.

The rule protects the vault, not the next depositor. `a_deposit_worth_less_than_one_share_is_refused` shows the first-depositor (inflation) attack: one share plus a direct donation makes a 1_000-asset deposit round down to 0 shares. That is why `deposit` refuses a zero-share result. Production vaults also add virtual shares and assets (OpenZeppelin's `_decimalsOffset`) or seed the vault. The `mul_div` here is part 1's solution."""

[[exercises]]
name = "checkedmath3"
dir = "66_checked_math"
hint = """
Every test panics with "not yet implemented": the four bodies are `todo!()`. Clippy's `todo` lint, set to forbid in this course, also rejects any `todo!()` you leave behind.

Multiply and divide through part 1's full-width `mul_div_floor`. Check for a zero divisor first, because `mul_div_floor` returns `None` for it, just as for an overflow:
```
fn checked_mul(self, rhs: Decimal) -> Result<Decimal, DecimalError> {
    mul_div_floor(self.0, rhs.0, SCALE).map(Decimal).ok_or(DecimalError::Overflow)
}

fn checked_div(self, rhs: Decimal) -> Result<Decimal, DecimalError> {
    if rhs == Decimal::ZERO {
        return Err(DecimalError::DivisionByZero);
    }
    mul_div_floor(self.0, SCALE, rhs.0).map(Decimal).ok_or(DecimalError::Overflow)
}
```
To parse, validate the text first. Then fold the digits with checked arithmetic, padding the fraction to 18 digits:
```
fn from_str(s: &str) -> Result<Self, Self::Err> {
    if s.is_empty() {
        return Err(DecimalError::Empty);
    }
    let (int, frac) = match s.split_once('.') {
        Some((int, frac)) => (int, Some(frac)),
        None => (s, None),
    };
    let is_number = |part: &str| !part.is_empty() && part.bytes().all(|b| b.is_ascii_digit());
    if !is_number(int) || frac.is_some_and(|frac| !is_number(frac)) {
        return Err(DecimalError::Invalid);
    }
    let frac = frac.unwrap_or("");
    if frac.len() > DECIMALS {
        return Err(DecimalError::TooManyDecimals);
    }
    fn value(mut digits: impl Iterator<Item = u8>) -> Option<u128> {
        digits.try_fold(0u128, |acc, b| acc.checked_mul(10)?.checked_add(u128::from(b - b'0')))
    }
    let int = value(int.bytes())
        .and_then(|int| int.checked_mul(SCALE))
        .ok_or(DecimalError::Overflow)?;
    let padded = frac.bytes().chain(std::iter::repeat(b'0')).take(DECIMALS);
    let frac = value(padded).expect("18 digits always fit in a u128");
    int.checked_add(frac).map(Decimal).ok_or(DecimalError::Overflow)
}
```
To print, strip the fraction's trailing zeros, and let a zero-padded width restore its leading zeros:
```
fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
    let (int, frac) = (self.0 / SCALE, self.0 % SCALE);
    if frac == 0 {
        return write!(f, "{int}");
    }
    let (mut frac, mut width) = (frac, DECIMALS);
    while frac.is_multiple_of(10) {
        frac /= 10;
        width -= 1;
    }
    write!(f, "{int}.{frac:0width$}")
}
```
Correct alternatives:
- For `Display`: `format!("{int}.{frac:018}")`, then trim the trailing `'0'`s, then a trailing `'.'`.
- For parsing: `u128::from_str` on parts you have ALREADY validated, mapping `IntErrorKind::PosOverflow` to `Overflow`.

Traps the tests catch:
- `f64` anywhere: the round trips fail, and "1e3" must be rejected.
- `u128::from_str` on unvalidated parts: it accepts "+1" and "1.+5".
- Mapping `PosOverflow` to `Invalid`.
- Checking the length instead of doing checked math: 60 leading zeros are fine.
- `char::is_numeric`: it is true for Arabic-Indic digits and for fractions like 1/2.
- A plain `a * b / SCALE`, which overflows for `Decimal::MAX * 1`, and the split `a / SCALE * b + a % SCALE * b / SCALE`, which overflows for `0.5 * 3e20`. Both refuse results that fit.

For `FromStr` itself, see `23_conversions/conversions3`."""

[[exercises]]
name = "checkedmath4"
dir = "66_checked_math"
hint = """
There are four bugs.

1. The golden-digest tests get a different number. `DefaultHasher` is not the documented FNV-1a, and its algorithm "should not be relied upon over releases". The `Hash` impls also choose the bytes for you: `str` adds a 0xff terminator, and `u128` writes native-endian bytes.
2. `the_digest_sees_every_bit_of_a_balance` finds two ledgers with the same digest, because `balance as u64` drops the top 64 bits.
3. The interest is wrong three ways:
   - `interest_is_exact_on_small_balances` gets 128 instead of 129. In `f64`, 100 * 0.29 is 28.999999999999996.
   - The 1e30 balance is off by about 1.8e10 units.
   - `interest_that_would_overflow_changes_nothing` panics with "attempt to add with overflow".
4. `export_refuses_to_truncate` gets `Ok`, with "whale" exported as 5.

First, iterate in key order. Change the type and the `use` line to `std::collections::BTreeMap`, and drop the `std::hash` import once `DefaultHasher` is gone:
```
balances: BTreeMap<String, u128>,
```
Hash exactly the documented bytes:
```
fn state_digest(&self) -> u64 {
    let mut fnv = Fnv1a::new();
    for (name, balance) in &self.balances {
        let len = u64::try_from(name.len()).expect("a name longer than u64::MAX bytes");
        fnv.write(&len.to_le_bytes());
        fnv.write(name.as_bytes());
        fnv.write(&balance.to_le_bytes());
    }
    fnv.finish()
}
```
Compute all the interest in integers first, and commit only when every new balance fits:
```
fn accrue_interest(&mut self, rate_bps: u32) -> Result<(), LedgerError> {
    let rate = u128::from(rate_bps);
    let new_balances = self
        .balances
        .values()
        .map(|&balance| balance.checked_add(mul_div_floor(balance, rate, BPS_PER_UNIT)?))
        .collect::<Option<Vec<u128>>>()
        .ok_or(LedgerError::Overflow)?;
    for (balance, new_balance) in self.balances.values_mut().zip(new_balances) {
        *balance = new_balance;
    }
    Ok(())
}
```
Export with a checked conversion, and `collect` into a `Result`, which stops at the first offender:
```
fn export(&self) -> Result<Vec<(String, u64)>, LedgerError> {
    self.balances
        .iter()
        .map(|(name, &balance)| {
            let amount = u64::try_from(balance).map_err(|_| LedgerError::TooLargeForApi {
                account: name.clone(),
            })?;
            Ok((name.clone(), amount))
        })
        .collect()
}
```
Alternatives that also pass: keeping the `HashMap` and sorting the entries before every use, or a fully checked split `balance / 10_000 * rate + balance % 10_000 * rate / 10_000`.

Wrong fixes the tests catch:
- a sorted `DefaultHasher`;
- feeding `Hash` impls into FNV through a `Hasher` wrapper;
- `balance.checked_mul(rate)`: it overflows for large balances even when the result fits;
- dividing first;
- the split with an unchecked `*`: it panics when the interest alone is above `u128::MAX`;
- updating in place with `?`: alice is paid before zed fails;
- `saturating_add`;
- `unwrap_or(u64::MAX)`;
- sorting the exported `Vec` after `collect`: the `Err` then names whichever offender the map yields first, not the first by name.

std has no `From<usize> for u64`, which is why the length goes through `try_from`. Don't write `name.len().to_le_bytes()` either. It is 8 bytes only on 64-bit targets and 4 on 32-bit ones, which is exactly the platform dependence a digest must not have, and no test on a 64-bit machine can catch it.

In production, the hash would be SHA-256 or BLAKE3 from a crate, and the encoding a canonical binary format such as Borsh or SSZ. The rules stay the same. For `as` and `TryFrom`, see `23_conversions/conversions1` and `conversions4`."""

# MODULE 5 · Code Review: Find the Bugs, Then Fix the Idioms

[[exercises]]
name = "review1"
dir = "67_code_review"
hint = """
Seven tests fail, one per bug, and each one exercises a single function. Read this hint one level at a time, and stop as soon as you know enough to go back to the code.

LEVEL 1, where to look:
- `large_transfer_does_not_crash_and_charges_the_exact_fee`: the fee line in `transfer`.
- `history_with_a_long_non_english_memo_does_not_crash`: the memo preview in `history`.
- `legacy_app_never_shows_a_wrong_balance`: the last line of `legacy_balance`.
- `statement_is_sorted_by_account_name`: `statement`, and the type it iterates over.
- `observer_can_read_balances_during_a_transfer`: the end of `transfer`, where the observers are called.
- `transfer_of_exactly_the_limit_goes_through`: the limit check in `transfer`.
- `typo_in_an_admin_command_is_an_error_not_a_crash`: the two `parse()` calls in `apply`.

LEVEL 2, what kind of bug:
- The fee: `amount * self.fee_bps` overflows `u64` once `amount` is above `u64::MAX / fee_bps` (about 6.1e17 at 30 bps). A debug build panics with "attempt to multiply with overflow". A release build wraps and charges a far too small fee (`31_debugging/debugging2`, `66_checked_math/checkedmath1`).
- The memo: `len()` counts BYTES and `[..16]` slices at byte 16, which panics with "end byte index 16 is not a char boundary; it is inside 'ü' (bytes 15..17 of string)". Short non-ASCII memos also get cut when they should not be (`63_slices_strings/window2`).
- The legacy balance: `as u32` keeps the low 32 bits and never fails, so 2^32 becomes 0 and 5 billion becomes 705_032_704 (`66_checked_math/checkedmath4`).
- The statement: a `HashMap` iterates in an arbitrary order that changes from run to run. With 12 accounts there are 12! orders, so a random order passes by luck about once in 479 million runs. `66_checked_math/checkedmath4` has the same bug in a digest.
- The observer: the `RefMut` from `borrow_mut()` is still alive while the observers run, so an observer that calls `ledger.balance(..)` (a `borrow()`) panics with "RefCell already mutably borrowed". The borrow checker cannot see this, because `RefCell` checks at run time (`31_debugging/debugging4` and `debugging6`).
- The limit: `>=` refuses the limit itself, which the spec allows.
- The console: `parse().unwrap()` panics on "12x", on "-5" and on one past `u64::MAX` (`35_error_design`).

LEVEL 3, the fixes.

The fee: widen to `u128`, where the product cannot overflow, then narrow back with a check. The fee is at most `amount`, because `fee_bps <= 10_000`:
```
let fee = u128::from(amount) * u128::from(self.fee_bps) / 10_000;
let fee = u64::try_from(fee).expect("the fee is at most `amount`");
```
Staying in `u64` is exact too: `amount / 10_000 * self.fee_bps + amount % 10_000 * self.fee_bps / 10_000`. These are not fixes: `checked_mul` (it refuses a legal transfer), `saturating_mul` or `wrapping_mul` (a wrong fee), `f64` (inexact above 2^53), and dividing first, whether by 10_000 or by 100 twice (it drops part of the remainder, so `fee_is_rounded_down` or the large-transfer test fails).

The memo: cut at the byte offset of the 17th character, if there is one:
```
let memo = match record.memo.char_indices().nth(16) {
    Some((cut, _)) => format!("{}...", &record.memo[..cut]),
    None => record.memo.clone(),
};
```
`floor_char_boundary(16)` (stable since 1.91) stops the panic, but it still counts bytes, so it shows fewer than 16 characters, and the test catches that.

The legacy balance: `try_from` fails exactly when the value does not fit:
```
u32::try_from(balance).map_err(|_| LedgerError::TooLargeForLegacy { balance })
```
`unwrap_or(u32::MAX)` or `balance.min(..)` would still show a wrong number.

The statement: make `Books::accounts` a `BTreeMap<String, Account>` (and import `std::collections::BTreeMap`). It iterates in key order and has the same `get`, `get_mut`, `insert` and `contains_key`. Collecting the entries and sorting them by NAME works too. Sorting the formatted LINES does not: "bob2: 200" sorts before "bob: 500", because the digit 2 comes before ':'.

The observer: end the borrow before calling code you don't control. Right after `books.history.push(..)`, add:
```
drop(books);
```
(or do the whole update in a block of its own). Calling the observers before the update, or making `balance` return `None` while the books are borrowed, fails the test: observers must see the new balances.

The limit: `amount > limit`. `amount >= limit + 1` means the same thing but overflows for a limit of `u64::MAX`, and the test has one.

The console: turn the parse error into the error the spec names, and return it with `?`:
```
fn parse_amount(word: &str) -> Result<u64, LedgerError> {
    word.parse()
        .map_err(|_| LedgerError::BadAmount(word.to_string()))
}
```
Then call `parse_amount(amount)?` in both arms. `unwrap_or(0)` would quietly deposit or transfer 0.

In the interview, finish by ranking the findings and saying how CI would have caught each one: a boundary test per bug, plus the opt-in clippy lints `arithmetic_side_effects`, `string_slice`, `cast_possible_truncation` and `unwrap_used`. No lint finds the limit, statement-order or `RefCell` bug. Only tests do, and for the `RefCell` bug only a test whose observer calls back into the ledger."""

