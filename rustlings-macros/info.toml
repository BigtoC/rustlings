[[exercises]]
name = "runtime2"
dir = "29_async_runtime"
hint = """
The core of an executor is a loop:
```
loop {
    match future.as_mut().poll(&mut cx) {
        Poll::Ready(value) => return value,
        Poll::Pending => thread::park(),
    }
}
```
`park` blocks until the `ThreadWaker` calls `unpark` — that is what makes waiting
