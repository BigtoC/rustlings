`Arc<Mutex<T>>`: make the counter `let counter = Arc::new(Mutex::new(0usize));`; in
each thread do `*counter.lock().unwrap() += 1;` (the guard unlocks automatically when
dropped); read the final value with `*counter.lock().unwrap()`. `Mutex` guarantees
only one thread holds `&mut T` at a time."""

