# MODULE 3 · Async Combinators: Join, Select and Cancel Safety

[[exercises]]
name = "join1"
dir = "57_async_combinators"
hint = """
The tests fail, most of them with "not Ready after 100 polls": `Join::poll` returns `Pending` without polling either child, so nothing ever finishes. A join must poll EVERY unfinished child on every poll (that is what makes it concurrent), store each output the moment it arrives, and never poll a finished child again (the test leaves panic, and so do `async` blocks and `std::future::Ready`). The stored `Option` doubles as the "done" flag:
```
if this.a_out.is_none()
    && let Poll::Ready(output) = Pin::new(&mut this.a).poll(cx)
{
    this.a_out = Some(output);
}
if this.b_out.is_none()
    && let Poll::Ready(output) = Pin::new(&mut this.b).poll(cx)
{
    this.b_out = Some(output);
}
match (this.a_out.take(), this.b_out.take()) {
    (Some(a), Some(b)) => Poll::Ready((a, b)),
    (a, b) => {
        this.a_out = a;
        this.b_out = b;
        Poll::Pending
    }
}
```
Polling `b` before `a` works too. What the tests reject: returning `Pending` as soon as `a` is `Pending` (that is `a.await; b.await` again: 3 + 1 + 5 = 9 polls instead of max(3, 5) + 1 = 6, and the producer/consumer rendezvous never finishes); polling only one child per poll; polling a child that already returned `Ready`; checking for both outputs before polling instead of after (one poll too late); looping inside `poll` until a child is ready (the join must still be `Pending` after its first poll, and the mailbox detects the spin); and polling the children with a `Context` of your own instead of the caller's `cx`, or waking the task yourself (the test counts the wakeups exactly). Real crates (`futures::join!`, `tokio::join!`) wrap each child in a `MaybeDone` enum (still running, done with its output, or gone), which also drops a child as soon as it finishes, and they pin-project to support `!Unpin` children. Compare `28_futures/futures3` (the sequential state machine) and continue with `57_async_combinators/select1`."""

[[exercises]]
name = "select1"
dir = "57_async_combinators"
hint = """
The tests fail, most of them with "not Ready after 100 polls": `Select::poll` never polls a child. Poll `a` first, poll `b` only while `a` is still `Pending`, and the moment one child is `Ready`, empty the OTHER slot. Setting an `Option` to `None` drops the future inside it, and dropping a future is how Rust cancels it: its destructors run right now, not when the `Select` itself is dropped.
```
let a = this
    .a
    .as_mut()
    .expect("`Select` polled after it returned `Ready`");
if let Poll::Ready(output) = Pin::new(a).poll(cx) {
    this.b = None; // cancel the loser now
    this.a = None;
    return Poll::Ready(Either::Left(output));
}
let b = this
    .b
    .as_mut()
    .expect("`Select` polled after it returned `Ready`");
if let Poll::Ready(output) = Pin::new(b).poll(cx) {
    this.a = None;
    this.b = None;
    return Poll::Ready(Either::Right(output));
}
Poll::Pending
```
Dropping the finished winner as well is optional; it turns a stray re-poll into a clear panic. Taking both children out and putting them back while the race is open works too. What the tests reject: keeping the loser in its slot, or dropping only the winner (the loser's `DropFlag` is still unset while the `Select` is alive, like a lock guard or a connection a canceled branch never releases); `mem::forget` (nothing is dropped, and clippy denies `mem_forget`); polling both children before deciding (`b` can complete on the same poll, and its output, a message it took out of a queue, is dropped with it: lost); polling `b` first (this `Select` is biased toward `a`, like `tokio::select!` with `biased;`, which is what keeps the tests deterministic); looping inside `poll` (the race must still be `Pending` after its first poll); and polling with a `Context` of your own. `futures::future::select` makes the other design choice and hands the unfinished future back: its output is `Either<(A::Output, B), (B::Output, A)>`. Continue with `57_async_combinators/cancel1`, where the dropped loser was still holding data."""

[[exercises]]
name = "cancel1"
dir = "57_async_combinators"
hint = """
`a_line_split_by_a_heartbeat_arrives_whole` fails with `left: Transcript { lines: ["lo", "ld"], heartbeats: 2 }`. When the `Timeout` wins a round, the round ends and its `read_line` future, pinned inside the loop body, is dropped (`select1`: dropping cancels). Its local `line` buffer, already holding "hel", goes with it, and the next round starts a NEW `read_line` that only sees "lo". `read_line` is not cancel safe: across its `.await` it keeps progress in the future's own state.

Fix 1, make it cancel safe: keep the partial line in the reader, which outlives every `read_line` future. Add a field and initialize it in `new`:
```
struct LineReader {
    source: Source,
    pending: Vec<u8>,
}
// in `new`: LineReader { source, pending: Vec::new() }
```
In `read_line`, drop the local buffer, leave the newline arm (`break`) as it is, and change the other arms and the tail:
```
Some(byte) => self.pending.push(byte),
None if self.pending.is_empty() => return None,
None => break,
```
```
let line = std::mem::take(&mut self.pending);
Some(String::from_utf8(line).expect("the peer sent invalid UTF-8"))
```
No `.await` sits between taking a byte out of the source and storing it in `self.pending`, so a canceled `read_line` loses nothing and the next call continues the same line.

Fix 2, stop canceling it: leave `read_line` alone and keep ONE future alive across heartbeats, racing a `Pin<&mut _>` to it against a fresh timer:
```
loop {
    let mut line = pin!(reader.read_line());
    let next = loop {
        match select(line.as_mut(), Timeout::after(patience)).await {
            Either::Left(next) => break next,
            Either::Right(()) => transcript.heartbeats += 1,
        }
    };
    match next {
        Some(text) => transcript.lines.push(text),
        None => return transcript,
    }
}
```
When the timeout wins, `Select` drops only the reference, and the future lives on in the outer loop's body and resumes next round. This is the `tokio::pin!(fut); loop { select! { v = &mut fut => .. } }` pattern. What the tests reject: removing the `select` or raising the patience (heartbeats are counted exactly); polling the timeout before the line (the tie in `a_line_that_completes_on_the_timeouts_last_poll_wins` becomes a heartbeat, and with patience 0 the line is never polled at all); pinning one future for the whole stream (it is polled again after it completed); clearing `pending` at the start of `read_line`, or not emptying it after a line; collecting `char`s instead of bytes (a heartbeat falls between the two bytes of 'é'); and a `static` or thread-local buffer (two readers polled in turns would mix their partial lines). tokio's `AsyncBufReadExt::read_line` has exactly this problem, while `Lines::next_line` and tokio-util's `FramedRead` keep the buffer in the reader (fix 1) and are cancel safe. The planned `backend-tokio-lab` (`select_cancel`) in `deep-dive/ROADMAP.md` repeats this with tokio's `select!` and `read_exact`."""

# MODULE 3 · Leaf Futures: External Wakeups, Timers and Cooperative Yielding

[[exercises]]
name = "oneshot1"
dir = "58_leaf_futures"
hint = """
This compiles, but `send_wakes_the_latest_waker_and_only_that_one` fails with `left: 0`, `right: 1`: after `send`, waker B was woken 0 times. With no value yet, `poll` returns `Pending` without leaving `cx.waker()` anywhere, so `send` finds no waker and wakes nobody. The `block_on` tests panic with "the receiver is still Pending, but the sender thread has finished". `poll` also never reads `sender_alive`, so a dropped sender leaves the receiver `Pending` forever instead of finishing with `Err(Canceled)`. Do all of it under the guard you already hold (rename `_cx` to `cx`):
```
let mut shared = self.shared.lock().unwrap();
if let Some(value) = shared.value.take() {
    return Poll::Ready(Ok(value));
}
if !shared.sender_alive {
    return Poll::Ready(Err(Canceled));
}
match &mut shared.waker {
    Some(stored) => stored.clone_from(cx.waker()),
    slot => *slot = Some(cx.waker().clone()),
}
Poll::Pending
```
Check the value BEFORE `sender_alive`: `send` consumes the sender, so by the time you poll it has always been dropped, and checking `sender_alive` first turns every sent value into `Canceled`. `Waker::clone_from` skips the clone when `will_wake` says the stored waker already wakes the same task. A plain `shared.waker = Some(cx.waker().clone());` is also correct, just one clone more per poll. These do NOT fix it:
- storing the waker only when none is stored yet (`if shared.waker.is_none()`): the send wakes the stale waker A, not B;
- `cx.waker().wake_by_ref()` before `Pending`: that is busy-polling, and the tests check that nothing is woken before there is a value;
- waking the old waker when you replace it: waker A must not be woken at all;
- checking the value and storing the waker under separate `lock()` calls: a send or drop that lands in between finds no waker and wakes nobody (a lost wakeup), or the receiver then sees `sender_alive == false` and reports `Canceled` for a value that was sent. `many_cross_thread_handoffs_never_lose_a_wakeup` times its deliveries to land inside `poll`, so it catches this.
Lock-free versions (tokio's oneshot, `futures::task::AtomicWaker`) invert the order: they register the waker first and then check the value again, so a send that races the registration is still seen. timer1 applies the same rules to a timer entry."""

[[exercises]]
name = "timer1"
dir = "58_leaf_futures"
hint = """
This compiles, but `a_sleeping_task_lets_other_tasks_run` fails with `left: ["a:start", "a:done", "b:ran"]`. `thread::sleep` inside `poll` blocks the only executor thread, so `b` cannot run until `a`'s sleep is over, and overlapping sleeps end in spawn order. A leaf never waits itself: it hands its waker to someone who will wake it later and returns `Pending`. Here that someone is the given timer thread (the signature needs `mut self` and `cx`):
```
fn poll(mut self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<()> {
    if let Some(entry) = &self.entry {
        let mut entry = entry.lock().unwrap();
        if entry.fired {
            return Poll::Ready(());
        }
        match &mut entry.waker {
            Some(stored) => stored.clone_from(cx.waker()),
            slot => *slot = Some(cx.waker().clone()),
        }
        return Poll::Pending;
    }
    if Instant::now() >= self.deadline {
        return Poll::Ready(());
    }
    let entry = Arc::new(Mutex::new(TimerEntry {
        fired: false,
        waker: Some(cx.waker().clone()),
    }));
    self.timer.register(self.deadline, Arc::clone(&entry));
    self.entry = Some(entry);
    Poll::Pending
}
```
The first poll registers once and returns `Pending`, which gives the thread straight back. The timer thread sets `fired` and wakes the stored waker, and the next poll sees `fired`. An early re-poll replaces the waker under the same lock that guards `fired`, so the timer cannot fire between the check and the update. Checking `Instant::now() >= self.deadline` on every poll instead of `fired` also works, because the timer wakes only after the deadline. These do NOT fix it:
- returning `Pending` once (with `wake_by_ref`) and blocking on the next poll: `shorter_sleeps_finish_first` still sees spawn order;
- `wake_by_ref` plus `Pending` until the deadline: busy-polling, caught by the poll count and the executor's poll budget;
- registering on every poll: an early re-poll adds a second entry (`registrations()` is 2);
- keeping only the first poll's waker, or waking the old one when you replace it: waker A is woken instead of B;
- registering an entry without a waker: the timer fires and wakes nobody, and the executor panics because the timer has no entry left to wake the task;
- always registering, even for `Duration::ZERO`: a passed deadline must be `Ready` on the first poll;
- one thread per sleep (`thread::spawn` plus `thread::sleep`): it works, but costs a thread per timer, and the tests require the shared timer. That is the async book's `TimerFuture`.
Real runtimes keep all deadlines in one structure (tokio uses a hierarchical timing wheel) and remove the entry when a `Sleep` is dropped. For blocking work you cannot avoid, use `tokio::task::spawn_blocking`. oneshot1 has the same waker rules, and yield1 shows the CPU-bound version of this starvation."""

[[exercises]]
name = "yield1"
dir = "58_leaf_futures"
hint = """
This compiles, but `two_yielding_tasks_interleave` fails with `left: ["a0", "a1", "a2", "b0", "b1", "b2"]`, and `yield_now_is_pending_once_then_ready` gets `Ready(())` from the first poll. `.await` suspends a task only when the awaited future returns `Pending`, and `async fn yield_now() {}` awaits nothing, so it is `Ready` at once. Write the leaf yourself (it is `YieldOnce` from futures2). It must wake its own task before returning `Pending`, because no channel or timer holds its waker:
```
use std::pin::Pin;
use std::task::{Context, Poll};

struct YieldNow {
    yielded: bool,
}

impl Future for YieldNow {
    type Output = ();

    fn poll(mut self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<()> {
        if self.yielded {
            return Poll::Ready(());
        }
        self.yielded = true;
        cx.waker().wake_by_ref();
        Poll::Pending
    }
}

fn yield_now() -> YieldNow {
    YieldNow { yielded: false }
}
```
Then `a_cpu_loop_that_yields_lets_a_heartbeat_tick` still fails with "ticked 0 time(s) while the checksum ran", because `checksum` never calls it. Yield before each new batch of `every` items (and delete `let _ = every;`):
```
for (i, x) in data.into_iter().enumerate() {
    if i > 0 && i % every == 0 {
        yield_now().await;
    }
    sum = sum.wrapping_add(x);
    progress.store(i + 1, Ordering::Relaxed);
}
```
Yielding after each batch (`(i + 1) % every == 0`), a countdown budget, or `chunks(every)` works just as well. `std::future::poll_fn` with a captured `bool` is another way to write the leaf (it is how tokio writes its own). These do NOT fix it:
- `std::thread::yield_now()`: it yields the OS thread, and all the tasks share that thread;
- `Pending` without a wake: the task is never polled again, and the test executor panics with "stuck";
- `wake_by_ref` plus `Pending` on every poll: the task never finishes, and the poll budget panics;
- `Pending` twice per yield, or two wakes per yield: the first test expects `Ready` on the second poll and exactly one wake;
- yielding on every item, or every `every / 2` items: it works but wastes round trips through the executor, and the heartbeat test rejects it; every `2 * every` items is too rare.
In tokio, use `tokio::task::yield_now`, which defers its wake-up until the runtime has polled its I/O and timer driver, or move heavy work to `spawn_blocking` or rayon. timer1 is the blocking (`thread::sleep`) version of this starvation."""

# MODULE 4 · SEND / SYNC — the basis of fearless concurrency

[[exercises]]
name = "send_sync1"
dir = "30_send_sync"
hint = """
`Rc<T>`'s reference count is a plain (non-atomic) integer, so mutating it from
multiple threads would be a data race — which is why `Rc` is `!Send` and can't be
moved into another thread. `thread::spawn` requires everything its closure captures
to be `Send`, so the compiler reports `Rc<i32>` cannot be sent between threads
safely. Fix: change the top `use std::rc::Rc;` to `use std::sync::Arc;` and replace
every `Rc` in the body with `Arc` (`Arc::new`, `Arc::clone`). `Arc` is atomically
reference-counted and is `Send + Sync`."""

[[exercises]]
