[[exercises]]
name = "linkedlist2"
dir = "27_data_structures"
hint = """
The empty body is E0308 "mismatched types": the signature promises an
`Option<Box<ListNode>>`, and a body without a tail expression evaluates to `()`.
Returning `head` (rustc's suggestion) compiles, but nothing is reversed: only the
empty and single-node tests pass.

Reverse by MOVING nodes. `prev` holds the part already reversed, `cur` the rest
of the input. Each round detaches the current node's tail into `cur`, points the
node at `prev`, and makes it the new `prev`:
```
let mut prev = None;
let mut cur = head;
while let Some(mut node) = cur {
    cur = node.next.take();
    node.next = prev;
    prev = Some(node);
}
prev
```
The two middle lines can be one: `cur = std::mem::replace(&mut node.next, prev);`.
Because you own `node`, plain moves work too (`cur = node.next;` and then
`node.next = prev;`): you may move a field out of a `Box` you own and assign it
again. `take` is required only when all you have is a `&mut`, as in
`linkedlist1`'s `pop`.

Why the shortcuts fail the tests: collecting the values into a `Vec` and building
a new list creates new nodes with new serial numbers (they may even reuse the
freed addresses, which is why the tests do not rely on addresses alone). Swapping
the VALUES along the list leaves the nodes in their old order. A recursive
reverse relinks correctly but needs one stack frame per node, so the 200_000-node
test overflows the test thread's stack. If the run aborts with "has overflowed
its stack" instead of reporting FAILED, look for recursion, or for a long input
list being dropped inside `reverse` (its drop glue is recursive, as `linkedlist1`
explains). Interview answer: O(n) time, O(1) extra space, each node visited once."""

[[exercises]]
name = "linkedlist3"
dir = "27_data_structures"
hint = """
The empty body is E0308 "mismatched types" (expected `Option<Box<ListNode>>`,
found `()`). Returning `a` or `b`, as rustc notes you could, compiles but merges
nothing.

Keep a cursor at the END of the result: `tail` is a `&mut` to the empty link where
the next node goes. `Option::insert` stores a node there and returns `&mut` to it,
so borrowing that node's `next` moves the cursor onto the new empty link:
```
fn merge(mut a: Option<Box<ListNode>>, mut b: Option<Box<ListNode>>) -> Option<Box<ListNode>> {
    let mut head = None;
    let mut tail = &mut head;
    while let (Some(x), Some(y)) = (&a, &b) {
        // `<=` takes from `a` on ties: a stable merge.
        let source = if x.val <= y.val { &mut a } else { &mut b };
        if let Some(mut node) = source.take() {
            *source = node.next.take();
            tail = &mut tail.insert(node).next;
        }
    }
    // One input is empty and the other is already sorted.
    *tail = a.or(b);
    head
}
```
`tail = &mut tail.insert(node).next` compiles because the new cursor is a
reborrow THROUGH the old one, and the old one is overwritten in the same
statement: there is never a second, independent `&mut` into the result. After
the last use of `tail`, `head` is free to return. Adding `mut` to the parameters
changes only the bindings, not the function's type.

Alternatives the tests accept: `match (a, b)` by value, putting the unused node
back into its variable in each arm; or a dummy head (`let mut dummy =
Box::new(ListNode::new(0));` with `tail: &mut Box<ListNode>` and `dummy.next` at
the end), which costs one extra node that is not part of the result. What fails:
`<` instead of `<=` takes `b` first on ties (the stability tests); a recursive
merge overflows the stack on the 200_000-node test; sorting the values and
building new nodes fails the serial checks. If the run aborts with "has
overflowed its stack" instead of reporting FAILED, look for recursion, or for an
input list being dropped inside `merge`: returning just `a` drops all 100_000
nodes of `b`, and that drop glue is recursive (see `linkedlist1`)."""

[[exercises]]
name = "linkedlist4"
dir = "27_data_structures"
hint = """
split_half fails with E0502 "cannot borrow `head` as mutable because it is also
borrowed as immutable". `fast` (a `&`) and `slow` (a `&mut`) point into the same
chain in every round, and a `&mut` to a link is exclusive access to every node
after it. Deriving `fast` from `slow` (`slow.as_deref()`) only moves the E0502.
Separate the passes: count with a shared cursor, and only THEN create the single
`&mut` cursor:
```
fn split_half(mut head: Option<Box<ListNode>>) -> (Option<Box<ListNode>>, Option<Box<ListNode>>) {
    let front_len = len(&head).div_ceil(2);
    let mut cut = &mut head;
    for _ in 0..front_len {
        if let Some(node) = cut {
            cut = &mut node.next;
        }
    }
    let back = cut.take();
    (head, back)
}

fn len(list: &Option<Box<ListNode>>) -> usize {
    let mut count = 0;
    let mut cur = list.as_deref();
    while let Some(node) = cur {
        count += 1;
        cur = node.next.as_deref();
    }
    count
}
```
Two traps. Writing `for _ in 0..len(&head).div_ceil(2)` AFTER `let mut cut = &mut
head;` is E0502 again: the count has to come first. And walking with `while let
Some(node) = cut { if steps == 0 { break; } steps -= 1; cut = &mut node.next; }`
fails with E0499 at `cut.take()`: the borrow the pattern takes can flow into
`cut`, so NLL still counts it as live on the `break` path. It is the same family
of false positive as `37_borrowck_errors/borrowck3`. A counted `for` loop with an
`if let` inside avoids it. Running fast/slow with two SHARED cursors just to count
the steps, then walking the `&mut` cursor, also works.

remove_nth_from_end: E0308 from the empty body. Count, use `checked_sub` (in a
debug build `len - n` panics with "attempt to subtract with overflow" when
`n > len`), walk to the link that owns the node, and replace that link with the
node's `next`:
```
fn remove_nth_from_end(mut head: Option<Box<ListNode>>, n: usize) -> Option<Box<ListNode>> {
    let Some(index) = len(&head).checked_sub(n) else {
        return head;
    };
    let mut link = &mut head;
    for _ in 0..index {
        if let Some(node) = link {
            link = &mut node.next;
        }
    }
    if let Some(removed) = link.take() {
        *link = removed.next;
    }
    head
}
```
For `n == 0` the index is `len`, the empty link at the end, so `take` finds
nothing and the list is unchanged; an unconditional `link.take().unwrap()`
panics there. The textbook two-pointer version (a lead `&` cursor `n` nodes ahead
of a trailing `&mut` one) is E0502 for the same reason as `split_half`, and a
recursive version overflows the stack on the 200_000-node test. If the run aborts
with "has overflowed its stack" instead of reporting FAILED, look for recursion,
or for a long list being dropped inside your function (its drop glue is
recursive, see `linkedlist1`)."""

# MODULE 2 · Arenas: Indices Instead of Pointers

[[exercises]]
name = "arena1"
dir = "59_arena"
hint = """
All three bodies are empty, so each one fails with E0308 "mismatched types" (expected `NodeId` or `Vec<NodeId>`, found `()`). rustc suggests returning `parent` (or `a` / `b`). That compiles, but adds nothing (or only answers the ancestor case).

add_child: the new node's id is the position it is about to take, `self.nodes.len()`. Index the parent FIRST, so an unknown parent panics while the tree is still untouched:
```
fn add_child(&mut self, parent: NodeId, value: T) -> NodeId {
    let id = NodeId(self.nodes.len());
    self.nodes[parent.0].children.push(id);
    self.nodes.push(NodeData {
        value,
        parent: Some(parent),
        children: Vec::new(),
    });
    id
}
```
Pushing the node first and linking the parent second fails `an_unknown_parent_panics_and_changes_nothing`. `add_child(NodeId(2), ..)` on a two-node tree then makes node 2 its own parent (a cycle that would send `path_to_root` into an endless loop), and `NodeId(99)` panics only after the orphan node is already in the `Vec`.

path_to_root: follow the parent links in a loop. `std::iter::successors` yields `id`, then keeps applying `parent` until it returns `None`:
```
fn path_to_root(&self, id: NodeId) -> Vec<NodeId> {
    std::iter::successors(Some(id), |&node| self.parent(node)).collect()
}
```
A `while let Some(parent) = self.parent(cur)` loop that pushes onto a `Vec` works too. A recursive version aborts the whole test run with "has overflowed its stack" on the 200_000-deep chain.

lca: both paths end at the root. Read from that end, they agree on every common ancestor and split right below the lowest one:
```
fn lca(&self, a: NodeId, b: NodeId) -> NodeId {
    let path_a = self.path_to_root(a);
    let path_b = self.path_to_root(b);
    path_a
        .iter()
        .rev()
        .zip(path_b.iter().rev())
        .take_while(|(x, y)| x == y)
        .last()
        .map(|(&common, _)| common)
        .expect("both paths end at the root")
}
```
That is O(depth) time and space. The O(1)-extra-space answer interviewers like: count both depths (the number of parent hops), move the deeper node up until the depths match, then move both up in lockstep until they meet. Moving both up in lockstep WITHOUT equalizing the depths first fails the uneven-depth tests. A `HashSet` of `a`'s ancestors, then climbing from `b` until you hit one, is also O(depth). Calling `path_a.contains(..)` for every ancestor of `b` is O(depth^2). Rewriting the nodes as `Rc<RefCell<..>>` stops `a_tree_of_strings_can_move_to_another_thread` from compiling: E0277 "`Rc<..>` cannot be sent between threads safely". Related: `26_smart_pointers_deep/smartptr2` (the `Rc` / `Weak` version) and `37_borrowck_errors/borrowck1` (two `&mut` into one `Vec`)."""

[[exercises]]
name = "arena2"
dir = "59_arena"
hint = """
All three bodies are empty, so each one fails with E0308 "mismatched types" (expected `Option<&T>`, `Option<&mut T>` or `Option<T>`, found `()`).

get and get_mut: `slots.get(..)?` turns an out-of-range index into `None`, and a match guard compares the generation:
```
fn get(&self, id: Id) -> Option<&T> {
    match self.slots.get(id.index)? {
        Slot::Occupied { generation, value } if *generation == id.generation => Some(value),
        _ => None,
    }
}
```
`get_mut` is the same with `self.slots.get_mut(id.index)?`. Indexing with `self.slots[id.index]` panics on an out-of-range id, and ignoring the generation fails `a_stale_id_does_not_reach_the_slots_next_value`.

remove: validate first, then swap the WHOLE slot for a vacant one with `mem::replace` and take the value out of the old slot, which you now own. Moving it out in place (`let Slot::Occupied { value, .. } = self.slots[id.index]`) is E0507 "cannot move out of index of `Vec<Slot<T>>`" (see `24_ownership_model/ownership4` and `ownership5`). rustc's suggestions do not help here. Borrowing (`ref value`, `&self.slots[..]`) gives a `&T`, not the `T` you must return, and cloning would need `T: Clone`, which the tests' `Token` values are not. Add `use std::mem;` and:
```
fn remove(&mut self, id: Id) -> Option<T> {
    self.get(id)?;
    let next = id.generation.checked_add(1);
    let vacant = Slot::Vacant {
        generation: next.unwrap_or(id.generation),
    };
    let Slot::Occupied { value, .. } = mem::replace(&mut self.slots[id.index], vacant) else {
        unreachable!("`get` just found this slot occupied");
    };
    if next.is_some() {
        self.free.push(id.index);
    }
    self.len -= 1;
    Some(value)
}
```
`self.get(id)?;` returns early for every id that `get` rejects, before anything changes. A `remove` that pushes the index onto `free` without that check frees a slot twice, and the given `insert` then panics with "is on the free list but occupied". `checked_add` is `None` only at `u32::MAX`: that slot is retired (vacant, never on `free` again). Plain `generation + 1` panics with "attempt to add with overflow" in `a_slot_out_of_generations_is_retired`. `wrapping_add` would hand slot 0 out again with generation 0 (reviving its oldest ids), and `saturating_add` would revive the removed id itself. Not bumping the generation at all lets the stale id reach the next value. `Vec::remove` and `swap_remove` shift or move other values and break their ids. A let chain works as well: `if let Some(slot) = self.slots.get_mut(id.index) && let Slot::Occupied { generation, .. } = *slot && generation == id.generation { .. } else { None }`. Related: `36_atomics/atomics5` fixes the same ABA problem with a version tag."""

# MODULE 2 · LRU Cache: From a Tick Map to an O(1) Index-Linked List

[[exercises]]
name = "lru1"
dir = "60_lru_cache"
hint = """
Both bodies are empty, so each one is E0308 "mismatched types": the signature promises an `Option`, but a body with no tail expression evaluates to `()`.

`get`: one `get_mut` finds the value AND the key's last tick. Swap in a new tick with `mem::replace`, then move the key from the old tick to the new one in `order`. `BTreeMap::remove` hands back the key it stored, so nothing is cloned:
```
fn get(&mut self, key: &K) -> Option<&V> {
    let tick = self.tick();
    let (value, last_use) = self.map.get_mut(key)?;
    let old_tick = std::mem::replace(last_use, tick);
    let stored_key = self.order.remove(&old_tick).expect("every key has a tick");
    self.order.insert(tick, stored_key);
    Some(value)
}
```
Take the tick FIRST. Calling `self.tick()` while `value` is alive is E0499 "cannot borrow `*self` as mutable more than once at a time": a `&mut self` method borrows the whole struct, `map` included (`37_borrowck_errors/borrowck1`). The field accesses `self.map` and `self.order` are disjoint, so those two borrows may overlap. `Some(value)` coerces the `&mut V` to the `&V` in the signature.

`put`: handle an update BEFORE looking at the capacity, so that an update never evicts. For a new key in a full cache, `pop_first` removes the smallest tick together with its key, and removing that key from `map` hands the value back by move:
```
fn put(&mut self, key: K, value: V) -> Option<(K, V)> {
    let tick = self.tick();
    if let Some((stored, last_use)) = self.map.get_mut(&key) {
        *stored = value;
        let old_tick = std::mem::replace(last_use, tick);
        let stored_key = self.order.remove(&old_tick).expect("every key has a tick");
        self.order.insert(tick, stored_key);
        return None;
    }
    let evicted = if self.map.len() == self.capacity {
        let (_, lru_key) = self.order.pop_first().expect("a full cache is not empty");
        let (lru_value, _) = self.map.remove(&lru_key).expect("the maps agree");
        Some((lru_key, lru_value))
    } else {
        None
    };
    self.order.insert(tick, key.clone());
    self.map.insert(key, (value, tick));
    evicted
}
```
No borrow from the `get_mut` survives the `return None`, so the code after the `if let` may use `map` again (compare `37_borrowck_errors/borrowck3`, where the borrow IS returned). The update branch repeats `get`'s bookkeeping; a private `touch` helper could hold it.

What the tests catch: a new tick inserted without removing the old one (stale ticks, so `order` outgrows `map` and a hot key is evicted), evicting before checking for an update, `pop_last` (it evicts the MOST recently used key), and dropping the old tick with `order.retain(..)` or finding it with a `find` over `order` (O(n): `hits_updates_and_evictions_are_hash_lookups_not_scans` counts key comparisons). Finding the oldest entry by scanning `map` for the smallest tick still passes the tests, but it is O(n) and throws away the reason `order` exists. Part 2 makes every operation O(1)."""

[[exercises]]
name = "lru2"
dir = "60_lru_cache"
hint = """
First E0308 twice: `get` and `put` have empty bodies. Once they compile, the tests fail until `unlink` and `push_front` do their job, because everything goes through them.

The helpers. Copy entry `i`'s two links out before you write to its neighbors. They are `Copy` indices, so no borrow of `nodes` stays alive. (Holding `let node = &mut self.nodes[i];` across a write such as `self.nodes[p].next = ..` and using `node` afterward is E0499 "cannot borrow `self.nodes` as mutable more than once at a time": the checker treats every `self.nodes[_]` as the same place.)
```
fn unlink(&mut self, i: usize) {
    let (prev, next) = (self.nodes[i].prev, self.nodes[i].next);
    match prev {
        Some(p) => self.nodes[p].next = next,
        None => self.head = next,
    }
    match next {
        Some(n) => self.nodes[n].prev = prev,
        None => self.tail = prev,
    }
    self.nodes[i].prev = None;
    self.nodes[i].next = None;
}

fn push_front(&mut self, i: usize) {
    self.nodes[i].prev = None;
    self.nodes[i].next = self.head;
    match self.head {
        Some(h) => self.nodes[h].prev = Some(i),
        None => self.tail = Some(i),
    }
    self.head = Some(i);
}
```
`get` is a lookup that yields a `usize` (which borrows nothing), then unlink, push to the front and index:
```
fn get(&mut self, key: &K) -> Option<&V> {
    let &i = self.map.get(key)?;
    self.unlink(i);
    self.push_front(i);
    Some(&self.nodes[i].value)
}
```
`put`: an update changes the value in place and relinks. A new key takes the next slot, or in a full cache the tail's slot. `mem::replace` swaps the new entry in and returns the old one by value (reading `self.nodes[t]` by value is E0507 "cannot move out of index of `Vec<Entry<K, V>>`", the rule of `24_ownership_model/ownership4`):
```
fn put(&mut self, key: K, value: V) -> Option<(K, V)> {
    if let Some(&i) = self.map.get(&key) {
        self.nodes[i].value = value;
        self.unlink(i);
        self.push_front(i);
        return None;
    }
    let entry = Entry { key: key.clone(), value, prev: None, next: None };
    if self.nodes.len() < self.capacity {
        let i = self.nodes.len();
        self.nodes.push(entry);
        self.map.insert(key, i);
        self.push_front(i);
        return None;
    }
    let t = self.tail.expect("a full cache has a tail");
    self.unlink(t);
    let old = std::mem::replace(&mut self.nodes[t], entry);
    self.map.remove(&old.key);
    self.map.insert(key, t);
    self.push_front(t);
    Some((old.key, old.value))
}
```
This is why an entry stores its key: without it, an eviction could not find the map entry to remove. Wrong turns the tests catch: pushing a new entry on every eviction (`nodes` grows past 3), `Vec::remove` or `swap_remove` on the tail (other entries move, and the new key does not land in the evicted slot), evicting `head` instead of `tail`, forgetting the old head's `prev` in `push_front` or the `tail` update in `unlink` (the forward and backward walks disagree), leaving the evicted key in `map` (it would then find the new key's value), and finding a key by scanning `nodes` instead of asking `map` (`hits_updates_and_evictions_are_hash_lookups_not_scans` counts key comparisons). Compare `59_arena/arena2`: here no free list or generations are needed, because a slot is only freed to be reused at once and no index leaves the cache."""

[[exercises]]
name = "lru3"
dir = "60_lru_cache"
hint = """
E0308 "expected `&String`, found `&str`": `get` takes `&K`, so only a `&String` fits. Give it the signature of `HashMap::get` (`45_sized_deref/borrow1`), and the body can stay as it is, because `HashMap::get` accepts the same `&Q`:
```
use std::borrow::Borrow;

fn get<Q>(&mut self, key: &Q) -> Option<&V>
where
    K: Borrow<Q>,
    Q: Hash + Eq + ?Sized,
{
    let &i = self.map.get(key)?;
    self.unlink(i);
    self.push_front(i);
    Some(&self.nodes[i].value)
}
```
Without `?Sized` the `str` and `[u8]` calls fail with E0277 "the size for values of type `str` cannot be known at compilation time": a type parameter is `Sized` unless it opts out. `get(&owned)` keeps working through the blanket `impl<T: ?Sized> Borrow<T> for T`, and so do the `u32` keys.

E0599 "no method named `peek`": add it with the same bounds and `&self`, because it only reads. It looks the key up and indexes `nodes`, and it never touches the links:
```
fn peek<Q>(&self, key: &Q) -> Option<&V>
where
    K: Borrow<Q>,
    Q: Hash + Eq + ?Sized,
{
    let &i = self.map.get(key)?;
    Some(&self.nodes[i].value)
}
```
Wrong turns the tests reject at compile time: `key: &str` (then `Vec<u8>` and `u32` keys cannot be looked up), `Q: ToOwned<Owned = K>` with `key.to_owned()` (it allocates, and a `str` becomes a `String`, not an `Arc<str>`: E0271), `K: From<&Q>` (there is no `From<&u32>` for `u32`), `K: AsRef<Q>` with a scan (O(n), and neither `u32` nor `String` is `AsRef` of itself: E0277), and a `peek(&mut self)`, or one that calls `get` (E0596 through the `&LruCache` and the `RwLock` read guard). At run time, a `peek` that scans `nodes` or walks the list fails `get_and_peek_are_one_hash_lookup_not_a_scan`. Because `get` needs `&mut self`, a cache behind a `RwLock` takes the write lock for every lookup that counts as a use; the README covers what production caches do about that."""

