name = "review2"
dir = "67_code_review"
strict_clippy = true
hint = """
The tests already pass; only clippy fails. Every error names its line and comes with a `help:` that points to the idiomatic form. For each change, know what it buys (see the comments at the top of the file), and run the tests again: they pin the behavior.

`ptr_arg` (twice): take a slice and a `&str`. The tests still pass a `&Vec<Player>` and a `&String`, and deref coercion turns them into `&[Player]` and `&str`. Keep the `'a`: with two reference parameters, elision cannot tell which one the result borrows from (E0106 "missing lifetime specifier").
```
fn find_player<'a>(players: &'a [Player], name: &str) -> Option<&'a Player> {
```
Leave the body alone. The comparison is ASCII-only on purpose: `to_lowercase()` on both sides would match "ZOË" to "Zoë", allocate two `String`s per player, and fail the test.

`len_zero` and `needless_range_loop` in `top_player`: `split_first` does the empty check and hands you the first element and the rest, with no index left to get wrong:
```
let (first, rest) = players.split_first()?;
let mut best = first;
for player in rest {
    if player.rating > best.rating {
        best = player;
    }
}
Some(best)
```
Keep `>`: a later player must be strictly better to take over. Do NOT write `players.iter().max_by_key(|p| p.rating)`: when several elements are equally maximum it returns the LAST one (its docs say so), and `a_tie_goes_to_the_player_listed_first` fails. Correct one-liners: `players.iter().reduce(|best, p| if p.rating > best.rating { p } else { best })`, or `players.iter().min_by_key(|p| std::cmp::Reverse(p.rating))` (`min_by_key` returns the FIRST minimum).

`needless_return` in `average_score`: end the function with the expression itself:
```
Some(total as f64 / player.scores.len() as f64)
```
If you also turn the loop into a sum, sum `u64`s: `player.scores.iter().map(|&s| u64::from(s)).sum::<u64>()`. A `.sum::<u32>()` overflows on `average_score_of_huge_scores_does_not_overflow`.

`manual_map` in `lobby_tag`:
```
player.nickname.as_deref().map(str::to_uppercase)
```
(`to_ascii_uppercase` would turn "zoë" into "ZOë", and the test checks that.)

`unnecessary_unwrap` in `display_name`: check and extract in one step, still borrowing from `player`:
```
player.nickname.as_deref().unwrap_or(&player.name)
```

`manual_clamp` in `shown_rating`:
```
player.rating.clamp(MIN_RATING, MAX_RATING)
```
`clamp` panics if `min > max`, which is why clippy only suggests it when both bounds are constants in the right order. `max(MIN_RATING).min(MAX_RATING)` is the same pattern, and clippy flags it too.

Adding `#[allow(clippy::...)]` would make clippy quiet, but in a review it answers nothing."""

# MODULE 5 · Mock Interviews: Timed, Statement-First Problems With Part-2 Follow-Ups

[[exercises]]
name = "set_trie"
dir = "68_mock_interviews"
hint = """
This hint is the interviewer's rubric, then a sketch of a reference answer. Grade yourself against the rubric before you read the sketch.

RUBRIC
- Clarifying questions, before any code: is a word any UTF-8 or only lowercase ASCII? Is "" a word? What does `starts_with("")` mean on an empty trie? Which order for the suggestions, and what if `limit` is 0 or huge?
- Design: one node per prefix with an `is_word` flag, and a stated choice of children map with its cost. `[Option<Box<Node>>; 26]` gives O(1) steps but 26 pointers per node, and it only knows 'a'..='z': it panics on "über", "Zoe" and "new york" (`words_are_any_utf8_not_only_lowercase_ascii`, the follow-up that fails most first attempts). `BTreeMap<char, Node>` takes any char, costs O(log k) per step and iterates in order. `HashMap<char, Node>` is O(1) expected per step, but then `suggest` must sort each node's children. A sorted `Vec<(char, Node)>` with binary search is compact and ordered. A byte-keyed trie (256 children, walking `as_bytes()`) is also correct, because every `&str` prefix ends on a char boundary; it rebuilds the words with `String::from_utf8`.
- Complexity, stated unprompted: `insert`, `contains` and `starts_with` take O(L) steps for L chars, whatever the number of words; `suggest` takes O(L + the length of the words it returns) if the walk stops at the limit; memory is one node per distinct prefix, at most the total number of chars.
- Edge cases (the tests below the banner): a prefix past the end of a word; a word that is its own prefix; `limit` 0; `limit` `usize::MAX` (`Vec::with_capacity(limit)` panics with "capacity overflow"); `starts_with("")` is false on an empty trie, because the root is the only node that can have no word below it; "" as a word, which sorts first.
- Rust: `node = node.children.entry(c).or_default();` walks and creates in one step with a `&mut` cursor; `node = node.children.get(&c)?;` walks a lookup; `!mem::replace(&mut node.is_word, true)` answers "was it new?"; one reused `String` buffer carries the path during the walk (push, recurse, pop).
- Follow-up questions to expect: why does `suggest` return `Vec<String>`, not `Vec<&str>`? (A trie stores no word as one contiguous string. Storing the whole word at its terminal node would allow `&str`, at the cost of memory.) How do you delete a word? (Clear the flag, then prune the nodes left with no word below, or `starts_with` starts lying.) How would you rank suggestions by popularity? (A count per word, and a top-k heap, or a cached best-k list per node.) Why is a `BTreeSet<String>` with `range(prefix..)` a fine answer to "autocomplete" but not to "implement a trie"? (O(L log n) per query, and no shared prefixes.) What happens with 100_000-char keys? (A recursive walk and the compiler's drop glue both recurse once per char, and dropping such a trie overflows a test thread's stack. Walk with an explicit stack and write an iterative `Drop`, as in `27_data_structures/linkedlist1`.)
- The tests cannot see how the answer is built: a `suggest` that collects the whole subtree and then truncates it passes them, and so does a "trie" that is really a `BTreeSet<String>` (O(L log n) per query) or a scanned `Vec<String>` (O(n)). The interviewer fails all three.

REFERENCE SKETCH
```
#[derive(Default)]
struct Node {
    children: BTreeMap<char, Node>,
    is_word: bool,
}

fn insert(&mut self, word: &str) -> bool {
    let mut node = &mut self.root;
    for c in word.chars() {
        node = node.children.entry(c).or_default();
    }
    !std::mem::replace(&mut node.is_word, true)
}
```
A `find(prefix) -> Option<&Node>` walks with `node = node.children.get(&c)?;`. Then `contains` is `find(word).is_some_and(|n| n.is_word)`, and `starts_with` is `find(prefix).is_some_and(|n| n.is_word || !n.children.is_empty())`. `suggest` walks down to the prefix's node, then depth first in key order (a node's own word before its children's words), pushes a clone of the path buffer for every word, and returns as soon as it holds `limit` words."""

[[exercises]]
name = "set_edit_distance"
dir = "68_mock_interviews"
hint = """
This hint is the interviewer's rubric, then a sketch of a reference answer. Grade yourself against the rubric before you read the sketch.

RUBRIC
- Clarifying questions: bytes, `char`s or user-visible letters? Is swapping two neighbors one edit or two? Do all edits cost 1? How long can the strings be?
- Derivation: say what a cell means before you write the recurrence. With n chars in `a` and m chars in `b`, `d[i][j]` is the distance between the first `i` chars of `a` and the first `j` chars of `b`. The last edit either keeps or substitutes a char (`d[i - 1][j - 1]` plus 0 or 1), deletes one (`d[i - 1][j] + 1`) or inserts one (`d[i][j - 1] + 1`). Row 0 is `0..=m` and column 0 is `0..=n`: turning a prefix into "" (or "" into a prefix) takes one edit per char. Getting row 0 and column 0 wrong is the most common bug (`empty_strings`).
- Complexity: O(n * m) time. The full table is O(n * m) memory, but row `i` only reads row `i - 1`, so two rows are enough, and a row as long as the SHORTER string makes it O(min(n, m)). (One row plus a saved diagonal cell works too.) Counting the chars first costs O(n + m).
- The Rust part: `str` has no O(1) "n-th char" (UTF-8 is variable width), so collect the shorter string into a `Vec<char>` once and stream the other one with `chars()`. `as_bytes()` is the wrong alphabet: "café" and "cafe" come out 2 apart instead of 1. And a `char` is not a letter on screen either: a precomposed "café" (ending in U+00E9) and a decomposed one (e plus U+0301) are 2 apart. Making the two equal takes Unicode normalization (the `unicode-normalization` crate), and counting "e" plus its accent as one letter takes grapheme segmentation (`unicode-segmentation`); std has neither.
- Testing: both empty strings, symmetry, a pair you can check by hand, and random inputs against the full table.
- Follow-up questions to expect: "is the distance at most k?" (only a band of width 2k + 1 around the diagonal matters: O(k * min(n, m)), and you can stop as soon as a whole row exceeds k); how to recover the edits themselves (keep the full table and walk back, or Hirschberg's algorithm for linear memory); Damerau-Levenshtein, where swapping neighbors costs 1 (`swapping_two_neighbors_costs_two` pins plain Levenshtein); different costs per edit; top-down recursion with memoization (the same O(n * m) time, but O(n * m) memory and recursion as deep as n + m).
- Weak answers: recursion without memoization (exponential: the 3_000-char test never finishes), and the full table after the interviewer asked about memory. The tests cannot see memory use; the interviewer asks.

REFERENCE SKETCH
```
let (long, short) = if a.chars().count() >= b.chars().count() { (a, b) } else { (b, a) };
let short: Vec<char> = short.chars().collect();
let mut prev: Vec<usize> = (0..=short.len()).collect();
let mut curr = vec![0; short.len() + 1];
for (i, lc) in long.chars().enumerate() {
    curr[0] = i + 1;
    for (j, &sc) in short.iter().enumerate() {
        let substitute = prev[j] + usize::from(lc != sc);
        curr[j + 1] = substitute.min(prev[j + 1] + 1).min(curr[j] + 1);
    }
    std::mem::swap(&mut prev, &mut curr);
}
prev[short.len()]
```"""

[[exercises]]
name = "set_kv_tx"
dir = "68_mock_interviews"
hint = """
This hint is the interviewer's rubric, then a sketch of a reference answer. Grade yourself against the rubric before you read the sketch.

RUBRIC
- Clarifying questions: does COMMIT close only the innermost transaction, or all of them? (Here only the innermost one, like SQL's RELEASE SAVEPOINT. The classic "Simple Database" version of this problem commits them all, so ask.) Does a transaction read its own writes? (Yes.) What does DELETE of a missing key do? What do COMMIT and ROLLBACK do with no transaction open?
- Design, most of the grade. Two good answers:
  1. Layered write sets: a base map plus a `Vec<HashMap<String, Option<String>>>`, one layer per open transaction, where `None` is a tombstone. BEGIN pushes an empty layer, ROLLBACK pops one, COMMIT pops one and merges it into the layer below (or applies it to the base), and GET searches from the top down. O(depth) per read, O(keys written) per commit or rollback.
  2. An undo log: apply every write to one map at once, and record in the innermost transaction's log the value each key had before its FIRST write in that transaction (`log.entry(key).or_insert(old)`). ROLLBACK puts every logged key back to its logged value (or removes it), and COMMIT merges the log into the parent's log, keeping the parent's older entries. O(1) per read, O(keys written) per commit or rollback.
  A full copy of the map per BEGIN is correct, but O(n) per BEGIN: exactly what the constraints rule out. `values_are_borrowed_and_moved_never_copied` catches a plain copy, because the restored values are clones living at new addresses. `begin_commit_and_rollback_never_copy_the_store` catches a copy that shares its values through `Rc<str>` (or copies the map on the first write): with 30_000 keys, each transaction takes about a thousand times as long as the same writes on a plain `HashMap`, and the test's budget allows 64 times. The pointer test also catches a `get` that leaks, and a commit that clones the entries it merges.
- Tombstones: inside a transaction a delete must record that the key is gone without touching the layers below, and the tombstone must survive a nested commit. Dropping the `None` entries during the merge brings the old value back (`a_delete_survives_a_nested_commit`). Only the outermost commit turns tombstones into removals, so the base never holds any.
- Complexity: every operation, stated with the depth in it.
- Rust: `get` returns `Option<&str>` borrowed from whichever layer holds the value (`entry.as_deref()` turns an `&Option<String>` into an `Option<&str>`); `parent.extend(top)` moves the `String`s instead of cloning them; `self.layers.pop().ok_or(TxError::NoTransaction)?` is the error check. In Rust the snapshot design is visible in the code: it needs an explicit `.clone()` of the whole map.
- Follow-up questions to expect: COUNT (`set_kv_tx_part2`); a REPL that parses lines like "SET a 10" (a `match` on the words of `split_whitespace()`, errors as values); a guard object that rolls back in `Drop` unless committed (`39_drop_raii/raii2`); sharing the store between threads (a `Mutex` around it, or a private transaction per connection, which leads to MVCC); why `delete` returns a `bool` and not the old value (a value in a lower layer cannot be moved out: a rollback may need it back).

REFERENCE SKETCH
```
type Layer = HashMap<String, Option<String>>;

struct Kv {
    base: HashMap<String, String>,
    layers: Vec<Layer>,
}

fn get(&self, key: &str) -> Option<&str> {
    for layer in self.layers.iter().rev() {
        if let Some(entry) = layer.get(key) {
            return entry.as_deref();
        }
    }
    self.base.get(key).map(String::as_str)
}

fn commit(&mut self) -> Result<(), TxError> {
    let top = self.layers.pop().ok_or(TxError::NoTransaction)?;
    match self.layers.last_mut() {
        Some(parent) => parent.extend(top),
        None => {
            for (key, entry) in top {
                match entry {
                    Some(value) => self.base.insert(key, value),
                    None => self.base.remove(&key),
                };
            }
        }
    }
    Ok(())
}
```
`set` inserts `Some(value)` into the top layer (or into the base when no transaction is open). `delete` returns `false` if `get` finds nothing, and otherwise inserts `None` into the top layer (or removes the key from the base). `begin` pushes an empty layer, and `rollback` pops one."""

[[exercises]]
name = "set_kv_tx_part2"
dir = "68_mock_interviews"
hint = """
This hint is the interviewer's rubric, then a sketch of a reference answer. Grade yourself against the rubric before you read the sketch. (Getting part 1 into this file: copy the fields, helper types and method bodies of your `Kv` from `set_kv_tx`, keep this file's tests, then add `count`. E0599 says "`Kv` is not an iterator" only because `Iterator::count` is the one `count` that rustc knows; do not implement `Iterator`.)

RUBRIC
- The question to answer first: which operations change what `get` sees? `set`, `delete` and `rollback` do. `begin` does not, and neither does `commit`: it only moves writes from one layer to another. Updating the counts in `commit` usually counts twice.
- Design: a `HashMap<String, usize>` from each value to the number of keys that show it, kept in step with every change.
  - `set`: find the key's visible value first; if there is one, take one away from it; then add one to the new value. (Setting the same value again is minus one, plus one.)
  - `delete`: if the key is visible, take one away from its value.
  - `rollback` with layers: pop the top layer; for each of its keys, take one away from the value that layer showed (unless it was a tombstone), and add one to the value the layers below show now (if any). O(keys written x depth).
  - `rollback` with an undo log: for each logged key, take one away from the current value and add one to the logged value as you restore it. O(keys written).
  - Another design: one map of +1/-1 deltas per transaction, and `count` = the base count plus every open transaction's delta. `count` becomes O(depth), `rollback` just drops the top deltas, and `commit` adds them into the parent's.
  Remove a value whose count reaches 0, so the map does not keep every value ever seen.
- Complexity, stated: `count` O(1) (O(depth) with deltas); `set` and `delete` as in part 1; `rollback` as above. Scanning the visible state is O(n) per call (and finding the visible state through the layers costs more). A count that walks only the keys the open transactions wrote is no better, because a transaction can write every key. Both fail `count_and_rollback_do_not_scan_the_store`, where a transaction rewrites all 40_000 keys: each `count` then takes over ten thousand times as long as one lookup in a plain `HashMap`, and the test's budget allows 64 times. So does recounting the whole store on every rollback.
- Rust: in `set`, `self.get(key)` borrows all of `self`, so taking one away from `self.counts` while you hold the old value is E0502 "cannot borrow `self.counts` as mutable because it is also borrowed as immutable". `.map(str::to_owned)` on the old value compiles but allocates on every `set`. The structural fix is a free function over the two fields that `get` reads, `lookup(&self.base, &self.layers, key)`: it borrows only those fields, so `self.counts` stays free (a split borrow, `37_borrowck_errors/borrowck1`). And `counts.get_mut(value)` before `counts.insert(value.to_string(), 1)` allocates only for a value seen for the first time, where `counts.entry(value.to_string())` allocates on every call.
- Follow-up questions to expect: large values (count by an interned id or an `Rc<str>` instead of a second copy of every distinct value); "how many keys have a value starting with p?" (a sorted `BTreeMap<String, usize>` and a range over it); and the honest one: did your part-1 design make this easy, or did you have to rework it?

REFERENCE SKETCH
```
fn lookup<'a>(base: &'a HashMap<String, String>, layers: &'a [Layer], key: &str) -> Option<&'a str> {
    for layer in layers.iter().rev() {
        if let Some(entry) = layer.get(key) {
            return entry.as_deref();
        }
    }
    base.get(key).map(String::as_str)
}

fn set(&mut self, key: &str, value: &str) {
    if let Some(old) = lookup(&self.base, &self.layers, key) {
        uncount_one(&mut self.counts, old);
    }
    count_one(&mut self.counts, value);
    // ...then part 1's write.
}

fn rollback(&mut self) -> Result<(), TxError> {
    let top = self.layers.pop().ok_or(TxError::NoTransaction)?;
    for (key, entry) in &top {
        if let Some(value) = entry {
            uncount_one(&mut self.counts, value);
        }
        if let Some(restored) = lookup(&self.base, &self.layers, key) {
            count_one(&mut self.counts, restored);
        }
    }
    Ok(())
}

fn count(&self, value: &str) -> usize {
    self.counts.get(value).copied().unwrap_or(0)
}
```
`count_one` adds one (inserting the value on first sight), and `uncount_one` takes one away and removes the value at 0. `delete` uncounts the visible value before it writes its tombstone. `get` becomes `lookup(&self.base, &self.layers, key)`, and `begin` and `commit` stay exactly as in part 1."""
